<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Byelingua · Schedule</title>
<style>
:root{--ink:#17201b;--muted:#68716b;--paper:#f5f2e9;--card:#fffdf8;--forest:#214d3a;--soft:#e8eee9;--line:#d7d7ce;--danger:#9e3737}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}a{color:var(--forest)}button{font:inherit;border:1px solid var(--forest);border-radius:5px;padding:8px 11px;background:var(--forest);color:#fff;font-weight:700;cursor:pointer}button.secondary{background:transparent;color:var(--forest);border-color:#aebbb2}button:disabled{opacity:.55;cursor:default}.page{width:min(1120px,calc(100% - 28px));margin:auto;padding:28px 0 56px}.page-head{display:flex;justify-content:space-between;gap:18px;align-items:end}.page-head h1{margin:0;color:var(--forest);font:500 32px/1.1 Georgia,serif}.hint,.meta{color:var(--muted);font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.status{min-height:20px;margin:8px 0}.error{color:var(--danger)}.success{color:var(--forest)}.calendar{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}.day{border-bottom:1px solid var(--line);padding:16px}.day:last-child{border-bottom:0}.day h2{margin:0 0 10px;color:var(--forest);font:500 21px Georgia,serif}.event{display:grid;grid-template-columns:76px 1fr auto;gap:12px;padding:11px 0;border-top:1px solid #e6e5de;align-items:start}.event:first-of-type{border-top:0}.time{font-weight:800;color:var(--forest)}.event h3{margin:0 0 3px;font:600 17px/1.2 Georgia,serif}.badge{display:inline-block;margin-top:5px;padding:2px 7px;border-radius:999px;background:var(--soft);font-size:11px;color:var(--forest)}.empty{padding:28px 0;color:var(--muted)}.footer-actions{margin-top:18px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.share-note{margin-top:12px;color:var(--muted);font-size:12px}@media(max-width:650px){.page{width:calc(100% - 20px);padding-top:18px}.page-head{align-items:flex-start;flex-direction:column}.event{grid-template-columns:62px 1fr}.event .intent-label{grid-column:2}.footer-actions{flex-direction:column}.footer-actions .actions{width:100%}.footer-actions button,.footer-actions a{width:100%;text-align:center}}
</style></head><body>
<header id="sharedHeader" class="byelingua-compact-header"></header><script src="/shared-i18n.js"></script><script src="/shared-header.js"></script><script>ByelinguaHeader.mount(document.getElementById('sharedHeader'));</script>
<main class="page"><section class="page-head"><div><h1 id="scheduleTitle">Schedule</h1><div id="scheduleMeta" class="hint"></div></div><div class="actions"><button id="edit" class="secondary" type="button">Edit schedule</button><button id="backAccount" class="secondary" type="button">Back to User Center</button></div></section><div id="status" class="status"></div><section id="calendar" class="calendar"></section><div class="footer-actions"><div id="shareNote" class="hint share-note">Your schedule is saved to your account. You can regenerate and download its files at any time.</div><div class="actions"><button id="downloadImage" type="button">Download calendar image</button><button id="downloadIcs" type="button">Download ICS</button><button id="emailSchedule" type="button">Email this schedule</button></div></div></main>
<script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),params=new URLSearchParams(location.search),scheduleId=params.get('schedule_id')||'',language=window.ByelinguaI18n.getUiLanguage();
const COPY={zh:{title:'行程成果',edit:'编辑行程',account:'返回用户中心',image:'下载日历图片',ics:'下载 ICS',email:'发送到邮箱',loading:'正在读取行程…',empty:'这个行程还没有演出。',range:'日期范围',events:'场演出',sent:'行程已发送到你的注册邮箱。',sending:'正在发送…',imageError:'日历图片生成失败，但 ICS 和页面仍可使用。',downloaded:'已下载日历图片。',onlyPlanned:'只有已确认的行程可以查看成果页。',shareNote:'行程已保存至你的账户，你可以随时重新生成并下载相关文件。',intent:{must_go:'一定要去',optional:'可选',maybe_go:'可选',interested:'感兴趣'}},en:{title:'Schedule result',edit:'Edit schedule',account:'Back to User Center',image:'Download calendar image',ics:'Download ICS',email:'Email this schedule',loading:'Loading schedule…',empty:'This schedule has no events.',range:'Date range',events:'events',sent:'The schedule was sent to your registered email.',sending:'Sending…',imageError:'Calendar image generation failed; the page and ICS are still available.',downloaded:'Calendar image downloaded.',onlyPlanned:'Only confirmed schedules have a result page.',shareNote:'Your schedule is saved to your account. You can regenerate and download its files at any time.',intent:{must_go:'Must attend',optional:'Optional',maybe_go:'Optional',interested:'Interested'}}};const t=k=>COPY[language][k]||k;
let schedule=null,rows=[],relations=new Map();
function token(){for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i)||'';if(!k.startsWith('sb-')||!k.endsWith('-auth-token'))continue;try{const v=JSON.parse(localStorage.getItem(k)||'{}');if(v.access_token)return v.access_token}catch(_){}}return ''}
async function api(payload){const headers={'Content-Type':'application/json'},value=token();if(value)headers.Authorization=`Bearer ${value}`;const r=await fetch('/api',{method:'POST',headers,body:JSON.stringify(payload)}),d=await r.json();if(!r.ok)throw Error(window.ByelinguaI18n.localizeApiError(d));return d}
function dateOf(e){return String(e.date||'').slice(0,10)}function timeOf(e){return String(e.start_time||'').slice(0,5)}function cityOf(e){return String(e.city||e.location_city||'').trim()}function intentOf(key){return COPY[language].intent[relations.get(String(key))?.intent_status||'interested']||''}function titleOf(e){return e.title||e.work_title||'Event'}
function setStatus(message,error=false){$('status').textContent=message||'';$('status').className=message?`status ${error?'error':'success'}`:'status'}
function render(){document.documentElement.lang=language==='en'?'en-GB':'zh-CN';const dates=rows.map(r=>dateOf(r.event||{})).filter(Boolean).sort(),cities=[...new Set(rows.map(r=>cityOf(r.event||{})).filter(Boolean))];$('scheduleTitle').textContent=schedule.title||t('title');$('scheduleMeta').textContent=`${t('range')}: ${window.ByelinguaI18n.formatDateRange(dates[0],dates[dates.length-1],language)} · ${cities.join(' · ')} · ${rows.length} ${t('events')}`;$('shareNote').textContent=t('shareNote');const groups={};rows.forEach(r=>(groups[dateOf(r.event||{})]??=[]).push(r));const html=Object.keys(groups).sort().map(date=>`<section class="day"><h2>${esc(window.ByelinguaI18n.formatDate(date,language))}</h2>${groups[date].sort((a,b)=>timeOf(a.event||{}).localeCompare(timeOf(b.event||{}))).map(r=>{const e=r.event||{},url=e.source_url||e.detail_url||e.original_url||'';return `<article class="event"><div class="time">${esc(timeOf(e)||'—')}</div><div><h3>${url?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(titleOf(e))}</a>`:esc(titleOf(e))}</h3><div class="meta">${esc([e.venue,cityOf(e),e.organization].filter(Boolean).join(' · '))}</div><span class="badge">${esc(window.ByelinguaI18n.formatEventType(e.event_type,language))}</span></div><div class="intent-label meta">${esc(intentOf(r.event_key))}</div></article>`}).join('')}</section>`).join('');$('calendar').innerHTML=html||`<div class="empty">${t('empty')}</div>`}
function safeFilename(){const title=String(schedule?.title||'schedule').normalize('NFKD').replace(/[^A-Za-z0-9._-]+/g,'_').replace(/^_+|_+$/g,'')||'schedule';return `byelingua-${title}-${schedule?.start_date||'schedule'}-${schedule?.end_date||''}`.replace(/-+$/,'')}
function drawText(ctx,text,x,y,maxWidth,lineHeight){let line='';for(const char of String(text||'')){const next=line+char;if(ctx.measureText(next).width>maxWidth&&line){ctx.fillText(line,x,y);y+=lineHeight;line=char}else line=next}if(line){ctx.fillText(line,x,y);y+=lineHeight}return y}
function downloadCalendarImage(){try{const grouped={};rows.forEach(r=>(grouped[dateOf(r.event||{})]??=[]).push(r));const dates=Object.keys(grouped).sort(),width=1400,pad=70,rowH=74,headerH=220,dayH=54;let height=headerH;dates.forEach(d=>{height+=dayH+grouped[d].length*rowH+28});const scale=2,canvas=document.createElement('canvas');canvas.width=width*scale;canvas.height=height*scale;const ctx=canvas.getContext('2d');ctx.scale(scale,scale);ctx.fillStyle='#f5f2e9';ctx.fillRect(0,0,width,height);ctx.fillStyle='#214d3a';ctx.font='700 34px Georgia,serif';ctx.fillText('BYELINGUA',pad,65);ctx.fillStyle='#17201b';ctx.font='700 28px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';ctx.fillText(String(schedule.title||'Schedule'),pad,112);ctx.fillStyle='#68716b';ctx.font='18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';ctx.fillText(`${schedule.start_date||''} – ${schedule.end_date||''}`,pad,150);let y=headerH;dates.forEach(date=>{ctx.fillStyle='#e8eee9';ctx.fillRect(pad,y,width-pad*2,dayH);ctx.fillStyle='#214d3a';ctx.font='700 21px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';ctx.fillText(date,pad+18,y+35);y+=dayH+8;grouped[date].sort((a,b)=>timeOf(a.event||{}).localeCompare(timeOf(b.event||{}))).forEach(r=>{const e=r.event||{};ctx.fillStyle='#17201b';ctx.font='700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';ctx.fillText(timeOf(e)||'—',pad+12,y+25);ctx.font='600 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';let next=drawText(ctx,titleOf(e),pad+130,y+25,width-pad*2-150,23);ctx.fillStyle='#68716b';ctx.font='16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';drawText(ctx,[e.venue,cityOf(e)].filter(Boolean).join(' · '),pad+130,next,width-pad*2-150,20);ctx.strokeStyle='#d7d7ce';ctx.beginPath();ctx.moveTo(pad,y+rowH-8);ctx.lineTo(width-pad,y+rowH-8);ctx.stroke();y+=rowH})});canvas.toBlob(blob=>{if(!blob)throw Error();const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=safeFilename()+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);setStatus(t('downloaded'))},'image/png')}catch(error){setStatus(t('imageError'),true)}}
async function downloadIcs(){const b=$('downloadIcs');b.disabled=true;try{const d=await api({action:'export_schedule_ics',schedule_id:scheduleId});const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([d.ics],{type:'text/calendar;charset=utf-8'}));a.download=d.filename||safeFilename()+'.ics';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}catch(error){setStatus(error.message,true)}finally{b.disabled=false}}
async function emailSchedule(){const b=$('emailSchedule');if(b.disabled)return;b.disabled=true;b.textContent=t('sending');setStatus(t('sending'));try{await api({action:'send_schedule_email',schedule_id:scheduleId});setStatus(t('sent'))}catch(error){setStatus(error.message,true)}finally{b.disabled=false;b.textContent=t('email')}}
async function init(){document.title=`Byelingua · ${t('title')}`;$('edit').textContent=t('edit');$('backAccount').textContent=t('account');$('downloadImage').textContent=t('image');$('downloadIcs').textContent=t('ics');$('emailSchedule').textContent=t('email');$('calendar').innerHTML=`<div class="empty">${t('loading')}</div>`;$('edit').onclick=()=>location.href=`/schedule-editor.html?schedule_id=${encodeURIComponent(scheduleId)}`;$('backAccount').onclick=()=>location.href='/account.html';$('downloadImage').onclick=downloadCalendarImage;$('downloadIcs').onclick=downloadIcs;$('emailSchedule').onclick=emailSchedule;if(!scheduleId){setStatus('Missing schedule_id.',true);return}try{const d=await api({action:'get_schedule',schedule_id:scheduleId});schedule=d.schedule;rows=d.events||[];if(schedule.status!=='planned'){setStatus(t('onlyPlanned'),true);return}const keys=rows.map(r=>r.event_key).filter(Boolean),rel=keys.length?await api({action:'get_event_relations',event_keys:keys}):{relations:[]};relations=new Map((rel.relations||[]).map(r=>[String(r.event_key),r]));render()}catch(error){setStatus(error.message,true)}}init();
</script><script>window.addEventListener('byelingua-language-change',()=>location.reload());</script></body></html>

name: Work Character Catalog V1 — Live Readonly

on:
  push:
    branches:
      - character-master-v1
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_READONLY_KEY: ${{ secrets.SUPABASE_READONLY_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install season ingestion dependencies
        run: pip install -r requirements-season-ingestion.txt
      - name: Readonly credential preflight
        id: credential_preflight
        run: python jobs/check_season_ingestion_credentials.py --mode dry-run
      - name: Catalog import preflight
        id: catalog_import_preflight
        run: python -c "import jobs.ingest_work_character_catalog_v1; print('CATALOG_IMPORT_PREFLIGHT=PASS')"
      - name: Run live readonly catalog bootstrap and ingestion
        id: catalog_run
        run: |
          mkdir -p work-character-catalog-output
          python -m jobs.ingest_work_character_catalog_v1 \
            --output-dir work-character-catalog-output
      - name: Write GitHub Step Summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          summary_path = Path("work-character-catalog-output/summary.json")
          if not summary_path.exists():
              import os
              if os.environ.get("CATALOG_RUN_OUTCOME") == "failure":
                  status = "RUNNER_EXECUTION_FAILED"
              elif os.environ.get("CREDENTIAL_OUTCOME") == "failure":
                  status = "BOOTSTRAP_BLOCKED_CREDENTIALS"
              else:
                  status = "BOOTSTRAP_BLOCKED_GLOBAL_MASTER"
              print(f"WORK CHARACTER CATALOG V1\n\n{status}")
              raise SystemExit(0)
          data = json.loads(summary_path.read_text(encoding="utf-8"))
          counts = data
          join = data.get("join_health", {})
          result = data.get("all_work", {})
          lines = [
              "## WORK CHARACTER CATALOG V1", "",
              f"Git SHA: `{data.get('git_sha')}`", f"Snapshot hash: `{data.get('snapshot_hash')}`", "",
              "### GLOBAL MASTER", "",
          ]
          for key in ("characters_count", "character_aliases_count", "work_character_count", "linked_count", "unlinked_count", "works_with_unlinked_count"):
              lines.append(f"- {key}: {counts.get(key)}")
          lines += ["", "### JOIN HEALTH", ""]
          for key in ("unlinked_rows_with_work", "unlinked_rows_missing_work", "works_with_composer_id", "works_with_composer_name", "works_missing_composer_master"):
              lines.append(f"- {key}: {join.get(key)}")
          lines += ["", "### PILOT", ""]
          for item in data.get("pilot", []):
              lines.append(f"- {item.get('work_title')}: {item.get('match_count')} input match(es)")
          lines += ["", "### CATALOG", "", f"- all_works_run: {result.get('all_works_run')}", f"- works_total: {result.get('works')}", f"- classification_counts: `{json.dumps(data.get('classification_counts', {}), ensure_ascii=False, sort_keys=True)}`", "", "### WRITES", "", "- production_writes: 0"]
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
        env:
          CATALOG_RUN_OUTCOME: ${{ steps.catalog_run.outcome }}
          CREDENTIAL_OUTCOME: ${{ steps.credential_preflight.outcome }}
      - name: Prepare minimized safe artifacts
        if: always()
        run: |
          mkdir -p work-character-catalog-summary
          if [ -f work-character-catalog-output/summary.json ]; then cp work-character-catalog-output/summary.json work-character-catalog-summary/summary.json; fi
          if [ -f work-character-catalog-output/pilot_diagnostics.json ]; then cp work-character-catalog-output/pilot_diagnostics.json work-character-catalog-summary/pilot_diagnostics.json; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: work-character-catalog-v1-${{ github.sha }}
          path: work-character-catalog-summary/
          if-no-files-found: warn

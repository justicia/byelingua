name: Cloud Official Source Capability Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe Opernhaus Zürich official season source
        run: python jobs/probe_official_source.py --output source-probe-summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-source-probe-opernhaus-zurich-2026-27
          path: source-probe-summary.json
          if-no-files-found: error

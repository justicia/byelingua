name: Prepare season batch

on:
  workflow_dispatch:
    inputs:
      season:
        description: Season identifier
        required: true
        default: 2026-27
        type: string
      venues:
        description: all or a comma-separated configured venue list
        required: true
        default: all
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-season-ingestion.txt
      - name: Prepare all venues independently
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_READONLY_KEY: ${{ secrets.SUPABASE_READONLY_KEY }}
          INPUT_SEASON: ${{ inputs.season }}
          INPUT_VENUES: ${{ inputs.venues }}
        run: python jobs/prepare_season_batch.py --season "$INPUT_SEASON" --venues "$INPUT_VENUES"
      - name: Upload staging and aggregate report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: season-batch-${{ inputs.season }}
          path: season-batch-output/
          if-no-files-found: error
          retention-days: 30

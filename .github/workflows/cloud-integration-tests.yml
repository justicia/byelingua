name: Cloud Integration Tests

on:
  push:
    branches:
      - integrate-cloud-season-ingestion-v1

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-season-ingestion.txt pytest pyyaml
      - name: Run relevant cloud ingestion tests
        run: pytest -q test_season_ingestion_pipeline_v1.py test_notifications.py test_credentials.py test_production_graph.py
      - name: Validate workflow YAML
        run: python - <<'PY'
          import yaml
          for path in ['.github/workflows/season-ingestion.yml','.github/workflows/cloud-season-ingestion.yml']:
              with open(path, encoding='utf-8') as f:
                  yaml.safe_load(f)
              print('VALID', path)
          PY

name: Venue Onboarding Factory V1

on:
  workflow_dispatch:
    inputs:
      season:
        description: Season to onboard
        required: true
        default: 2026-27
        type: string
      scope:
        description: Target queue scope
        required: true
        default: all-enabled
        type: choice
        options: [all-enabled, pending, selected]
      mode:
        description: Dry-run only; production apply is a separate approved operation
        required: true
        default: dry-run
        type: choice
        options: [dry-run]
      venue_ids:
        description: Comma-separated venue IDs when scope is selected
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-season-ingestion.txt
      - id: targets
        env:
          SEASON: ${{ inputs.season }}
          SCOPE: ${{ inputs.scope }}
          VENUE_IDS: ${{ inputs.venue_ids }}
        run: |
          matrix=$(python -c "import json,os; from season_ingestion.venue_targets import load_targets,matrix_targets; selected=[v.strip() for v in os.environ.get('VENUE_IDS','').split(',') if v.strip()]; print(json.dumps({'include':matrix_targets(load_targets(season=os.environ['SEASON'],scope=os.environ['SCOPE'],selected=selected))},ensure_ascii=False))")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  onboard:
    needs: prepare
    if: inputs.mode == 'dry-run'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_READONLY_KEY: ${{ secrets.SUPABASE_READONLY_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-season-ingestion.txt
      - name: Run independent venue onboarding
        run: python jobs/run_venue_onboarding_target.py --venue-id "${{ matrix.venue_id }}" --season "${{ matrix.season }}" --output-root onboarding-output
      - name: Validate complete venue artifact
        env:
          VENUE_OUTPUT: onboarding-output/${{ matrix.venue_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["VENUE_OUTPUT"])
          required = (
              "source_audit.json",
              "raw.json",
              "normalized.json",
              "snapshot.json",
              "resolution_staging.json",
              "final_staging.json",
              "summary.json",
          )
          failures = []
          for name in required:
              path = root / name
              if not path.is_file():
                  failures.append(f"{name}: missing")
                  continue
              try:
                  json.loads(path.read_text(encoding="utf-8"))
              except (OSError, UnicodeDecodeError, json.JSONDecodeError) as exc:
                  failures.append(f"{name}: invalid JSON ({exc})")
          if failures:
              raise SystemExit("Venue artifact contract failed: " + "; ".join(failures))
          print(f"Validated {len(required)} required JSON artifacts in {root}")
          PY
      - name: Materialize safe venue summary
        if: always()
        run: |
          python jobs/prepare_cloud_artifacts.py \
            --input-dir "onboarding-output/${{ matrix.venue_id }}" \
            --output-dir "cloud-artifacts/${{ matrix.venue_id }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: work-character-catalog-summary-${{ matrix.venue_id }}
          path: cloud-artifacts/${{ matrix.venue_id }}/
          if-no-files-found: error

  summarize:
    if: always() && inputs.mode == 'dry-run'
    needs: [prepare, onboard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-season-ingestion.txt
      - uses: actions/download-artifact@v4
        with:
          path: cloud-artifacts
      - run: PYTHONPATH=. python jobs/aggregate_cloud_summaries.py --input-root cloud-artifacts --output-dir cloud-artifacts/aggregate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: venue-onboarding-factory-${{ inputs.season }}
          path: |
            cloud-artifacts/aggregate/summary.json
            cloud-artifacts/aggregate/pilot_diagnostics.json
          if-no-files-found: error

name: Europe Automatic Season Ingestion Factory V1

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      season:
        description: Season to ingest
        required: true
        default: 2026-27
        type: string
      scope:
        description: Enabled-target selection scope; ingestion remains full-season
        required: true
        default: all-enabled
        type: choice
        options: [all-enabled, pending, selected]
      venue_ids:
        description: Comma-separated venue IDs when scope is selected
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

jobs:
  factory:
    runs-on: ubuntu-latest
    env:
      FACTORY_SEASON: ${{ inputs.season || '2026-27' }}
      FACTORY_SCOPE: ${{ inputs.scope || 'all-enabled' }}
      FACTORY_VENUE_IDS: ${{ inputs.venue_ids || '' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_READONLY_KEY: ${{ secrets.SUPABASE_READONLY_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-season-ingestion.txt
      - name: Prepare ephemeral factory state
        run: mkdir -p .factory-state onboarding-output cloud-artifacts
      - name: Restore source fingerprints
        uses: actions/cache@v4
        with:
          path: .factory-state
          key: europe-auto-ingestion-state-${{ github.run_id }}
          restore-keys: europe-auto-ingestion-state-
      - name: Run full-season read-only factory
        run: |
          python jobs/run_europe_auto_factory.py \
            --season "$FACTORY_SEASON" \
            --scope "$FACTORY_SCOPE" \
            --venue-ids "$FACTORY_VENUE_IDS" \
            --output-root onboarding-output \
            --state-path .factory-state/source-hashes.json
      - name: Materialize safe summaries only
        if: always()
        run: |
          for venue_dir in onboarding-output/*; do
            if [ -d "$venue_dir" ] && [ -f "$venue_dir/summary.json" ]; then
              venue_id=$(basename "$venue_dir")
              python jobs/prepare_cloud_artifacts.py \
                --input-dir "$venue_dir" \
                --output-dir "cloud-artifacts/$venue_id"
            fi
          done
          PYTHONPATH=. python jobs/aggregate_cloud_summaries.py \
            --input-root cloud-artifacts \
            --output-dir cloud-artifacts/aggregate \
            --season "$FACTORY_SEASON"
      - name: Publish factory Step Summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("cloud-artifacts/aggregate/summary.json")
          summary = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {}
          lines = [
              "# Europe Automatic Season Ingestion Factory V1",
              "",
              f"Season: {summary.get('season', os.environ.get('FACTORY_SEASON'))}",
              f"Targets: {summary.get('targets', 0)}",
              "",
          ]
          for venue in summary.get("venues", []):
              counts = venue.get("counts", {})
              incremental = venue.get("incremental", {})
              lines.append(
                  f"- {venue.get('venue')}: {venue.get('source_capability')}; "
                  f"events={counts.get('events_discovered', 0)}; "
                  f"programme={counts.get('programme_items', 0)}; "
                  f"credits={counts.get('credits_total', 0)}; "
                  f"incremental={incremental.get('action', 'PROCESS')}"
              )
          lines.append("")
          lines.append("Production writes: 0")
          target = os.environ.get("GITHUB_STEP_SUMMARY")
          if target:
              Path(target).write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: europe-auto-ingestion-summary-${{ github.run_id }}
          path: |
            cloud-artifacts/**/summary.json
            cloud-artifacts/**/pilot_diagnostics.json
          if-no-files-found: error

name: Cloud Season Ingestion Pipeline V1

on:
  workflow_dispatch:
    inputs:
      venue:
        description: Verified official venue adapter
        required: true
        type: choice
        options:
          - teatro_real
          - operadeparis
          - philharmonie_paris
          - auditorio_nacional
          - teatro_alla_scala
          - opera_roma
      season:
        description: Season (September through August)
        required: true
        default: 2026-27
        type: string
      mode:
        description: Read-only cloud ingestion; production apply is a separate approved operation
        required: true
        default: dry-run
        type: choice
        options: [dry-run, probe]
      scope:
        description: Full season discovery or read-only existing-production closeout
        required: true
        default: full-season
        type: choice
        options: [full-season, existing-production]

permissions:
  contents: read
  actions: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-season-ingestion.txt
      - name: Dry-run credential preflight
        if: inputs.mode == 'dry-run'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_READONLY_KEY: ${{ secrets.SUPABASE_READONLY_KEY }}
        run: python jobs/check_season_ingestion_credentials.py --mode dry-run
      - name: Probe official source
        if: inputs.mode == 'probe'
        run: |
          python jobs/probe_official_source.py \
            --venue "${{ inputs.venue }}" \
            --season "${{ inputs.season }}" \
            --output source-probe-summary.json
      - name: Run shared cloud entrypoint
        if: inputs.mode == 'dry-run'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_READONLY_KEY: ${{ secrets.SUPABASE_READONLY_KEY }}
          INPUT_VENUE: ${{ inputs.venue }}
          INPUT_SEASON: ${{ inputs.season }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_SCOPE: ${{ inputs.scope }}
        run: |
          python -m season_ingestion.run \
            --venue "${{ inputs.venue }}" \
            --season "${{ inputs.season }}" \
            --mode "${{ inputs.mode }}" \
            --scope "${{ inputs.scope }}" \
            --output-dir season-ingestion-output
      - name: Write Cloud Run Status summary
        if: always() && inputs.mode == 'dry-run'
        env:
          GITHUB_SHA: ${{ github.sha }}
          INPUT_VENUE: ${{ inputs.venue }}
          INPUT_SEASON: ${{ inputs.season }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_SCOPE: ${{ inputs.scope }}
        run: |
          python jobs/notify_season_run.py --output-dir season-ingestion-output
      - name: Materialize safe cloud artifacts
        if: always() && inputs.mode == 'dry-run'
        run: |
          python jobs/prepare_cloud_artifacts.py \
            --input-dir season-ingestion-output \
            --output-dir cloud-artifacts
      - uses: actions/upload-artifact@v4
        if: always() && inputs.mode == 'dry-run'
        with:
          name: work-character-catalog-summary
          path: cloud-artifacts/
          if-no-files-found: error

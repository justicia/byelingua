name: Manual season ingestion

on:
  workflow_dispatch:
    inputs:
      venue:
        description: Venue adapter
        required: true
        type: choice
        options:
          - wiener_staatsoper
          - operadeparis
          - philharmonie_paris
          - teatro_real
          - auditorio_nacional
      season:
        description: Season (September through August)
        required: true
        default: 2026-27
        type: string
      mode:
        description: Dry-run or guarded production write
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - write

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements-season-ingestion.txt

      - name: Run dry-run
        if: ${{ inputs.mode == 'dry-run' }}
        env:
          INGEST_VENUE: ${{ inputs.venue }}
          INGEST_SEASON: ${{ inputs.season }}
        run: |
          python jobs/sync_season.py \
            --venue "$INGEST_VENUE" \
            --season "$INGEST_SEASON" \
            --mode dry-run \
            --output-dir season-ingestion-output

      - name: Run guarded write
        if: ${{ inputs.mode == 'write' }}
        env:
          INGEST_VENUE: ${{ inputs.venue }}
          INGEST_SEASON: ${{ inputs.season }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python jobs/sync_season.py \
            --venue "$INGEST_VENUE" \
            --season "$INGEST_SEASON" \
            --mode apply \
            --report-file reconciliation-report.json

      - name: Upload dry-run artifact
        uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.mode == 'dry-run' }}
        with:
          name: season-ingestion-${{ inputs.venue }}-${{ inputs.season }}-dry-run
          path: season-ingestion-output/
          if-no-files-found: error
          retention-days: 30

      - name: Upload write reconciliation report
        uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.mode == 'write' }}
        with:
          name: season-ingestion-${{ inputs.venue }}-${{ inputs.season }}-write
          path: reconciliation-report.json
          if-no-files-found: error
          retention-days: 30

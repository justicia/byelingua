name: Manual season ingestion

on:
  workflow_dispatch:
    inputs:
      venue:
        description: Venue adapter
        required: true
        type: choice
        options:
          - wiener_staatsoper
      season:
        description: Season (September through August)
        required: true
        default: 2026-27
        type: string
      mode:
        description: Dry run, read-only preflight, or disabled apply guard
        required: true
        default: dry-run
        type: choice
        options: [dry-run, preflight, apply]

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    environment: ${{ inputs.mode == 'preflight' && 'season-ingestion-preflight' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-season-ingestion.txt
      - name: Ingest season
        env:
          SUPABASE_URL: ${{ contains(fromJSON('["preflight","apply"]'), inputs.mode) && secrets.SUPABASE_URL || '' }}
          SUPABASE_READONLY_KEY: ${{ secrets.SUPABASE_READONLY_KEY }}
        run: python jobs/sync_season.py --venue "${{ inputs.venue }}" --season "${{ inputs.season }}" --mode "${{ inputs.mode }}" --report-file reconciliation-report.json
      - uses: actions/upload-artifact@v4
        if: always() && inputs.mode == 'dry-run'
        with:
          name: season-ingestion-${{ inputs.venue }}-${{ inputs.season }}-dry-run
          path: season-ingestion-output/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && inputs.mode == 'preflight'
        with:
          name: season-ingestion-${{ inputs.venue }}-${{ inputs.season }}-preflight
          path: reconciliation-report.json
          if-no-files-found: error

name: Cloud Season Ingestion Pipeline V1

on:
  workflow_dispatch:
    inputs:
      venue:
        description: Venue adapter or runtime staging input
        required: true
        type: choice
        options:
          - munich_bayerische_staatsoper
      season:
        description: Season (September through August)
        required: true
        default: 2026-27
        type: string
      mode:
        description: Read-only cloud staging; apply remains disabled in V1
        required: true
        default: dry-run
        type: choice
        options: [dry-run, apply]

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-season-ingestion.txt
      - name: Run shared cloud entrypoint
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_READONLY_KEY: ${{ secrets.SUPABASE_READONLY_KEY }}
        run: |
          python -m season_ingestion.run \
            --venue "${{ inputs.venue }}" \
            --season "${{ inputs.season }}" \
            --mode "${{ inputs.mode }}" \
            --output-dir season-ingestion-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: season-ingestion-${{ inputs.venue }}-${{ inputs.season }}-${{ inputs.mode }}
          path: season-ingestion-output/
          if-no-files-found: error

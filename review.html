<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Byelingua · Review</title>
<style>
:root{--ink:#17201b;--muted:#68716b;--paper:#f5f2e9;--card:#fffdf8;--forest:#214d3a;--soft:#e8eee9;--line:#d7d7ce;--danger:#9e3737;--gold:#a4771f}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}button,textarea,input{font:inherit}button{cursor:pointer}a{color:inherit}.page{width:min(980px,calc(100% - 40px));margin:auto;padding:24px 0 72px}.section-nav{display:flex;gap:26px;align-items:center;border-bottom:1px solid var(--line);padding:0 0 12px;margin-bottom:24px;overflow:auto}.section-nav a{color:var(--muted);font-size:13px;font-weight:650;text-decoration:none;white-space:nowrap}.section-nav a.active{color:var(--forest);text-decoration:underline;text-underline-offset:5px}.event-head{border-bottom:1px solid var(--line);padding-bottom:22px}.eyebrow{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.1em}.event-head h1{margin:5px 0 8px;color:var(--forest);font:500 34px/1.08 Georgia,"Times New Roman",serif}.event-meta{color:var(--muted)}.public-score{display:flex;align-items:flex-end;gap:12px;margin-top:15px}.score-number{color:var(--forest);font:500 38px/.9 Georgia,serif}.score-outof{color:var(--muted);font-size:12px}.rating-count{color:var(--muted);font-size:12px;padding-bottom:3px}.panel{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:18px;margin-top:18px}.panel h2{margin:0 0 6px;color:var(--forest);font:500 24px/1.1 Georgia,serif}.panel-copy{color:var(--muted);font-size:12px;margin-bottom:12px}.rating-section{border-top:1px solid var(--line);padding:14px 0}.rating-section:first-of-type{border-top:0}.rating-section h3{margin:0 0 8px;color:var(--forest);font:600 16px Georgia,serif}.rating-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:7px 0}.rating-name{font-weight:650}.rating-detail{color:var(--muted);font-size:11px;margin-top:1px}.stars-input{display:inline-flex;gap:2px}.star-button{border:0;background:transparent;padding:1px 2px;color:#b8b5aa;font-size:23px;line-height:1;cursor:pointer}.star-button.on{color:var(--gold)}.star-button:focus-visible{outline:2px solid var(--forest);outline-offset:2px;border-radius:3px}.composite{display:flex;justify-content:space-between;align-items:baseline;gap:16px;border-top:1px solid var(--line);padding-top:15px;margin-top:6px}.composite strong{color:var(--forest);font:500 27px Georgia,serif}.comment-label{display:block;margin:18px 0 6px;font-weight:650}.comment{width:100%;min-height:150px;resize:vertical;padding:11px;border:1px solid #c8cdc5;border-radius:5px;background:#fff;color:var(--ink);line-height:1.6}.identity{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:14px}.identity label{display:inline-flex;gap:6px;align-items:center}.save-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px}.save-row button{border:1px solid var(--forest);border-radius:5px;padding:9px 15px;background:var(--forest);color:#fff;font-weight:700}.save-row button:disabled{opacity:.55;cursor:default}.status{min-height:20px;color:var(--muted)}.error{color:var(--danger)}.schema-warning{padding:10px 12px;border:1px solid #d6c29f;background:#fff9ea;border-radius:6px;color:#6c562c;margin-top:12px}.login-note{padding:10px 0;color:var(--muted)}.review-list{display:grid;gap:10px;margin-top:12px}.review-card{border-top:1px solid var(--line);padding:15px 0 4px}.review-card:first-child{border-top:0}.review-top{display:flex;justify-content:space-between;align-items:baseline;gap:15px}.review-author{font-weight:650;color:var(--forest)}.review-author span{cursor:default}.stars-display{color:var(--gold);letter-spacing:1px}.review-final{color:var(--muted);font-size:12px;margin-left:5px}.review-comment{white-space:pre-wrap;margin-top:8px;line-height:1.65}.review-date{color:var(--muted);font-size:11px}.empty{padding:18px 0;color:var(--muted)}@media(max-width:700px){.page{width:calc(100% - 24px);padding-top:16px}.event-head h1{font-size:29px}.rating-row{grid-template-columns:1fr}.stars-input{justify-self:start}.save-row{align-items:stretch;flex-direction:column}.save-row button{width:100%}.public-score{align-items:baseline}.score-number{font-size:34px}}
</style></head><body><header id="sharedHeader"></header><script src="/shared-i18n.js"></script><script src="/shared-header.js"></script><script>ByelinguaHeader.mount(document.getElementById('sharedHeader'));</script>
<main class="page"><nav class="section-nav" aria-label="Schedule sections"><a href="/schedule.html" data-copy="schedule">Schedule</a><a href="/my-schedule.html" data-copy="mySchedule">My Schedule</a><a href="/trips.html" data-copy="trips">Trips</a><a href="#reviews" class="active" data-copy="review">Review</a></nav><section id="eventHead" class="event-head"><div class="eyebrow" data-copy="performanceReview">Performance Review</div><h1 id="eventTitle">Loading…</h1><div id="eventMeta" class="event-meta"></div><div id="publicScore"></div></section><div id="pageStatus" class="status"></div><div id="schemaWarning" class="schema-warning" hidden></div><section id="editorPanel" class="panel" hidden><h2 data-copy="yourRating">Your rating</h2><div class="panel-copy" data-copy="ratingCopy">五星制。整体演出是你的直接判断，综合分由整体与已评分部分共同计算。</div><div id="ratingForm"></div><label class="comment-label" for="comment" data-copy="comment">Comment</label><textarea id="comment" class="comment" data-placeholder="commentPlaceholder" placeholder="写下对整场演出的评论…"></textarea><div class="identity"><strong data-copy="identity">署名</strong><label><input type="radio" name="identity" value="anonymous" checked> <span data-copy="anonymous">匿名</span></label><label><input type="radio" name="identity" value="public"> <span data-copy="publicName">公开用户名</span></label></div><div class="save-row"><div id="saveStatus" class="status"></div><button id="saveReview" type="button" data-copy="save">保存评分</button></div></section><section id="loginPanel" class="panel" hidden><h2 data-copy="yourRating">Your rating</h2><div class="login-note" data-copy="loginToRate">登录后可以记录这场演出的评分。</div></section><section id="reviews" class="panel"><h2 data-copy="userReviews">User Reviews</h2><div id="reviewSummary" class="panel-copy"></div><div id="reviewList" class="review-list"></div></section></main>
<script>
const $=id=>document.getElementById(id);const params=new URLSearchParams(location.search),eventKey=params.get('event_key')||'';let publicData=null,editorData=null,overall=0,componentRatings=new Map();
const COPY={zh:{schedule:'Schedule',mySchedule:'My Schedule',trips:'Trips',review:'Review',performanceReview:'演出评分',yourRating:'你的评分',ratingCopy:'五星制。整体演出是你的直接判断，综合分由整体与已评分部分共同计算。',overall:'整体演出',conductor:'指挥',soloist:'独奏／演员',orchestra:'乐团／合奏',stage:'舞台',final:'综合分',comment:'Comment',commentPlaceholder:'写下对整场演出的评论…',identity:'署名',anonymous:'匿名',publicName:'公开用户名',save:'保存评分',saving:'正在保存…',saved:'已保存。',loginToRate:'登录后可以记录这场演出的评分。',userReviews:'用户评论',noReviews:'还没有公开评论。',ratings:'个评分',schema:'Review 数据表尚未应用到生产数据库；页面结构可以预览，但暂时不能保存。',loading:'正在读取演出…',ratingRequired:'请先给整体演出评分。',anonymousName:'Anonymous',publicIdentity:'公开',privateIdentity:'匿名'},en:{schedule:'Schedule',mySchedule:'My Schedule',trips:'Trips',review:'Review',performanceReview:'Performance Review',yourRating:'Your rating',ratingCopy:'Five-star scale. Overall is your direct judgement; the final score combines it with the components you choose to rate.',overall:'Overall performance',conductor:'Conductor',soloist:'Soloists / Cast',orchestra:'Orchestra / Ensemble',stage:'Stage',final:'Final score',comment:'Comment',commentPlaceholder:'Write your comment on the performance…',identity:'Identity',anonymous:'Anonymous',publicName:'Public name',save:'Save rating',saving:'Saving…',saved:'Saved.',loginToRate:'Sign in to record your rating for this performance.',userReviews:'User Reviews',noReviews:'No public reviews yet.',ratings:'ratings',schema:'The Review database migration has not been applied to production yet. The page can be previewed, but ratings cannot be saved.',loading:'Loading performance…',ratingRequired:'Please rate the overall performance first.',anonymousName:'Anonymous',publicIdentity:'Public',privateIdentity:'Anonymous'}};
function lang(){return window.ByelinguaI18n.getUiLanguage()==='en'?'en':'zh'}function t(k){return COPY[lang()][k]||k}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function token(){for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i)||'';if(!key.startsWith('sb-')||!key.endsWith('-auth-token'))continue;try{const value=JSON.parse(localStorage.getItem(key)||'{}');if(value.access_token)return value.access_token}catch(_){}}return ''}async function reviewsApi(payload,auth=false){const headers={'Content-Type':'application/json'},value=token();if(auth&&value)headers.Authorization=`Bearer ${value}`;const r=await fetch('/api/reviews',{method:'POST',headers,body:JSON.stringify(payload)}),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}function eventLocation(event){return [event.organization,event.venue,event.room,event.city].filter((x,i,a)=>x&&a.indexOf(x)===i).join(' · ')}function dateLabel(value){if(!value)return '';return new Intl.DateTimeFormat(lang()==='en'?'en-GB':'zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'short'}).format(new Date(`${value}T12:00:00`))}function starsText(value){const n=Math.max(0,Math.min(5,Math.round(Number(value)||0)));return '★'.repeat(n)+'☆'.repeat(5-n)}function starInput(key,value,label){return `<div class="stars-input" role="radiogroup" aria-label="${esc(label)}">${[1,2,3,4,5].map(n=>`<button type="button" class="star-button ${n<=value?'on':''}" data-star-key="${esc(key)}" data-star-value="${n}" aria-label="${n} / 5">★</button>`).join('')}</div>`}function setComponent(key,value){if(value)componentRatings.set(key,Number(value));else componentRatings.delete(key);renderForm()}function categoryScores(){if(!editorData)return[];const credits=editorData.credits||[],groups={conductor:[],soloist:[],orchestra:[],stage:[]};for(const credit of credits){const key=`credit:${credit.id}`,value=componentRatings.get(key);if(value&&groups[credit.component_type])groups[credit.component_type].push(value)}const stage=componentRatings.get('stage');if(stage)groups.stage.push(stage);return Object.values(groups).filter(values=>values.length).map(values=>values.reduce((a,b)=>a+b,0)/values.length)}function finalScore(){if(!overall)return null;const categories=categoryScores();if(!categories.length)return Number(overall).toFixed(1);const avg=categories.reduce((a,b)=>a+b,0)/categories.length;return ((Number(overall)+avg)/2).toFixed(1)}function creditDetail(credit){const bits=[];if(credit.character||credit.raw_character)bits.push(credit.character||credit.raw_character);if(credit.role&&credit.role!=='performer')bits.push(credit.role);return bits.join(' · ')}
function groupRows(type,title){const credits=(editorData?.credits||[]).filter(row=>row.component_type===type);if(!credits.length)return '';return `<div class="rating-section"><h3>${title}</h3>${credits.map(credit=>{const key=`credit:${credit.id}`,value=componentRatings.get(key)||0;return `<div class="rating-row"><div><div class="rating-name">${esc(credit.artist_name||'—')}</div>${creditDetail(credit)?`<div class="rating-detail">${esc(creditDetail(credit))}</div>`:''}</div>${starInput(key,value,credit.artist_name||title)}</div>`}).join('')}</div>`}function renderForm(){if(!editorData)return;const stage=editorData.stage_applicable?`<div class="rating-section"><h3>${t('stage')}</h3><div class="rating-row"><div><div class="rating-name">${t('stage')}</div></div>${starInput('stage',componentRatings.get('stage')||0,t('stage'))}</div></div>`:'';$('ratingForm').innerHTML=`<div class="rating-section"><div class="rating-row"><div><div class="rating-name">${t('overall')}</div></div>${starInput('overall',overall,t('overall'))}</div></div>${groupRows('conductor',t('conductor'))}${groupRows('soloist',t('soloist'))}${groupRows('orchestra',t('orchestra'))}${stage}<div class="composite"><span>${t('final')}</span><strong>${finalScore()||'—'}${finalScore()?' / 5':''}</strong></div>`;document.querySelectorAll('[data-star-key]').forEach(button=>button.onclick=()=>{const key=button.dataset.starKey,value=Number(button.dataset.starValue);if(key==='overall')overall=value;else setComponent(key,value);if(key==='overall')renderForm()})}
function renderEvent(){const event=editorData?.event||publicData?.event;if(!event)return;$('eventTitle').textContent=event.title||event.original_title||'Untitled event';$('eventMeta').textContent=[dateLabel(event.date),event.start_time?String(event.start_time).slice(0,5):'',eventLocation(event)].filter(Boolean).join(' · ');const summary=publicData?.summary||{};$('publicScore').innerHTML=summary.rating_count?`<div class="public-score"><span class="score-number">${Number(summary.average_final_score??summary.average_rating).toFixed(1)}</span><span class="score-outof">/ 5</span><span class="rating-count">${summary.rating_count} ${t('ratings')}</span></div>`:''}
function renderReviews(){const reviews=publicData?.reviews||[],summary=publicData?.summary||{};$('reviewSummary').textContent=summary.rating_count?`${Number(summary.average_rating||0).toFixed(1)} / 5 · ${summary.rating_count} ${t('ratings')}`:'';$('reviewList').innerHTML=reviews.length?reviews.map(row=>`<article class="review-card"><div class="review-top"><div><span class="review-author"><span>${esc(row.author?.display_name||t('anonymousName'))}</span></span><span class="review-final">${row.final_score?`${Number(row.final_score).toFixed(1)} / 5`:''}</span></div><span class="stars-display">${starsText(row.overall_rating)}</span></div>${row.comment?`<div class="review-comment">${esc(row.comment)}</div>`:''}<div class="review-date">${esc(String(row.updated_at||'').slice(0,10))}</div></article>`).join(''):`<div class="empty">${t('noReviews')}</div>`}
function applyLanguage(){document.querySelectorAll('[data-copy]').forEach(node=>node.textContent=t(node.dataset.copy));$('comment').placeholder=t('commentPlaceholder');document.title=`Byelingua · ${t('review')}`;renderEvent();renderForm();renderReviews()}
async function loadPublic(){publicData=await reviewsApi({action:'public_event_reviews',event_key:eventKey});renderEvent();renderReviews();if(publicData.schema_ready===false){$('schemaWarning').hidden=false;$('schemaWarning').textContent=t('schema')}}async function loadEditor(){if(!token()){$('loginPanel').hidden=false;return}editorData=await reviewsApi({action:'review_editor',event_key:eventKey},true);renderEvent();if(editorData.schema_ready===false){$('schemaWarning').hidden=false;$('schemaWarning').textContent=t('schema');$('editorPanel').hidden=false;$('saveReview').disabled=true}else{$('editorPanel').hidden=false}const review=editorData.review||{};overall=Number(review.overall_rating||0);$('comment').value=review.comment||'';document.querySelector(`input[name="identity"][value="${review.identity_mode||'anonymous'}"]`)?.setAttribute('checked','checked');componentRatings.clear();for(const row of editorData.ratings||[]){if(row.component_type==='stage')componentRatings.set('stage',Number(row.rating));else if(row.event_credit_id)componentRatings.set(`credit:${row.event_credit_id}`,Number(row.rating))}renderForm()}
async function save(){if(!overall){$('saveStatus').textContent=t('ratingRequired');$('saveStatus').className='status error';return}const components=[];for(const [key,rating] of componentRatings.entries()){if(key==='stage')components.push({component_type:'stage',rating});else{const id=key.replace('credit:',''),credit=(editorData.credits||[]).find(row=>String(row.id)===id);if(credit)components.push({component_type:credit.component_type,event_credit_id:id,rating})}}$('saveReview').disabled=true;$('saveStatus').textContent=t('saving');$('saveStatus').className='status';try{await reviewsApi({action:'save_review',event_key:eventKey,overall_rating:overall,components,comment:$('comment').value,identity_mode:document.querySelector('input[name="identity"]:checked')?.value||'anonymous',visibility:'public'},true);$('saveStatus').textContent=t('saved');publicData=await reviewsApi({action:'public_event_reviews',event_key:eventKey});renderEvent();renderReviews();setTimeout(()=>{$('saveStatus').textContent=''},1800)}catch(error){$('saveStatus').textContent=error.message;$('saveStatus').className='status error'}finally{$('saveReview').disabled=false}}
async function load(){if(!eventKey){$('pageStatus').textContent='Missing event_key';$('pageStatus').className='status error';return}$('pageStatus').textContent=t('loading');try{await loadPublic();await loadEditor();$('pageStatus').textContent='';applyLanguage()}catch(error){$('pageStatus').textContent=error.message;$('pageStatus').className='status error'}}$('saveReview').onclick=save;window.addEventListener('byelingua-language-change',applyLanguage);load();
</script></body></html>

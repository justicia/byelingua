<body>
<header id="sharedHeader" class="site-header"></header><script src="/shared-header.js"></script><script>ByelinguaHeader.mount(document.getElementById('sharedHeader'));</script>
<main class="page"><div class="page-head"><div><h1>User Center</h1><p>管理账户、新闻偏好和个人演出行程。</p></div><a class="secondary" href="/schedule.html">返回 Schedule Builder</a></div>
<section class="section"><h2>Account</h2><div id="accountEmail" class="account-email loading">正在读取账户…</div><div class="account-actions"><button id="changePassword" type="button" class="secondary">修改密码</button></div><div id="accountStatus" class="status"></div><h3 style="margin:16px 0 4px;font:18px Georgia,serif;color:var(--forest)">Invite codes</h3><div id="inviteCodes" class="source-list"><div class="loading">正在读取邀请码…</div></div></section>
<section class="section"><h2>News Preferences</h2><div id="newsStatus" class="status"></div><div class="setting-row"><div><label for="newsLanguage">Preferred news language</label><div class="hint">新闻内容生成/发送使用的语言，不影响网站界面语言。</div></div><select id="newsLanguage"><option value="zh">简体中文</option><option value="en">English</option><option value="fr">Français</option><option value="es">Español</option><option value="de">Deutsch</option><option value="it">Italiano</option><option value="pt">Português</option><option value="ja">日本語</option></select></div><div class="setting-row"><div><label for="emailEnabled">Email subscription</label><div class="hint">关闭后只停止邮件发送，不删除来源或语言偏好。</div></div><input id="emailEnabled" type="checkbox"></div><h3 style="margin:16px 0 4px;font:18px Georgia,serif;color:var(--forest)">My subscriptions</h3><div id="personalSubscriptionQuota" class="hint">0 / 3 websites</div><div id="personalSubscriptions" class="source-list"><div class="loading">正在读取个人订阅…</div></div><button id="addPersonalSubscription" type="button" class="secondary">Add website</button><h3 style="margin:20px 0 4px;font:18px Georgia,serif;color:var(--forest)">General sources</h3><div id="sourceList" class="source-list"><div class="loading">正在读取来源…</div></div><button id="runBrief" type="button">一键生成 Brief 并发送到邮箱</button><div id="briefStatus" class="status"></div></section>
<section class="section"><h2>My Schedules</h2><div class="create-row"><input id="newScheduleTitle" placeholder="New schedule title"><button id="createSchedule" type="button">Create new Schedule</button></div><div id="scheduleStatus" class="status"></div><div class="schedule-groups"><div class="schedule-group"><h3>Planning</h3><div id="planningSchedules"></div></div><div class="schedule-group"><h3>Upcoming</h3><div id="upcomingSchedules"></div></div><div class="schedule-group"><h3>History / Been there</h3><div id="historySchedules"></div></div><div class="schedule-group archived-group"><h3>Archived</h3><div id="archivedSchedules"></div></div></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const $=id=>document.getElementById(id);let client=null,session=null,personal=null,schedules=[],availableSources=[];let uiLanguage=localStorage.getItem('byelinguaUiLanguage')||'zh';
function token(){for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i)||'';if(!key.startsWith('sb-')||!key.endsWith('-auth-token'))continue;try{const value=JSON.parse(localStorage.getItem(key)||'{}');if(value.access_token)return value.access_token}catch(_){}}return ''}
async function api(payload){const headers={'Content-Type':'application/json'},value=token();if(value)headers.Authorization=`Bearer ${value}`;const response=await fetch('/api',{method:'POST',headers,body:JSON.stringify(payload)}),data=await response.json();if(!response.ok)throw Error(data.error||'Request failed');return data}
function applyLanguage(){document.documentElement.lang=uiLanguage==='en'?'en':'zh-CN';localStorage.setItem('byelinguaUiLanguage',uiLanguage);document.querySelectorAll('[data-language]').forEach(button=>button.classList.toggle('active',button.dataset.language===uiLanguage))}document.querySelectorAll('[data-language]').forEach(button=>button.onclick=()=>{uiLanguage=button.dataset.language;applyLanguage()});applyLanguage();
function setStatus(id,message,error=false){$(id).textContent=message||'';$(id).className=message?`status ${error?'error':'success'}`:'status'}
async function load(){try{personal=await api({action:'get_my_data'});const email=personal.profile?.email||'';$('accountLabel').textContent=email;$('accountEmail').textContent=email||'—';$('newsLanguage').value=personal.profile?.preferred_language||'zh';$('emailEnabled').checked=personal.profile?.email_subscription_enabled!==false;const sourceData=await api({action:'get_news_source_options'});availableSources=sourceData.sources||[];renderSources();const inviteData=await api({action:'list_my_invite_codes'});renderInviteCodes(inviteData.codes||[]);const data=await api({action:'list_schedules'});schedules=data.schedules||[];renderSchedules()}catch(error){if(error.message.includes('登录')){location.href='/';return}$('accountEmail').textContent=error.message;$('accountEmail').className='account-email error'}}
function renderSources(){const rows=personal.subscriptions||[],selected=new Map(rows.map(row=>[row.feed_url,row]));$('sourceList').innerHTML=availableSources.length?availableSources.map((source,index)=>{const row=selected.get(source.feed_url),checked=row?.enabled!==false;return `<label class="source-row"><input type="checkbox" data-source-index="${index}" ${checked?'checked':''}> <span>${escapeHtml(source.name||source.url||'Source')}</span></label>`}).join(''):'<div class="empty">暂无可用新闻来源。</div>';document.querySelectorAll('[data-source-index]').forEach(input=>input.onchange=async()=>{const source=availableSources[Number(input.dataset.sourceIndex)],row=selected.get(source.feed_url),previous=input.checked;try{if(previous){personal=await api({action:'save_my_subscription',subscription:source})}else if(row){personal=await api({action:'delete_my_subscription',id:row.id})}renderSources();setStatus('newsStatus','已保存来源偏好。')}catch(error){input.checked=!previous;setStatus('newsStatus',error.message,true)}})}
function renderInviteCodes(codes){$('inviteCodes').innerHTML=codes.length?codes.map(row=>`<div class="source-row"><strong>${escapeHtml(row.code)}</strong><span class="hint">${escapeHtml(row.status||'active')} · ${row.used_count||0}/${row.max_uses||1}</span><button type="button" class="secondary small" data-copy-code="${escapeHtml(row.code)}">Copy</button></div>`).join(''):'<div class="empty">暂无可用邀请码。</div>';document.querySelectorAll('[data-copy-code]').forEach(button=>button.onclick=async()=>{await navigator.clipboard.writeText(button.dataset.copyCode);setStatus('accountStatus','邀请码已复制。')})}
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function scheduleCard(row){const range=row.start_date&&row.end_date?`${row.start_date} – ${row.end_date}`:(row.start_date||row.end_date||''),labels={draft:'Planning',planned:'Upcoming',completed:'History / Been there',archived:'Archived'},cities=(row.cities||[]).join(' · ');return `<article class="schedule-card"><div class="schedule-card-head"><div><h4>${escapeHtml(row.title||'Untitled schedule')}</h4><div class="schedule-meta">${escapeHtml(labels[row.status]||row.status||'')}${range?` · ${escapeHtml(range)}`:''}${cities?` · ${escapeHtml(cities)}`:''} · ${row.event_count||0} events</div></div><select data-status-id="${row.id}" aria-label="Schedule status"><option value="draft" ${row.status==='draft'?'selected':''}>Planning</option><option value="planned" ${row.status==='planned'?'selected':''}>Upcoming</option><option value="completed" ${row.status==='completed'?'selected':''}>History / Been there</option><option value="archived" ${row.status==='archived'?'selected':''}>Archived</option></select></div><div class="schedule-meta">Updated ${escapeHtml(String(row.updated_at||'').slice(0,10))}</div><div class="schedule-actions"><a class="secondary" href="/schedule.html?schedule_id=${encodeURIComponent(row.id)}">Open / Continue editing</a>${row.status==='planned'?`<button type="button" class="secondary" data-export-ics="${row.id}">Export .ics</button>`:''}${row.status==='archived'?`<button type="button" class="secondary" data-restore-id="${row.id}">Restore</button>`:''}<button type="button" class="secondary" data-rename-id="${row.id}">Rename</button><button type="button" class="danger" data-delete-id="${row.id}">Delete</button></div></article>`}
function renderSchedules(){const planning=schedules.filter(row=>row.status==='draft'),upcoming=schedules.filter(row=>row.status==='planned'),history=schedules.filter(row=>row.status==='completed'),render=(id,rows,empty)=>$(id).innerHTML=rows.length?rows.map(scheduleCard).join(''):`<div class="empty">${empty}</div>`;render('planningSchedules',planning,'No schedules in planning.');render('upcomingSchedules',upcoming,'No upcoming schedules yet.');render('historySchedules',history,'No completed schedules yet.');document.querySelectorAll('[data-status-id]').forEach(select=>select.onchange=async()=>{try{await api({action:'update_schedule_status',schedule_id:select.dataset.statusId,status:select.value});await refreshSchedules()}catch(error){setStatus('scheduleStatus',error.message,true)}});document.querySelectorAll('[data-rename-id]').forEach(button=>button.onclick=async()=>{const row=schedules.find(item=>String(item.id)===button.dataset.renameId),title=prompt('Schedule title',row?.title||'');if(title===null)return;try{await api({action:'rename_schedule',schedule_id:button.dataset.renameId,title});await refreshSchedules()}catch(error){setStatus('scheduleStatus',error.message,true)}});document.querySelectorAll('[data-delete-id]').forEach(button=>button.onclick=async()=>{if(!confirm('Delete this Schedule? Events and intent data will be kept.'))return;try{await api({action:'delete_schedule',schedule_id:button.dataset.deleteId});await refreshSchedules()}catch(error){setStatus('scheduleStatus',error.message,true)}})}
async function refreshSchedules(){const data=await api({action:'list_schedules'});schedules=data.schedules||[];renderSchedules()}
$('newsLanguage').onchange=async()=>{try{personal=await api({action:'save_my_language',language:$('newsLanguage').value});setStatus('newsStatus','已保存新闻语言。')}catch(error){setStatus('newsStatus',error.message,true)}};
$('emailEnabled').onchange=async()=>{const value=$('emailEnabled').checked;try{personal=await api({action:'save_email_subscription',enabled:value});setStatus('newsStatus','已保存邮件设置。')}catch(error){$('emailEnabled').checked=!value;setStatus('newsStatus',error.message,true)}};
$('changePassword').onclick=async()=>{const password=prompt('请输入新密码（至少 6 位）');if(password===null)return;if(password.length<6){setStatus('accountStatus','密码至少需要 6 位。',true);return}try{if(!client){const cfg=await api({action:'get_auth_config'});client=supabase.createClient(cfg.url,cfg.publishable_key)}const result=await client.auth.updateUser({password});if(result.error)throw result.error;setStatus('accountStatus','密码已更新。')}catch(error){setStatus('accountStatus',error.message,true)}};
$('runBrief').onclick=async()=>{const button=$('runBrief');if(!personal.subscriptions?.some(row=>row.enabled!==false)){setStatus('briefStatus','请先选择至少一个新闻来源。',true);return}button.disabled=true;setStatus('briefStatus','正在生成并发送 Brief…');try{const result=await api({action:'generate_brief_send'});setStatus('briefStatus',`已发送 Brief（${result.processed||0} 篇）。`)}catch(error){setStatus('briefStatus',error.message,true)}finally{button.disabled=false}};
$('createSchedule').onclick=async()=>{const input=$('newScheduleTitle'),title=input.value.trim();if(!title){setStatus('scheduleStatus','请输入 Schedule 标题。',true);return}try{const result=await api({action:'create_schedule',title});input.value='';await refreshSchedules();if(result.schedule?.id)location.href=`/schedule.html?schedule_id=${encodeURIComponent(result.schedule.id)}`}catch(error){setStatus('scheduleStatus',error.message,true)}};
$('logoutButton').onclick=async()=>{try{if(!client){const cfg=await api({action:'get_auth_config'});client=supabase.createClient(cfg.url,cfg.publishable_key)}await client.auth.signOut()}finally{location.href='/'}};
const baseRenderSources=renderSources;renderSources=function(){const rows=personal.subscriptions||[],selected=new Map(rows.map(row=>[row.feed_url,row]));const renderGroup=(sources,heading)=>`<div class="source-group"><h4>${heading}</h4>${sources.map(source=>{const row=selected.get(source.feed_url),checked=row?.enabled!==false;return `<label class="source-row"><input type="checkbox" data-source-index="${availableSources.indexOf(source)}" ${checked?'checked':''}> <span>${escapeHtml(source.name||source.url||'Source')}</span></label>`}).join('')||'<div class="empty">暂无来源。</div>'}</div>`;$('sourceList').innerHTML=`<div class="hint">自定义来源：${[...availableSources].filter(x=>x.custom_eligible&&selected.get(x.feed_url)?.enabled!==false).length} / 3</div>${renderGroup(availableSources.filter(x=>x.custom_eligible),'My selected sources · max 3')}${renderGroup(availableSources.filter(x=>!x.custom_eligible),'General sources')}`;document.querySelectorAll('[data-source-index]').forEach(input=>input.onchange=async()=>{const source=availableSources[Number(input.dataset.sourceIndex)],row=selected.get(source.feed_url),previous=input.checked;if(previous&&source.custom_eligible&&!row&&[...availableSources].filter(x=>x.custom_eligible&&selected.get(x.feed_url)?.enabled!==false).length>=3){input.checked=false;setStatus('newsStatus','最多选择 3 个自定义新闻来源。',true);return}try{if(previous){personal=await api({action:'save_my_subscription',subscription:source})}else if(row){personal=await api({action:'delete_my_subscription',id:row.id})}renderSources();setStatus('newsStatus','已保存来源偏好。')}catch(error){input.checked=!previous;setStatus('newsStatus',error.message,true)}})};
const baseRenderSchedules=renderSchedules;renderSchedules=function(){const planning=schedules.filter(row=>row.status==='draft'),upcoming=schedules.filter(row=>row.status==='planned'),history=schedules.filter(row=>row.status==='completed'),archived=schedules.filter(row=>row.status==='archived'),render=(id,rows,empty)=>$(id).innerHTML=rows.length?rows.map(scheduleCard).join(''):`<div class="empty">${empty}</div>`;render('planningSchedules',planning,'No schedules in planning.');render('upcomingSchedules',upcoming,'No upcoming schedules yet.');render('historySchedules',history,'No completed schedules yet.');render('archivedSchedules',archived,'No archived schedules.');document.querySelectorAll('[data-status-id]').forEach(select=>select.onchange=async()=>{try{await api({action:'update_schedule_status',schedule_id:select.dataset.statusId,status:select.value});await refreshSchedules()}catch(error){setStatus('scheduleStatus',error.message,true)}});document.querySelectorAll('[data-rename-id]').forEach(button=>button.onclick=async()=>{const row=schedules.find(item=>String(item.id)===button.dataset.renameId),title=prompt('Schedule title',row?.title||'');if(title===null)return;try{await api({action:'rename_schedule',schedule_id:button.dataset.renameId,title});await refreshSchedules()}catch(error){setStatus('scheduleStatus',error.message,true)}});document.querySelectorAll('[data-delete-id]').forEach(button=>button.onclick=async()=>{if(!confirm('Delete this Schedule? Events and intent data will be kept.'))return;try{await api({action:'delete_schedule',schedule_id:button.dataset.deleteId});await refreshSchedules()}catch(error){setStatus('scheduleStatus',error.message,true)}})};
document.addEventListener('click',async event=>{const button=event.target.closest('[data-restore-id]');if(!button)return;try{await api({action:'update_schedule_status',schedule_id:button.dataset.restoreId,status:'draft'});await refreshSchedules()}catch(error){setStatus('scheduleStatus',error.message,true)}});
document.addEventListener('click',async event=>{const button=event.target.closest('[data-export-ics]');if(!button)return;button.disabled=true;try{const result=await api({action:'export_schedule_ics',schedule_id:button.dataset.exportIcs});const blob=new Blob([result.ics],{type:'text/calendar;charset=utf-8'}),link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=result.filename||'schedule.ics';link.click();URL.revokeObjectURL(link.href)}catch(error){setStatus('scheduleStatus',error.message,true)}finally{button.disabled=false}});
(async()=>{try{const cfg=await api({action:'get_auth_config'});client=supabase.createClient(cfg.url,cfg.publishable_key);const result=await client.auth.getSession();session=result.data.session;if(!session){location.href='/';return}await load()}catch(error){location.href='/'}})();
</script><script>
const accountHeaderLabel=document.getElementById('accountLabel');if(accountHeaderLabel){accountHeaderLabel.textContent='';new MutationObserver(()=>{if(accountHeaderLabel.textContent)accountHeaderLabel.textContent=''}).observe(accountHeaderLabel,{childList:true,characterData:true,subtree:true})}
</script><script>
// Consolidated source state: personal rows remain user_subscriptions;
// optional general rows use the explicit general-preference table.
renderSources=function(){const personalRows=personal.subscriptions||[],generalRows=personal.general_subscriptions||[],personalByFeed=new Map(personalRows.map(row=>[row.feed_url,row])),generalById=new Map(generalRows.map(row=>[row.source_id,row]));const custom=availableSources.filter(source=>source.custom_eligible),general=availableSources.filter(source=>!source.custom_eligible),group=(rows,title,kind)=>`<div class="source-group"><h4>${title}</h4>${rows.map(source=>{const row=kind==='personal'?personalByFeed.get(source.feed_url):generalById.get(source.id),checked=kind==='personal'?row?.enabled!==false:row?.enabled===true;return `<label class="source-row"><input type="checkbox" data-source-kind="${kind}" data-source-index="${availableSources.indexOf(source)}" ${checked?'checked':''}> <span>${escapeHtml(source.name||source.url||'Source')}</span></label>`}).join('')||'<div class="empty">暂无来源。</div>'}</div>`;$('sourceList').innerHTML=`<div class="hint">My subscriptions: ${custom.filter(source=>personalByFeed.get(source.feed_url)?.enabled!==false&&personalByFeed.has(source.feed_url)).length} / 3 selected</div>${group(custom,'My selected sources · max 3','personal')}${group(general,'General sources','general')}`;document.querySelectorAll('[data-source-kind]').forEach(input=>input.onchange=async()=>{const source=availableSources[Number(input.dataset.sourceIndex)],kind=input.dataset.sourceKind,row=kind==='personal'?personalByFeed.get(source.feed_url):generalById.get(source.id),next=input.checked;if(kind==='personal'&&next&&!row&&custom.filter(item=>personalByFeed.get(item.feed_url)?.enabled!==false&&personalByFeed.has(item.feed_url)).length>=3){input.checked=false;setStatus('newsStatus','最多选择 3 个自定义新闻来源。',true);return}try{personal=kind==='personal'?(next?await api({action:'save_my_subscription',subscription:source}):await api({action:'delete_my_subscription',id:row.id})):(await api({action:'set_general_subscription',source,enabled:next}));renderSources();setStatus('newsStatu </script><script>

const personalStyle=document.createElement('style');personalStyle.textContent='.subscription{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.subscription:last-child{border-bottom:0}.subscription .actions{display:flex;gap:6px;flex-wrap:wrap}#personalSubscriptionDialog{border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);padding:0;max-width:min(520px,calc(100% - 28px));width:100%;box-shadow:0 18px 50px #10201833}#personalSubscriptionDialog::backdrop{background:#10201855}.personal-subscription-form{padding:20px;display:flex;flex-direction:column;gap:8px}.personal-subscription-form label{font-weight:650;margin-top:4px}.personal-subscription-form input,.personal-subscription-form select{width:100%;padding:9px;border:1px solid #c8cdc5;border-radius:5px;background:#fff}.personal-subscription-form .modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}.personal-subscription-form .close{border:0;background:transparent;color:var(--forest);font-size:24px;line-height:1;padding:0 4px}.personal-subscription-form .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}';document.head.append(personalStyle);
const personalDialogStyle=document.createElement('style');personalDialogStyle.textContent='#personalSubscriptionForm{padding:20px;display:flex;flex-direction:column;gap:8px}#personalSubscriptionForm label{font-weight:650;margin-top:4px}#personalSubscriptionForm input,#personalSubscriptionForm select{width:100%;padding:9px;border:1px solid #c8cdc5;border-radius:5px;background:#fff}#personalSubscriptionForm .modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}#personalSubscriptionForm .close{border:0;background:transparent;color:var(--forest);font-size:24px;line-height:1;padding:0 4px}#personalSubscriptionForm .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}#sourceList{grid-template-columns:repeat(4,minmax(0,1fr));gap:2px 14px}#sourceList .source-row{padding:5px 0}@media(max-width:900px){#sourceList{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){#sourceList{grid-template-columns:1fr}}';document.head.append(personalDialogStyle);
let editingPersonalSubscriptionId='';
function ensurePersonalSubscriptionDialog(){if(document.getElementById('personalSubscriptionDialog'))return;const dialog=document.createElement('dialog');dialog.id='personalSubscriptionDialog';dialog.innerHTML='<form method="dialog" id="personalSubscriptionForm" class="modal"><div class="modal-head"><div><h2 id="personalSubscriptionTitle">Add website</h2><div class="hint">Personal subscriptions are limited to three websites.</div></div><button class="close" value="cancel" aria-label="Close">×</button></div><label for="personalName">Name</label><input id="personalName" required placeholder="Example: Scherzo"><label for="personalUrl">Website or RSS URL</label><input id="personalUrl" type="url" required placeholder="https://example.com/"><label for="personalCountry">Country</label><select id="personalCountry"><option value="auto">Auto detect</option><option value="cn">China</option><option value="fr">France</option><option value="es">Spain</option><option value="de">Germany</option><option value="it">Italy</option><option value="gb">United Kingdom</option><option value="at">Austria</option><option value="ch">Other</option></select><label for="personalMode">Processing</label><select id="personalMode"><option value="summary">Translate and summarise</option><option value="translate">Full translation</option></select><div id="personalFormStatus" class="status"></div><div class="modal-actions"><button type="button" class="secondary" data-personal-cancel>Cancel</button><button type="submit">Save website</button></div></form>';document.body.appendChild(dialog);dialog.querySelector('[data-personal-cancel]').onclick=()=>dialog.close();dialog.querySelector('#personalSubscriptionForm').onsubmit=async event=>{event.preventDefault();const status=dialog.querySelector('#personalFormStatus'),rows=personal?.subscriptions||[];if(!editingPersonalSubscriptionId&&rows.length>=3){status.textContent='You can add up to 3 personal websites.';status.className='status error';return}status.textContent='Checking website…';status.className='status';try{personal=await api({action:'save_my_subscription',subscription:{name:dialog.querySelector('#personalName').value,url:dialog.querySelector('#personalUrl').value,country:dialog.querySelector('#personalCountry').value,mode:dialog.querySelector('#personalMode').value,language:personal?.profile?.preferred_language||'zh',enabled:true}});editingPersonalSubscriptionId='';dialog.close();renderPersonalSubscriptions();setStatus('newsStatus','Personal subscription saved.')}catch(error){status.textContent=error.message;status.className='status error'}}}
function renderPersonalSubscriptions(){ensurePersonalSubscriptionDialog();const rows=personal?.subscriptions||[],max=personal?.profile?.max_subscriptions||3;$('personalSubscriptionQuota').textContent=`${rows.length} / ${max} websites`;$('addPersonalSubscription').disabled=rows.length>=max;$('personalSubscriptions').innerHTML=rows.length?rows.map(row=>`<div class="subscription"><div><strong>${escapeHtml(row.name||row.url||'Website')}</strong><div class="hint">${escapeHtml(row.url||row.feed_url||'')}${row.enabled===false?' · Paused':''}</div></div><div class="actions"><button type="button" class="secondary small" data-edit-personal="${escapeHtml(row.id)}">Update</button><button type="button" class="danger small" data-remove-personal="${escapeHtml(row.id)}">Remove</button></div></div>`).join(''):'<div class="empty">No personal websites yet.</div>';document.querySelectorAll('[data-edit-personal]').forEach(button=>button.onclick=()=>openPersonalSubscriptionEditor(button.dataset.editPersonal));document.querySelectorAll('[data-remove-personal]').forEach(button=>button.onclick=async()=>{try{personal=await api({action:'delete_my_subscription',id:button.dataset.removePersonal});renderPersonalSubscriptions();setStatus('newsStatus','Personal subscription removed.')}catch(error){setStatus('newsStatus',error.message,true)}})}
function openPersonalSubscriptionEditor(id){ensurePersonalSubscriptionDialog();const row=(personal?.subscriptions||[]).find(item=>String(item.id)===String(id));if(!row)return;editingPersonalSubscriptionId=row.id;$('personalSubscriptionTitle').textContent='Update website';$('personalName').value=row.name||'';$('personalUrl').value=row.url||row.feed_url||'';$('personalCountry').value=row.country||'auto';$('personalMode').value=row.mode||'summary';$('personalFormStatus').textContent='';$('personalSubscriptionDialog').showModal()}
$('addPersonalSubscription').onclick=()=>{ensurePersonalSubscriptionDialog();editingPersonalSubscriptionId='';$('personalSubscriptionTitle').textContent='Add website';$('personalName').value='';$('personalUrl').value='';$('personalCountry').value='auto';$('personalMode').value='summary';$('personalFormStatus').textContent='';$('personalSubscriptionDialog').showModal()};
const previousLoad=load;load=async function(){await previousLoad();renderPersonalSubscriptions()};
renderSources=function(){const generalRows=personal?.general_subscriptions||[],generalById=new Map(generalRows.map(row=>[String(row.source_id),row])),general=availableSources.filter(source=>!source.custom_eligible);$('sourceList').innerHTML=general.length?general.map(source=>{const key=String(source.id||source.feed_url||''),row=generalById.get(key)||generalRows.find(item=>item.feed_url&&item.feed_url===source.feed_url),checked=row?.enabled===true;return `<label class="source-row"><input type="checkbox" data-general-source="${escapeHtml(key)}" ${checked?'checked':''}> <span>${escapeHtml(source.name||source.url||'Source')}</span></label>`}).join(''):'<div class="empty">No general sources available.</div>';document.querySelectorAll('[data-general-source]').forEach(input=>input.onchange=async()=>{const source=general.find(item=>String(item.id||item.feed_url||'')===input.dataset.generalSource);if(!source){input.checked=!input.checked;setStatus('newsStatus','This source is unavailable.',true);return}const next=input.checked;try{personal=await api({action:'set_general_subscription',source,enabled:next});renderSources();setStatus('newsStatus','General source preference saved.')}catch(error){input.checked=!next;setStatus('newsStatus',error.message,true)}})};
const briefHelp=document.createElement('div');briefHelp.className='hint';const updateBriefHelp=()=>{briefHelp.textContent=(localStorage.getItem('byelinguaUiLanguage')||'zh')==='en'?'A manual Brief can be generated and emailed once every 24 hours. Scheduled email delivery is not affected.':'手动 Brief 每 24 小时可生成并发送 1 次；每日自动邮件订阅不受影响。'};updateBriefHelp();window.addEventListener('byelingua-language-change',updateBriefHelp);$('runBrief').after(briefHelp);
function applyManualBriefStatus(){const info=personal?.manual_brief||{};const button=$('runBrief');if(info.rate_limited&&info.next_available_at){button.disabled=true;setStatus('briefStatus',`Next manual Brief available: ${new Date(info.next_available_at).toLocaleString()}`)}else if(!button.dataset.running){button.disabled=false}}
async function requestManualBrief(){const button=$('runBrief'),personalCount=(personal?.subscriptions||[]).filter(row=>row.enabled!==false).length,generalCount=document.querySelectorAll('[data-general-source]:checked').length;if(!personalCount&&!generalCount){setStatus('briefStatus','Please select at least one news source.',true);return}button.disabled=true;button.dataset.running='1';setStatus('briefStatus','Generating and sending Brief…');try{const headers={'Content-Type':'application/json'},value=token();if(value)headers.Authorization=`Bearer ${value}`;const response=await fetch('/api',{method:'POST',headers,body:JSON.stringify({action:'generate_brief_send'})}),data=await response.json();if(!response.ok){if(data.rate_limited){setStatus('briefStatus',`Next manual Brief available: ${new Date(data.next_available_at).toLocaleString()}`,true);return}throw new Error(data.error||'Request failed')}personal=data.data||personal;setStatus('briefStatus',data.delivery?.sent?'Brief sent successfully.':'No new articles were available.');applyManualBriefStatus()}catch(error){setStatus('briefStatus',error.message,true)}finally{delete button.dataset.running;if(!personal?.manual_brief?.rate_limited)button.disabled=false}};$('runBrief').onclick=requestManualBrief;
const baseGeneralRender=renderSources;renderSources=function(){baseGeneralRender();document.querySelectorAll('[data-general-source]').forEach(input=>{const original=input.onchange;input.onchange=async event=>{const button=$('runBrief');button.disabled=true;try{await original.call(input,event)}finally{delete button.dataset.sourceSaving;applyManualBriefStatus()}}})};
const briefRequestBeforeRefresh=requestManualBrief;requestManualBrief=async()=>{await briefRequestBeforeRefresh();try{personal=await api({action:'get_my_data'});applyManualBriefStatus()}catch(_){}};$('runBrief').onclick=requestManualBrief;
if(personal){renderPersonalSubscriptions();applyManualBriefStatus()}

function installPersonalFormValidation(){const personalForm=document.getElementById('personalSubscriptionForm');if(!personalForm||personalForm.dataset.validationInstalled)return;personalForm.dataset.validationInstalled='1';personalForm.noValidate=true;document.getElementById('personalName')?.removeAttribute('required');const urlInput=document.getElementById('personalUrl'),urlError=document.createElement('div');urlError.className='status error';urlError.id='personalUrlError';urlInput?.after(urlError);const validationMessage=key=>{const english=(localStorage.getItem('byelinguaUiLanguage')||'zh')==='en';return english?(key==='required'?'Please enter a website or RSS URL.':'Please enter a valid website or RSS URL.'):(key==='required'?'请输入网站或 RSS 地址。':'请输入有效的网站或 RSS 地址。')};const clearUrlError=()=>{urlError.textContent='';urlError.hidden=true};urlError.hidden=true;urlInput?.addEventListener('input',clearUrlError);personalForm.onsubmit=async event=>{event.preventDefault();clearUrlError();const url=urlInput.value.trim();if(!url){urlError.textContent=validationMessage('required');urlError.hidden=false;urlInput.focus();return}let parsed;try{parsed=new URL(url);if(!['http:','https:'].includes(parsed.protocol))throw Error()}catch(_){urlError.textContent=validationMessage('invalid');urlError.hidden=false;urlInput.focus();return}const save=personalForm.querySelector('button[type="submit"]'),status=document.getElementById('personalFormStatus');save.disabled=true;save.textContent=(localStorage.getItem('byelinguaUiLanguage')||'zh')==='en'?'Saving…':'保存中…';status.textContent='';try{personal=await api({action:'save_my_subscription',subscription:{name:document.getElementById('personalName').value,url:parsed.href,country:document.getElementById('personalCountry').value,mode:document.getElementById('personalMode').value,language:personal?.profile?.preferred_language||'zh',enabled:true}});editingPersonalSubscriptionId='';personalForm.closest('dialog').close();renderPersonalSubscriptions();setStatus('newsStatus','Personal subscription saved.')}catch(error){status.textContent=error.message;status.className='status error'}finally{save.disabled=false;save.textContent=(localStorage.getItem('byelinguaUiLanguage')||'zh')==='en'?'Save website':'保存网站'}};personalForm.closest('dialog').addEventListener('close',()=>{clearUrlError()})}
const renderSubscriptionsForValidation=renderPersonalSubscriptions;renderPersonalSubscriptions=function(){renderSubscriptionsForValidation();installPersonalFormValidation()};installPersonalFormValidation();

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>设置密码 · Byelingua</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f2e9;color:#17201b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}.card{width:min(430px,calc(100% - 28px));padding:28px;background:#fffdf8;border:1px solid #d7d7ce;border-radius:7px}h1{margin:0 0 8px;font:28px Georgia,serif;color:#214d3a}.hint,.status{color:#68716b;font-size:13px}.form{display:grid;gap:14px;margin-top:22px}label{display:block;margin-bottom:5px;font-weight:650;font-size:13px}input{width:100%;padding:10px;border:1px solid #c8cdc5;border-radius:5px;font:inherit}.btn{display:inline-block;border:1px solid #214d3a;border-radius:5px;padding:10px 14px;background:#214d3a;color:#fff;font:inherit;font-weight:650;text-decoration:none;cursor:pointer}.status{min-height:22px;margin-top:14px}.error{color:#9e3737}.success{color:#287040}.actions{margin-top:18px}
  </style>
</head>
<body>
  <main class="card">
    <h1>设置密码</h1>
    <div id="intro" class="hint">正在验证链接…</div>
    <form id="passwordForm" class="form" hidden>
      <div><label for="password">密码</label><input id="password" type="password" required autocomplete="new-password"></div>
      <div><label for="confirmPassword">确认密码</label><input id="confirmPassword" type="password" required autocomplete="new-password"></div>
      <button class="btn" type="submit">设置密码</button>
    </form>
    <div id="status" class="status"></div>
    <div id="loginAction" class="actions" hidden><a class="btn" href="/">返回登录</a></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const form=document.getElementById("passwordForm"),intro=document.getElementById("intro"),status=document.getElementById("status"),loginAction=document.getElementById("loginAction");
    function invalidLink(message="链接已失效，请重新申请。"){intro.textContent=message;status.textContent="";form.hidden=true;loginAction.hidden=false}
    async function load(){
      try{
        const response=await fetch("/api",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"get_auth_config"})});
        const config=await response.json();
        if(!response.ok)throw new Error(config.error||"无法加载登录配置。");
        const client=supabase.createClient(config.url,config.publishable_key);
        const params=new URLSearchParams(location.search),code=params.get("code");
        if(code){const {error}=await client.auth.exchangeCodeForSession(code);if(error){invalidLink();return}}
        if(location.hash.includes("error=")){invalidLink();return}
        const {data,error}=await client.auth.getSession();
        if(error||!data.session){invalidLink();return}
        intro.textContent="请输入并确认新密码。";
        form.hidden=false;
        form.onsubmit=async event=>{
          event.preventDefault();
          const password=document.getElementById("password").value,confirmation=document.getElementById("confirmPassword").value;
          if(password!==confirmation){status.textContent="两次输入的密码不一致。";status.className="status error";return}
          const {error:updateError}=await client.auth.updateUser({password});
          if(updateError){status.textContent=updateError.message;status.className="status error";return}
          form.hidden=true;intro.textContent="密码设置完成。";status.textContent="";status.className="status";loginAction.hidden=false;
        };
      }catch(error){intro.textContent=error.message||"无法加载登录配置。";status.textContent="";form.hidden=true;loginAction.hidden=false}
    }
    load();
  </script>
</body>
</html>

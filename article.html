<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Byelingua · Article</title>
<style>
:root{--ink:#132019;--muted:#647069;--paper:#f6f3ea;--card:#fffdf8;--green:#1f563f;--line:#dcd8cc;--accent:#ddea65}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,"Helvetica Neue",Arial,sans-serif}.topbar{position:sticky;top:0;z-index:2;border-bottom:1px solid var(--line);background:rgba(246,243,234,.94);backdrop-filter:blur(12px)}.topbar-inner{width:min(900px,calc(100% - 40px));margin:auto;padding:18px 0;display:flex;align-items:center;justify-content:space-between}.brand{color:var(--green);font:700 28px Georgia,serif;text-decoration:none}.back{color:var(--green);text-decoration:none;font-weight:700}.page{width:min(900px,calc(100% - 40px));margin:48px auto 80px}.article{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:clamp(28px,6vw,68px);box-shadow:0 18px 60px rgba(25,50,38,.07)}.eyebrow,.labels{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin-bottom:18px}.tag{padding:3px 10px;border-radius:99px;background:#edf0e8;color:var(--green);font-size:12px;font-weight:700}h1{font:500 clamp(36px,6vw,64px)/1.06 Georgia,"Times New Roman",serif;letter-spacing:-.025em;margin:0 0 28px}.language-picker{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 30px;padding-bottom:24px;border-bottom:1px solid var(--line)}.language-picker span{color:var(--muted);font-size:13px;margin-right:4px}.language-picker button{border:1px solid var(--line);border-radius:99px;background:#fff;color:var(--green);padding:8px 13px;font-weight:700}.language-picker button.active{background:var(--green);border-color:var(--green);color:#fff}.language-picker button:disabled{opacity:.38;cursor:not-allowed}.content{white-space:pre-wrap;font:400 19px/1.9 Georgia,"Times New Roman",serif}.original-section{border-top:1px solid var(--line);margin-top:56px;padding-top:38px}.original-section h2{font:500 30px/1.2 Georgia,"Times New Roman",serif;margin:0 0 8px}.original-section .section-note{color:var(--muted);font-size:13px;margin-bottom:24px}.original-content{white-space:pre-wrap;font:400 17px/1.85 Georgia,"Times New Roman",serif;color:#344139}.footer{display:flex;justify-content:space-between;align-items:center;gap:20px;border-top:1px solid var(--line);margin-top:48px;padding-top:24px}.original{display:inline-block;padding:13px 18px;border-radius:12px;background:var(--accent);color:var(--ink);font-weight:700;text-decoration:none}.note{color:var(--muted);font-size:13px}.error{text-align:center;padding:80px 20px;color:var(--muted)}[hidden]{display:none!important}@media(max-width:600px){.topbar-inner,.page{width:min(100% - 24px,900px)}.page{margin-top:18px}.article{border-radius:18px;padding:25px 20px}h1{font-size:36px}.content{font-size:18px;line-height:1.75}.footer{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header class="topbar"><div class="topbar-inner"><a class="brand" href="index.html">Byelingua</a><a class="back" href="index.html" id="back">← 返回首页</a></div></header>
<main class="page" id="page"><article class="article"><div class="eyebrow"><span id="source"></span><span>·</span><time id="date"></time></div><div class="labels" id="labels"></div><h1 id="title"></h1><nav class="language-picker" id="languagePicker" aria-label="译文语言"><span id="languageLabel">译文语言</span></nav><div class="content" id="content"></div><section class="original-section" id="originalSection"><h2 id="originalHeading">中文原文</h2><div class="section-note" id="originalNote">以下为存档的微信公众号中文原文。</div><div class="original-content" id="originalContent"></div></section><footer class="footer"><span class="note" id="note">翻译内容由 Byelingua 生成，请以中文原文为准。</span><a class="original" id="original" target="_blank" rel="noopener noreferrer">在微信中查看原文 →</a></footer></article></main>
<script>
const languageNames={en:"English",es:"Español",de:"Deutsch",fr:"Français"};
const params=new URLSearchParams(location.search),key=params.get("key"),raw=key?localStorage.getItem(key):null;
function valueFor(values,code,fallback=""){return values?.[code]||fallback}
try{
  if(!raw)throw new Error();
  const article=JSON.parse(raw),titles=article.titles||{},contents=article.contents||{},originalTitle=valueFor(titles,"zh",article.title),originalContent=valueFor(contents,"zh",article.language==="zh"?article.content:"");
  const available=Object.keys(languageNames).filter(code=>contents[code]);
  let selected=available.includes(article.language)?article.language:(available[0]||"zh");
  document.getElementById("source").textContent=article.source||"";
  document.getElementById("date").textContent=article.date||"";
  document.getElementById("original").href=article.url||"#";
  if(article.category){const tag=document.createElement("span");tag.className="tag";tag.textContent=article.category;document.getElementById("labels").append(tag)}
  const picker=document.getElementById("languagePicker");
  Object.entries(languageNames).forEach(([code,name])=>{const button=document.createElement("button");button.type="button";button.textContent=name;button.dataset.language=code;button.disabled=!contents[code];button.title=button.disabled?"该语言译文尚未生成 / Translation not available":"";button.onclick=()=>render(code);picker.append(button)});
  function render(code){
    selected=contents[code]?code:(available[0]||"zh");
    const translated=selected!=="zh";
    const title=valueFor(titles,selected,translated?article.title:originalTitle),content=valueFor(contents,selected,article.content||originalContent);
    document.documentElement.lang=selected;
    document.title=`${title} · Byelingua`;
    document.getElementById("title").textContent=title;
    document.getElementById("content").textContent=content;
    picker.hidden=!available.length;
    picker.querySelectorAll("button").forEach(button=>button.classList.toggle("active",button.dataset.language===selected));
    document.getElementById("originalSection").hidden=!originalContent;
    document.getElementById("originalContent").textContent=originalContent;
    const english=selected==="en";
    document.getElementById("back").textContent=english?"← Back to home":"← 返回首页";
    document.getElementById("languageLabel").textContent=english?"Translation":"译文语言";
    document.getElementById("originalHeading").textContent=english?"Original Chinese":"中文原文";
    document.getElementById("originalNote").textContent=english?"The archived original Chinese text appears below.":"以下为存档的微信公众号中文原文。";
    document.getElementById("note").textContent=english?"Translated by Byelingua. Refer to the original Chinese for accuracy.":"翻译内容由 Byelingua 生成，请以中文原文为准。";
    document.getElementById("original").textContent=english?"View original on WeChat →":"在微信中查看原文 →";
  }
  render(selected);
}catch(error){document.getElementById("page").innerHTML='<div class="error"><h1>文章无法打开</h1><p>请返回首页后重新点击“阅读全文”。</p></div>'}
</script>
</body>
</html>

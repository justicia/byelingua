<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Byelingua · Article</title>
<style>
:root{--ink:#132019;--muted:#647069;--paper:#f6f3ea;--card:#fffdf8;--green:#1f563f;--line:#dcd8cc;--accent:#ddea65}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,"Helvetica Neue",Arial,sans-serif}.topbar{position:sticky;top:0;z-index:2;border-bottom:1px solid var(--line);background:rgba(246,243,234,.94);backdrop-filter:blur(12px)}.topbar-inner{width:min(900px,calc(100% - 40px));margin:auto;padding:18px 0;display:flex;align-items:center;justify-content:space-between}.brand{color:var(--green);font:700 28px Georgia,serif;text-decoration:none}.back{color:var(--green);text-decoration:none;font-weight:700}.page{width:min(900px,calc(100% - 40px));margin:48px auto 80px}.article{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:clamp(28px,6vw,68px);box-shadow:0 18px 60px rgba(25,50,38,.07)}.eyebrow{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin-bottom:18px}h1{font:500 clamp(36px,6vw,64px)/1.06 Georgia,"Times New Roman",serif;letter-spacing:-.025em;margin:0 0 34px}.content{white-space:pre-wrap;font:400 19px/1.9 Georgia,"Times New Roman",serif}.footer{display:flex;justify-content:space-between;align-items:center;gap:20px;border-top:1px solid var(--line);margin-top:48px;padding-top:24px}.original{display:inline-block;padding:13px 18px;border-radius:12px;background:var(--accent);color:var(--ink);font-weight:700;text-decoration:none}.note{color:var(--muted);font-size:13px}.error{text-align:center;padding:80px 20px;color:var(--muted)}@media(max-width:600px){.topbar-inner,.page{width:min(100% - 24px,900px)}.page{margin-top:18px}.article{border-radius:18px;padding:25px 20px}h1{font-size:36px}.content{font-size:18px;line-height:1.75}.footer{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header class="topbar"><div class="topbar-inner"><a class="brand" href="index.html">Byelingua</a><a class="back" href="index.html" id="back">← 返回首页</a></div></header>
<main class="page" id="page"><article class="article"><div class="eyebrow"><span id="source"></span><span>·</span><time id="date"></time></div><h1 id="title"></h1><div class="content" id="content"></div><footer class="footer"><span class="note" id="note">翻译内容由 Byelingua 生成，请以原文为准。</span><a class="original" id="original" target="_blank" rel="noopener noreferrer">阅读原文 →</a></footer></article></main>
<script>
const params=new URLSearchParams(location.search),key=params.get("key"),raw=key?localStorage.getItem(key):null;if(key)localStorage.removeItem(key);try{if(!raw)throw new Error();const article=JSON.parse(raw),english=article.language==="en";document.documentElement.lang=english?"en":"zh-CN";document.title=`${article.title} · Byelingua`;document.getElementById("source").textContent=article.source;document.getElementById("date").textContent=article.date;document.getElementById("title").textContent=article.title;document.getElementById("content").textContent=article.content;document.getElementById("original").href=article.url;if(english){document.getElementById("back").textContent="← Back to home";document.getElementById("note").textContent="Translated by Byelingua. Refer to the original for accuracy.";document.getElementById("original").textContent="Read original →"}}catch(error){document.getElementById("page").innerHTML='<div class="error"><h1>文章无法打开</h1><p>请返回首页后重新点击“阅读全文”。</p></div>'}
</script>
</body>
</html>

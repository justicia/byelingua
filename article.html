<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Byelingua · Article</title>
<style>
:root{--ink:#17201b;--muted:#68716b;--paper:#f5f2e9;--card:#fffdf8;--green:#214d3a;--line:#d7d7ce}*{box-sizing:border-box}html{overflow-x:hidden}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}.topbar{border-bottom:1px solid var(--line);background:rgba(245,242,233,.96)}.topbar-inner{width:min(820px,calc(100% - 40px));margin:auto;padding:15px 0;display:flex;align-items:center;justify-content:space-between}.brand{color:var(--green);font:700 25px Georgia,serif;text-decoration:none}.back{color:var(--green);text-decoration:none;font-size:13px;font-weight:650}.page{width:min(820px,calc(100% - 40px));margin:34px auto 72px}.article{background:var(--card);border-top:3px solid var(--green);border-bottom:1px solid var(--line);padding:38px clamp(24px,6vw,58px) 42px}.eyebrow,.labels{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-bottom:12px}.tag{padding:2px 7px;border-radius:3px;background:#e8eee9;color:var(--green);font-size:11px;font-weight:650}h1{font:600 clamp(31px,5vw,48px)/1.16 Georgia,"Times New Roman",serif;letter-spacing:-.015em;margin:0 0 22px}.language-picker{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 28px;padding:13px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.language-picker span{color:var(--muted);font-size:12px;margin-right:3px}.language-picker button{border:1px solid #aebbb2;border-radius:4px;background:transparent;color:var(--green);padding:6px 10px;font-weight:650}.language-picker button.active{background:var(--green);border-color:var(--green);color:#fff}.language-picker button:disabled{opacity:.38;cursor:not-allowed}.content{white-space:pre-wrap;font:400 18px/1.88 Georgia,"Times New Roman",serif;overflow-wrap:anywhere}.footer{display:flex;justify-content:space-between;align-items:center;gap:18px;border-top:1px solid var(--line);margin-top:40px;padding-top:20px}.original{display:inline-block;padding:8px 12px;border:1px solid var(--green);border-radius:4px;background:transparent;color:var(--green);font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap}.note{color:var(--muted);font-size:12px;line-height:1.5}.error{text-align:center;padding:70px 20px;color:var(--muted)}[hidden]{display:none!important}@media(max-width:600px){.topbar-inner,.page{width:min(100% - 24px,820px)}.page{margin-top:14px}.article{padding:25px 18px 30px}h1{font-size:30px;line-height:1.2}.content{font-size:17px;line-height:1.78}.language-picker button{min-height:42px}.footer{align-items:flex-start;flex-direction:column}.original{min-height:42px;display:flex;align-items:center}}
</style>
</head>
<body>
<header class="topbar"><div class="topbar-inner"><a class="brand" href="index.html">Byelingua</a><a class="back" href="index.html" id="back">← 返回首页</a></div></header>
<main class="page" id="page"><article class="article"><div class="eyebrow"><span id="source"></span><span>·</span><time id="date"></time></div><div class="labels" id="labels"></div><h1 id="title"></h1><nav class="language-picker" id="languagePicker" aria-label="译文语言"><span id="languageLabel">译文语言</span></nav><div class="content" id="content"></div><footer class="footer"><span class="note" id="note">翻译内容由 Byelingua 生成，请以原文为准。</span><a class="original" id="original" target="_blank" rel="noopener noreferrer">查看微信原文 →</a></footer></article></main>
<script>
const languageNames={en:"English",es:"Español",de:"Deutsch",fr:"Français"};
const params=new URLSearchParams(location.search),key=params.get("key"),raw=key?localStorage.getItem(key):null;
function valueFor(values,code,fallback=""){return values?.[code]||fallback}
try{
  if(!raw)throw new Error();
  const article=JSON.parse(raw),titles=article.titles||{},contents=article.contents||{},originalTitle=valueFor(titles,"zh",article.title),originalContent=valueFor(contents,"zh",article.language==="zh"?article.content:""),selfService=article.kind==="wechat"&&article.country==="cn"&&article.uiLanguage==="en";
  const available=Object.keys(languageNames).filter(code=>contents[code]);
  let selected=available.includes(article.language)?article.language:(available[0]||"zh");
  document.getElementById("source").textContent=article.source||"";
  document.getElementById("date").textContent=article.date||"";
  document.getElementById("original").href=article.url||"#";
  if(article.category){const categoryNames={"评论":"Review","歌剧":"Opera","音乐会":"Concert","访谈":"Interview","新闻":"News"},tag=document.createElement("span");tag.className="tag";tag.textContent=article.uiLanguage==="en"?(categoryNames[article.category]||article.category):article.category;document.getElementById("labels").append(tag)}
  const picker=document.getElementById("languagePicker");
  Object.entries(languageNames).forEach(([code,name])=>{const button=document.createElement("button");button.type="button";button.textContent=name;button.dataset.language=code;button.disabled=!selfService&&!contents[code];button.title=button.disabled?"该语言译文尚未生成 / Translation not available":"";button.onclick=()=>selectLanguage(code,button);picker.append(button)});
  async function selectLanguage(code,button){
    if(contents[code]){render(code);return}
    button.disabled=true;button.textContent=`${languageNames[code]}…`;
    try{
      let result=await request({action:"translate_wechat",id:article.id,language:code});
      for(let attempt=0;attempt<150&&result.status!=="completed";attempt++){
        if(!["queued","in_progress"].includes(result.status))throw new Error(result.error||"Translation did not complete.");
        button.textContent=`${languageNames[code]} · ${result.status==="queued"?"Queued":"Translating"}…`;
        await new Promise(resolve=>setTimeout(resolve,2000));
        result=await request({action:"poll_wechat_translation",id:article.id,language:code});
      }
      if(result.status!=="completed")throw new Error("Translation is still running. Please try again shortly.");
      Object.assign(contents,result.article.contents||result.article.translations||{});Object.assign(titles,result.article.titles||result.article.translated_titles||{});article.contents=contents;article.titles=titles;localStorage.setItem(key,JSON.stringify(article));render(code)
    }catch(error){alert(error.message)}finally{button.disabled=false;button.textContent=languageNames[code]}}
  async function request(payload){const response=await fetch("/api",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)}),result=await response.json();if(!response.ok)throw new Error(result.error||"Request failed");return result}
  function render(code){
    selected=contents[code]?code:(available[0]||"zh");
    const translated=selected!=="zh";
    const title=valueFor(titles,selected,translated?article.title:originalTitle),content=valueFor(contents,selected,article.content||originalContent);
    document.documentElement.lang=selected;
    document.title=`${title} · Byelingua`;
    document.getElementById("title").textContent=title;
    document.getElementById("content").textContent=content;
    picker.hidden=!selfService&&!Object.keys(languageNames).some(language=>contents[language]);
    picker.querySelectorAll("button").forEach(button=>button.classList.toggle("active",button.dataset.language===selected));
    const english=article.uiLanguage==="en";
    document.getElementById("back").textContent=english?"← Back to home":"← 返回首页";
    document.getElementById("languageLabel").textContent=english?"Translation":"译文语言";
    picker.setAttribute("aria-label",english?"Translation language":"译文语言");
    document.getElementById("note").textContent=english?"Translated by Byelingua. Refer to the original for accuracy.":"翻译内容由 Byelingua 生成，请以原文为准。";
    document.getElementById("original").textContent=english?"View original":"查看原文";
  }
  render(selected);
}catch(error){document.getElementById("page").innerHTML='<div class="error"><h1>文章无法打开</h1><p>请返回首页后重新点击“阅读全文”。</p></div>'}
</script>
</body>
</html>

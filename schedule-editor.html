</style><style>.explorer-tabs{display:flex;gap:6px;margin-top:12px}.explorer-tabs button{font-size:12px;padding:6px 8px}.explorer-tabs button.active{background:var(--forest);color:#fff}.search-form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.search-form .wide{grid-column:1/-1}.search-form label{font-size:12px;font-weight:700}.search-form input,.search-form select{width:100%;padding:7px;border:1px solid #c8cdc5;border-radius:5px;background:#fff}@media(max-width:800px){.search-form{grid-template-columns:1fr}.search-form .wide{grid-column:1}}

<header class="top"><a class="brand" href="/">BYELINGUA</a><nav class="site-nav"><a href="/">Home</a><a href="/account.html">User Center</a><button id="signOut" type="button" class="secondary">Sign out</button><button type="button" class="secondary" data-lang="zh">中文</button><button type="button" class="secondary" data-lang="en">English</button></nav></header>

</main><script src="/shared-i18n.js"></script><script>

const COPY={en:{scheduleEvents:'Schedule Events',drag:'Drag to reorder. Changes are saved automatically.',date:'Date',city:'City',venue:'Venue',intent:'Intent',clear:'Clear',allCities:'All cities',allVenues:'All venues',allIntentions:'All intentions',other:'Same-day performances',empty:'Select a Schedule event to explore other performances on the same date.',none:'No other performances found for this date.',loading:'Loading other performances…',explore:'Explore this date',remove:'Remove',details:'View details',add:'Add to schedule',added:'Added',back:'Back to other performances',original:'View original ↗',programme:'Programme',cast:'Cast',team:'Artistic Team',eventType:'Event type',time:'Time',allTypes:'All types',allTimes:'All times',before:'Before 18:00',evening:'18:00–20:00',after:'After 20:00',search:'Search and add',searchPlaceholder:'Search works, composers, artists, or venues',searchMode:'Search and add',sameDay:'Same-day performances',startDate:'Start date',endDate:'End date',searchButton:'Search',clearSearch:'Clear',searching:'Searching performances…',noSearch:'No performances match these filters',invalidDates:'Please enter a valid date range.',saved:'Saved',confirmed:'Schedule confirmed.',planning:'Planning',upcoming:'Upcoming',events:'events'},zh:{scheduleEvents:'行程演出',drag:'拖动调整顺序，修改会自动保存。',date:'日期',city:'城市',venue:'场馆',intent:'意向',clear:'清除',allCities:'所有城市',allVenues:'所有场馆',allIntentions:'所有意向',other:'同日演出',empty:'请选择一个行程演出，探索同日的其他演出。',none:'这一天没有找到符合条件的其他演出。',loading:'正在加载其他演出…',explore:'探索同日演出',remove:'移除',details:'查看详情',add:'加入当前行程',added:'已加入',back:'返回其他演出',original:'查看原网页 ↗',programme:'节目',cast:'演员',team:'主创团队',eventType:'演出类型',time:'时间',allTypes:'所有类型',allTimes:'所有时间',before:'18:00 前',evening:'18:00–20:00',after:'20:00 后',search:'搜索并添加',searchPlaceholder:'搜索作品、作曲家、艺术家或场馆',searchMode:'搜索并添加',sameDay:'同日演出',startDate:'开始日期',endDate:'结束日期',searchButton:'搜索',clearSearch:'清除',searching:'正在搜索演出……',noSearch:'没有找到符合条件的演出',invalidDates:'请输入有效的日期范围。',saved:'已保存',confirmed:'行程已确认。',planning:'规划中',upcoming:'即将开始',events:'场演出'}};
const language=window.ByelinguaI18n.getUiLanguage(),t=key=>COPY[language][key]||window.ByelinguaI18n.t(key);
const INTENT_LABELS={interested:'感兴趣',maybe_go:'行程可选',must_go:'一定要去'},EVENT_TYPES=['opera','operetta','ballet','concert','chamber_music','recital','children_family','matinee','other'];
const params=new URLSearchParams(location.search),scheduleId=params.get('schedule_id')||'';
let schedule=null,rows=[],relations=new Map(),selectedId=null,dragId=null,explorerRows=[],explorerDetail=null,explorerRequest=0,explorerMode='same-day',searchRows=[],searchOptions={cities:[],venues:[]};
const explorerFilters={city:'',venue:'',eventType:'',time:'',query:''};
const searchState={query:'',startDate:'',endDate:'',city:'',venue:'',eventType:'',time:''};
function token(){for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i)||'';if(!k.startsWith('sb-')||!k.endsWith('-auth-token'))continue;try{const v=JSON.parse(localStorage.getItem(k)||'{}');if(v.access_token)return v.access_token}catch(_){}}return ''}
async function api(payload){const headers={'Content-Type':'application/json'},auth=token();if(auth)headers.Authorization=`Bearer ${auth}`;const r=await fetch('/api',{method:'POST',headers,body:JSON.stringify(payload)}),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
function eventOf(row){return row.event||{}}
function keyOfEvent(e){return String(e.event_id||e.event_key||e.id||'')}
function cityOf(e){return String(e.city||e.location_city||'').trim()}
function locationOf(e){const parts=[];for(const value of [e.organization,e.venue,cityOf(e)])if(value&&!parts.includes(value))parts.push(value);return parts.join(' · ')}
function titleOf(e){return e.title||e.work_title||'Event'}
function dateOf(e){return String(e.date||'').slice(0,10)}
function timeOf(e){return String(e.start_time||'').slice(0,5)}
function intentOf(row){return relations.get(String(row.event_key))?.intent_status||'interested'}
function filteredRows(){const date=$('dateFilter').value,city=$('cityFilter').value,venue=$('venueFilter').value,intent=$('intentFilter').value;return rows.filter(row=>{const e=eventOf(row);return(!date||dateOf(e)===date)&&(!city||cityOf(e)===city)&&(!venue||String(e.venue||'')===venue)&&(!intent||intentOf(row)===intent)})}
function option(value,label,selected=''){return `<option value="${esc(value)}" ${value===selected?'selected':''}>${esc(label)}</option>`}
function renderHeader(){const cities=[...new Set(rows.map(r=>cityOf(eventOf(r))).filter(Boolean))],dates=rows.map(r=>dateOf(eventOf(r))).filter(Boolean).sort();$('scheduleTitle').textContent=schedule?.title||'Schedule';$('scheduleMeta').textContent=`${schedule?.status==='planned'?t('confirmed'):t('planning')} · ${rows.length} ${t('events')}${dates.length?' · '+window.ByelinguaI18n.formatDate(dates[0],language)+(dates.length>1?' – '+window.ByelinguaI18n.formatDate(dates[dates.length-1],language):''):''}${cities.length?' · '+cities.join(' · '):''}`;$('confirm').hidden=schedule?.status!=='draft';$('viewSummary').hidden=schedule?.status!=='planned'}
function populateLeftFilters(){const current={city:$('cityFilter').value,venue:$('venueFilter').value,intent:$('intentFilter').value},cities=[...new Set(rows.map(r=>cityOf(eventOf(r))).filter(Boolean))].sort(),venues=[...new Set(rows.map(r=>eventOf(r).venue).filter(Boolean))].sort();$('cityFilter').innerHTML=option('',t('allCities'),current.city)+cities.map(x=>option(x,x,current.city)).join('');$('venueFilter').innerHTML=option('',t('allVenues'),current.venue)+venues.map(x=>option(x,x,current.venue)).join('');$('intentFilter').innerHTML=option('',t('allIntentions'),current.intent)+Object.entries(INTENT_LABELS).map(([value,label])=>option(value,label,current.intent)).join('')}
function programme(e){return(e.programme||[]).map(x=>`<li>${esc([x.composer,x.work_title||x.title].filter(Boolean).join(' · '))}</li>`).join('')}
function credits(e){const cast=(e.credits||[]).filter(x=>x.character),team=(e.credits||[]).filter(x=>!x.character);return `${cast.length?`<h3>${t('cast')}</h3><ul class="credit-list">${cast.map(x=>`<li>${esc(x.character)} — ${esc(x.artist_name)}</li>`).join('')}</ul>`:''}${team.length?`<h3>${t('team')}</h3><ul class="credit-list">${team.map(x=>`<li>${esc(x.role||'Artist')} — ${esc(x.artist_name)}</li>`).join('')}</ul>`:''}`}
function timeMatches(value,filter){const time=String(value||'').slice(0,5);if(!filter||!time)return true;if(filter==='before')return time<'18:00';if(filter==='evening')return time>='18:00'&&time<='20:00';return time>'20:00'}
function visibleExplorerRows(){const query=explorerFilters.query.trim().toLowerCase();return explorerRows.filter(e=>(!explorerFilters.city||cityOf(e)===explorerFilters.city)&&(!explorerFilters.venue||String(e.venue||'')===explorerFilters.venue)&&(!explorerFilters.eventType||e.event_type===explorerFilters.eventType)&&timeMatches(e.start_time,explorerFilters.time)&&(!query||[titleOf(e),e.composer,e.artist_name,e.organization,e.venue].some(v=>String(v||'').toLowerCase().includes(query)))).sort((a,b)=>timeOf(a).localeCompare(timeOf(b))||keyOfEvent(a).localeCompare(keyOfEvent(b)))}
function renderExplorerFilters(){const cities=[...new Set(explorerRows.map(cityOf).filter(Boolean))].sort(),venues=[...new Set(explorerRows.filter(e=>!explorerFilters.city||cityOf(e)===explorerFilters.city).map(e=>e.venue).filter(Boolean))].sort();return `<div class="explorer-filters"><label>${t('city')}<select id="explorerCity">${option('',t('allCities'),explorerFilters.city)}${cities.map(x=>option(x,x,explorerFilters.city)).join('')}</select></label><label>${t('venue')}<select id="explorerVenue">${option('',t('allVenues'),explorerFilters.venue)}${venues.map(x=>option(x,x,explorerFilters.venue)).join('')}</select></label><label>${t('eventType')}<select id="explorerType">${option('',t('allTypes'),explorerFilters.eventType)}${EVENT_TYPES.map(x=>option(x,x.replaceAll('_',' '),explorerFilters.eventType)).join('')}</select></label><label>${t('time')}<select id="explorerTime">${option('',t('allTimes'),explorerFilters.time)}${option('before',t('before'),explorerFilters.time)}${option('evening',t('evening'),explorerFilters.time)}${option('after',t('after'),explorerFilters.time)}</select></label><label class="wide">${t('search')}<input id="explorerQuery" value="${esc(explorerFilters.query)}" placeholder="${esc(t('searchPlaceholder'))}"></label></div>`}
function explorerCard(e){const key=keyOfEvent(e),inSchedule=rows.some(r=>String(r.event_key)===key);return `<article class="performance"><div class="performance-time">${esc(timeOf(e)||'—')}</div><h3>${esc(titleOf(e))}</h3><div class="meta">${esc(locationOf(e))}</div>${e.event_type?`<span class="badge">${esc(String(e.event_type).replaceAll('_',' '))}</span>`:''}<div class="result-actions"><button class="secondary" type="button" data-detail="${esc(key)}">${t('details')}</button><button type="button" data-add="${esc(key)}" ${inSchedule?'disabled':''}>${inSchedule?t('added'):t('add')}</button></div></article>`}
function bindExplorerFilters(){const bind=(id,key,event='change')=>{$(id)[`on${event}`]=()=>{explorerFilters[key]=$(id).value;if(key==='city')explorerFilters.venue='';renderExplorer()}};bind('explorerCity','city');bind('explorerVenue','venue');bind('explorerType','eventType');bind('explorerTime','time');bind('explorerQuery','query','input')}
function searchCard(e){const key=keyOfEvent(e),inSchedule=rows.some(r=>String(r.event_key)===key);return `<article class="performance"><div class="performance-time">${esc(dateOf(e))} · ${esc(timeOf(e)||'—')}</div><h3>${esc(titleOf(e))}</h3><div class="meta">${esc([e.work_title,e.composer,e.artist_name,e.organization,e.venue,cityOf(e)].filter(Boolean).join(' · '))}</div>${e.event_type?`<span class="badge">${esc(String(e.event_type).replaceAll('_',' '))}</span>`:''}<div class="result-actions"><button class="secondary" type="button" data-detail="${esc(key)}">${t('details')}</button><button type="button" data-add="${esc(key)}" ${inSchedule?'disabled':''}>${inSchedule?t('added'):t('add')}</button></div></article>`}
function renderSearchForm(){const cities=[...new Set([...searchOptions.cities,...searchRows.map(cityOf)].filter(Boolean))].sort(),venues=[...new Set([...searchOptions.venues,...searchRows.map(e=>e.venue)].filter(Boolean))].sort();return `<div class="search-form"><label class="wide">${t('search')}<input id="searchQuery" value="${esc(searchState.query)}" placeholder="${esc(t('searchPlaceholder'))}"></label><label>${t('startDate')}<input id="searchStart" type="date" value="${esc(searchState.startDate)}"></label><label>${t('endDate')}<input id="searchEnd" type="date" value="${esc(searchState.endDate)}"></label><label>${t('city')}<select id="searchCity"><option value="">${t('allCities')}</option>${cities.map(x=>`<option ${x===searchState.city?'selected':''}>${esc(x)}</option>`).join('')}</select></label><label>${t('venue')}<select id="searchVenue"><option value="">${t('allVenues')}</option>${venues.map(x=>`<option ${x===searchState.venue?'selected':''}>${esc(x)}</option>`).join('')}</select></label><label>${t('eventType')}<select id="searchType"><option value="">${t('allTypes')}</option>${EVENT_TYPES.map(x=>`<option value="${x}" ${x===searchState.eventType?'selected':''}>${esc(x.replaceAll('_',' '))}</option>`).join('')}</select></label><label>${t('time')}<select id="searchTime"><option value="">${t('allTimes')}</option><option value="before" ${searchState.time==='before'?'selected':''}>${t('before')}</option><option value="evening" ${searchState.time==='evening'?'selected':''}>${t('evening')}</option><option value="after" ${searchState.time==='after'?'selected':''}>${t('after')}</option></select></label><div class="result-actions wide"><button id="runSearch" type="button">${t('searchButton')}</button><button id="clearSearch" class="secondary" type="button">${t('clearSearch')}</button></div></div>`}
function bindSearchForm(){const fields={searchQuery:'query',searchStart:'startDate',searchEnd:'endDate',searchCity:'city',searchVenue:'venue',searchType:'eventType',searchTime:'time'};Object.entries(fields).forEach(([id,key])=>$(id).oninput=$(id).onchange=()=>{searchState[key]=$(id).value});$('runSearch').onclick=runSearch;$('clearSearch').onclick=()=>{Object.keys(searchState).forEach(k=>searchState[k]='');searchRows=[];renderExplorer()}}
async function runSearch(){const start=$('searchStart').value,end=$('searchEnd').value;if(!start||!end||start>end){setStatus(t('invalidDates'),true);return}Object.assign(searchState,{query:$('searchQuery').value,startDate:start,endDate:end,city:$('searchCity').value,venue:$('searchVenue').value,eventType:$('searchType').value,time:$('searchTime').value});$('contextContent').innerHTML=renderSearchForm()+`<div class="empty">${t('searching')}</div>`;bindSearchForm();try{const d=await api({action:'schedule_events',date_from:start,date_to:end,query:searchState.query,cities:searchState.city?[searchState.city]:[],venues:searchState.venue?[searchState.venue]:[],event_type:searchState.eventType});const seen=new Set();searchRows=(d.events||[]).filter(e=>{const k=keyOfEvent(e);if(!k||seen.has(k))return false;seen.add(k);return timeMatches(e.start_time,searchState.time)});renderExplorer()}catch(error){$('contextContent').innerHTML=renderSearchForm()+`<div class="empty error">${esc(error.message)}</div>`;bindSearchForm()}}
function renderExplorer(){const selected=rows.find(r=>String(r.event_key)===String(selectedId)),date=selected?dateOf(eventOf(selected)):'';$('explorerTitle').textContent=explorerMode==='search'?t('searchMode'):t('other');$('explorerDate').textContent=explorerMode==='same-day'?date:'';$('sameDayTab').textContent=t('sameDay');$('searchTab').textContent=t('searchMode');$('sameDayTab').classList.toggle('active',explorerMode==='same-day');$('searchTab').classList.toggle('active',explorerMode==='search');if(explorerDetail){renderExplorerDetail();return}if(explorerMode==='search'){const visible=searchRows.slice().sort((a,b)=>dateOf(a).localeCompare(dateOf(b))||timeOf(a).localeCompare(timeOf(b))||keyOfEvent(a).localeCompare(keyOfEvent(b)));$('contextContent').innerHTML=renderSearchForm()+(visible.length?`<div class="explorer-results">${visible.map(searchCard).join('')}</div>`:`<div class="empty">${searchState.startDate?t('noSearch'):''}</div>`);bindSearchForm();document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>showDetail(b.dataset.detail));document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addExplorerEvent(b.dataset.add));return}if(!selected){$('contextContent').innerHTML=`<div class="empty">${t('empty')}</div>`;return}const visible=visibleExplorerRows();$('contextContent').innerHTML=renderExplorerFilters()+`<div class="explorer-results">${visible.length?visible.map(explorerCard).join(''):`<div class="empty">${t('none')}</div>`}</div>`;bindExplorerFilters();document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>showDetail(b.dataset.detail));document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addExplorerEvent(b.dataset.add))}
function renderExplorerDetail(){const e=explorerDetail,key=keyOfEvent(e),inSchedule=rows.some(r=>String(r.event_key)===key),source=e.source_url||e.detail_url||e.original_url||'';$('contextContent').innerHTML=`<button id="backResults" class="secondary" type="button">← ${t('back')}</button><div class="event-title">${esc(titleOf(e))}</div><div class="hint">${esc([e.date,timeOf(e),e.organization,e.venue,cityOf(e)].filter(Boolean).join(' · '))}</div>${e.programme?.length?`<div class="subtle"><h3>${t('programme')}</h3><ul class="programme">${programme(e)}</ul></div>`:''}${credits(e)?`<div class="subtle">${credits(e)}</div>`:''}${source?`<p><a href="${esc(source)}" target="_blank" rel="noopener noreferrer">${t('original')}</a></p>`:''}<button id="detailAdd" type="button" ${inSchedule?'disabled':''}>${inSchedule?t('added'):t('add')}</button>`;$('backResults').onclick=()=>{explorerDetail=null;renderExplorer()};$('detailAdd').onclick=()=>addExplorerEvent(key)}
async function loadExplorer(){const selected=rows.find(r=>String(r.event_key)===String(selectedId));explorerDetail=null;if(!selected){explorerRows=[];if(explorerMode==='same-day')renderExplorer();return}const e=eventOf(selected),date=dateOf(e),request=++explorerRequest;explorerFilters.city='';explorerFilters.venue='';explorerFilters.eventType='';explorerFilters.time='';explorerFilters.query='';if(explorerMode==='search'){renderExplorer();return}$('explorerDate').textContent=date;$('contextContent').innerHTML=`<div class="empty">${t('loading')}</div>`;try{const d=await api({action:'schedule_events',date_from:date,date_to:date});if(request!==explorerRequest)return;const selectedKey=String(selectedId),seen=new Set();explorerRows=(d.events||[]).filter(item=>{const key=keyOfEvent(item);if(!key||key===selectedKey||seen.has(key))return false;seen.add(key);return dateOf(item)===date});const keys=explorerRows.map(keyOfEvent).filter(Boolean);if(keys.length){const rel=await api({action:'get_event_relations',event_keys:keys});if(request!==explorerRequest)return;for(const item of rel.relations||[])relations.set(String(item.event_key),item)}renderExplorer()}catch(error){if(request===explorerRequest)$('contextContent').innerHTML=`<div class="empty error">${esc(error.message)}</div>`}}
async function showDetail(key){const cached=[...explorerRows,...searchRows].find(e=>keyOfEvent(e)===String(key));explorerDetail=cached||null;renderExplorer();try{const d=await api({action:'schedule_event_detail',event_id:key});explorerDetail=d.event||cached;renderExplorer()}catch(error){setStatus(error.message,true)}}
function renderRows(){const list=$('scheduleList'),visible=filteredRows();if(!visible.length){list.innerHTML=`<div class="hint">${t('noFilter')}</div>`;return}list.innerHTML=visible.map(row=>{const e=eventOf(row),key=String(row.event_key),state=intentOf(row),selected=String(selectedId)===key;return `<article class="schedule-event ${state==='must_go'?'must-go':''} ${selected?'selected':''}" draggable="true" data-row="${esc(key)}"><button class="event-select" type="button" data-select="${esc(key)}" aria-pressed="${selected}"><h3>${esc(titleOf(e))}</h3><div>${esc([window.ByelinguaI18n.formatDate(e.date,language),timeOf(e)].filter(Boolean).join(' · '))}</div><div class="meta">${esc(locationOf(e))}</div><span class="hint">${t('explore')} →</span></button><div class="actions"><select class="intent" data-intent="${esc(key)}" aria-label="${t('intent')}">${Object.entries(INTENT_LABELS).map(([value,label])=>option(value,label,state)).join('')}</select><button type="button" class="secondary" data-remove="${esc(key)}">${t('remove')}</button></div></article>`}).join('');list.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>selectEvent(b.dataset.select));list.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>removeEvent(b.dataset.remove));list.querySelectorAll('[data-intent]').forEach(s=>{s.onclick=e=>e.stopPropagation();s.onchange=()=>setIntent(s.dataset.intent,s.value)});list.querySelectorAll('[data-row]').forEach(card=>{card.ondragstart=()=>{dragId=card.dataset.row};card.ondragover=e=>e.preventDefault();card.ondrop=()=>reorder(dragId,card.dataset.row)})}
function selectEvent(key){selectedId=String(key);renderRows();loadExplorer();if(innerWidth<=800)$('context').classList.add('open')}
async function addExplorerEvent(key){if(rows.some(r=>String(r.event_key)===String(key)))return;try{const d=await api({action:'add_event_to_schedule',schedule_id:scheduleId,event_key:key});rows=d.events||rows;schedule=d.schedule||schedule;if(!relations.has(String(key))){await api({action:'set_event_relation',event_key:key,intent_status:'maybe_go',is_planned:true});relations.set(String(key),{intent_status:'maybe_go',is_planned:true})}else{const existing=relations.get(String(key));if(!existing.is_planned){await api({action:'set_event_relation',event_key:key,intent_status:existing.intent_status,is_planned:true});relations.set(String(key),{...existing,is_planned:true})}}renderHeader();populateLeftFilters();renderRows();renderExplorer();setStatus(t('saved'))}catch(error){setStatus(error.message,true)}}
async function setIntent(key,value){const old=relations.get(String(key));relations.set(String(key),{...(old||{}),intent_status:value,is_planned:true});renderRows();try{await api({action:'set_event_relation',event_key:key,intent_status:value,is_planned:true});if(schedule?.status==='planned'){const d=await api({action:'mark_schedule_needs_confirmation',schedule_id:scheduleId});schedule=d.schedule||{...schedule,status:'draft'};renderHeader();setStatus(language==='en'?'Changes saved. Please confirm the schedule again.':'修改已保存，请重新确认行程。')}}catch(error){if(old)relations.set(String(key),old);renderRows();setStatus(error.message,true)}}
async function removeEvent(key){const before=rows;rows=rows.filter(r=>String(r.event_key)!==String(key));if(String(selectedId)===String(key))selectedId=null;renderHeader();populateLeftFilters();renderRows();renderExplorer();try{const d=await api({action:'remove_event_from_schedule',schedule_id:scheduleId,event_key:key});rows=d.events||[];schedule=d.schedule||schedule;renderHeader();populateLeftFilters();renderRows();renderExplorer();setStatus(t('saved'))}catch(error){rows=before;renderHeader();populateLeftFilters();renderRows();renderExplorer();setStatus(error.message,true)}}
async function reorder(from,to){if(!from||from===to)return;const order=rows.map(r=>String(r.event_key)),a=order.indexOf(from),b=order.indexOf(to);if(a<0||b<0)return;order.splice(a,1);order.splice(b,0,from);const map=new Map(rows.map(r=>[String(r.event_key),r]));rows=order.map(k=>map.get(k));renderRows();try{const d=await api({action:'reorder_schedule_events',schedule_id:scheduleId,ordered_event_keys:order});rows=d.events||rows;setStatus(t('saved'))}catch(error){setStatus(error.message,true)}}
function setStatus(message,error=false){$('status').textContent=message||'';$('status').className=message?`status ${error?'error':'success'}`:'status'}
async function confirmSchedule(){const button=$('confirm');if(button.disabled)return;button.disabled=true;setStatus(language==='en'?'Confirming schedule…':'正在确认行程…');try{await api({action:'update_schedule_status',schedule_id:scheduleId,status:'planned'});location.href=`/schedule-summary.html?schedule_id=${encodeURIComponent(scheduleId)}`}catch(error){button.disabled=false;setStatus(error.message,true)}}
function applyCopy(){$('eventsHeading').textContent=t('scheduleEvents');$('eventsHint').textContent=t('drag');$('explorerTitle').textContent=t('other');$('clearFilters').textContent=t('clear');document.querySelectorAll('[data-copy]').forEach(e=>e.textContent=t(e.dataset.copy))}
async function init(){applyCopy();populateLeftFilters();renderExplorer();$('sameDayTab').onclick=()=>{explorerMode='same-day';renderExplorer();loadExplorer()};$('searchTab').onclick=()=>{explorerMode='search';if(!searchState.startDate)searchState.startDate=schedule?.start_date||'';if(!searchState.endDate)searchState.endDate=schedule?.end_date||searchState.startDate;renderExplorer()};if(!scheduleId){setStatus('Missing schedule_id.',true);return}try{const d=await api({action:'get_schedule',schedule_id:scheduleId});schedule=d.schedule;rows=d.events||[];searchState.startDate=schedule.start_date||rows.map(r=>dateOf(eventOf(r))).filter(Boolean).sort()[0]||'';searchState.endDate=schedule.end_date||searchState.startDate;try{const options=await api({action:'schedule_options'});searchOptions={cities:options.cities||[],venues:(options.venues||[]).map(v=>v.name).filter(Boolean)}}catch(_){/* Search remains usable with date/text filters. */}const keys=rows.map(r=>r.event_key).filter(Boolean),rel=await api({action:'get_event_relations',event_keys:keys});relations=new Map((rel.relations||[]).map(r=>[String(r.event_key),r]));renderHeader();populateLeftFilters();renderRows();renderExplorer()}catch(error){setStatus(error.message,true)}}
['dateFilter','cityFilter','venueFilter','intentFilter'].forEach(id=>$(id).onchange=renderRows);$('clearFilters').onclick=()=>{for(const id of ['dateFilter','cityFilter','venueFilter','intentFilter'])$(id).value='';renderRows()};$('confirm').onclick=confirmSchedule;$('viewSummary').onclick=()=>(location.href=`/schedule-summary.html?schedule_id=${encodeURIComponent(scheduleId)}`);$('backBuilder').onclick=()=>location.href=`/schedule.html?schedule_id=${encodeURIComponent(scheduleId)}`;$('contextToggle').onclick=()=>$('context').classList.add('open');$('closeContext').onclick=()=>$('context').classList.remove('open');$('signOut').onclick=()=>location.href='/';document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{localStorage.setItem('byelinguaUiLanguage',b.dataset.lang);location.reload()});
const renameButton=document.createElement('button');renameButton.id='rename';renameButton.type='button';renameButton.className='secondary';renameButton.textContent=language==='en'?'Rename':'重命名';$('confirm').before(renameButton);renameButton.onclick=async()=>{const title=prompt(language==='en'?'Schedule title':'行程名称',schedule?.title||'');if(title===null)return;try{const d=await api({action:'rename_schedule',schedule_id:scheduleId,title});schedule=d.schedule||{...schedule,title};renderHeader();setStatus(t('saved'))}catch(error){setStatus(error.message,true)}};
init();
</script></body></html>

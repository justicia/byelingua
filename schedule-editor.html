<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Byelingua · Schedule Editor</title><style>
:root{--ink:#17201b;--muted:#68716b;--paper:#f5f2e9;--card:#fffdf8;--forest:#214d3a;--soft:#e8eee9;--line:#d7d7ce}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}a{color:var(--forest)}button,input,select{font:inherit}button{border:1px solid var(--forest);border-radius:5px;padding:8px 11px;background:var(--forest);color:#fff;font-weight:700;cursor:pointer}button.secondary{background:transparent;color:var(--forest);border-color:#aebbb2}main{width:min(1400px,calc(100% - 28px));margin:auto;padding:12px 0 48px}.top{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--line);padding:10px 0 14px;gap:18px}.brand{font:500 34px/.95 Georgia,serif;color:var(--forest);text-decoration:none}.site-nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.editor-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-end;padding:14px 0}.editor-head h1{font:500 29px/1.1 Georgia,serif;color:var(--forest);margin:0}.hint,.meta{color:var(--muted);font-size:12px}.status{min-height:20px;margin-top:6px}.error{color:#9e3737}.success{color:var(--forest)}.editor-grid{display:grid;grid-template-columns:minmax(0,7fr) minmax(300px,3fr);gap:18px;align-items:start}.workspace,.context{background:var(--card);border:1px solid var(--line);border-radius:7px}.workspace{padding:14px}.context{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}.context-section{padding:14px;border-bottom:1px solid var(--line)}.context-section:last-child{border-bottom:0}.context h2,.context h3{margin:0 0 8px;color:var(--forest);font-family:Georgia,serif}.filters{display:grid;gap:8px}.filters label{font-size:12px;font-weight:700}.filters input,.filters select{width:100%;padding:8px;border:1px solid #c8cdc5;border-radius:5px;background:#fff}.schedule-list{display:grid;gap:9px}.schedule-event{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;border:1px solid var(--line);border-radius:6px;padding:11px;background:#fff}.schedule-event.must-go{border-left:3px solid var(--forest);background:var(--soft)}.schedule-event[draggable=true]{cursor:grab}.schedule-event h3{margin:0;color:var(--forest);font:600 17px/1.2 Georgia,serif}.schedule-event .actions{display:flex;gap:6px;flex-wrap:wrap}.schedule-event .actions button{font-size:12px;padding:5px 8px}.intent{padding:5px 7px;border:1px solid #bfc9c1;border-radius:4px;background:#fff;color:var(--ink);font-size:12px}.programme,.credit-list{margin:5px 0 0;padding-left:18px}.context .event-title{font:600 21px/1.2 Georgia,serif;color:var(--forest);margin:0 0 4px}.context .subtle{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}.context .close-mobile{display:none}.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}.summary-stat{padding:8px;background:var(--soft);border-radius:5px}.summary-stat strong{display:block;color:var(--forest);font-size:18px}@media(max-width:800px){main{width:calc(100% - 20px)}.top{flex-direction:column}.editor-grid{display:block}.context{display:none;position:fixed;inset:0;z-index:20;max-height:none;border-radius:0}.context.open{display:block}.context .close-mobile{display:block;position:absolute;right:12px;top:10px;border:0;background:transparent;color:var(--forest);font-size:24px;padding:0}.context-toggle{display:block!important}.editor-head{align-items:flex-start;flex-direction:column}.schedule-event{grid-template-columns:20px 1fr}.schedule-event>.actions{grid-column:2}.context-toggle{display:block!important}}
.context-toggle{display:none}
</style></head><body><main><header class="top"><a class="brand" href="/">BYELINGUA</a><nav class="site-nav"><a href="/">Home</a><a href="/account.html">User Center</a><button id="signOut" type="button" class="secondary">Sign out</button><button type="button" class="secondary" data-lang="zh">中文</button><button type="button" class="secondary" data-lang="en">English</button></nav></header><section class="editor-head"><div><h1 id="scheduleTitle">Schedule</h1><div id="scheduleMeta" class="hint">Planning</div></div><div><button id="contextToggle" class="secondary context-toggle" type="button">Info / Filters</button><button id="confirm" type="button">Confirm Schedule</button></div></section><div id="status" class="status"></div><div class="editor-grid"><section class="workspace"><div class="toolbar"><div><h2 style="margin:0;color:var(--forest);font:600 21px Georgia,serif">Schedule Events</h2><div class="hint">Drag to reorder. Changes are saved automatically.</div></div><button id="backBuilder" type="button" class="secondary">Back to Schedule Builder</button></div><div id="scheduleList" class="schedule-list" style="margin-top:12px"></div></section><aside id="context" class="context"><button id="closeContext" class="close-mobile" type="button" aria-label="Close">×</button><section class="context-section"><h2>Filters</h2><div class="filters"><label>Date<input id="dateFilter" type="date"></label><label>City<select id="cityFilter"><option value="">All cities</option></select></label><label>Venue<select id="venueFilter"><option value="">All venues</option></select></label><label>Intent<select id="intentFilter"><option value="">All intentions</option><option value="must_go">一定要去</option><option value="maybe_go">行程可选</option><option value="interested">感兴趣</option></select></label></div></section><section id="contextContent" class="context-section"></section></aside></div></main><script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const INTENT_LABELS={interested:'感兴趣',maybe_go:'行程可选',must_go:'一定要去'};const params=new URLSearchParams(location.search),scheduleId=params.get('schedule_id')||'';let schedule=null,rows=[],relations=new Map(),selectedId=null,dragId=null;
function token(){for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i)||'';if(!k.startsWith('sb-')||!k.endsWith('-auth-token'))continue;try{const v=JSON.parse(localStorage.getItem(k)||'{}');if(v.access_token)return v.access_token}catch(_){}}return ''}
async function api(payload){const headers={'Content-Type':'application/json'},t=token();if(t)headers.Authorization=`Bearer ${t}`;const r=await fetch('/api',{method:'POST',headers,body:JSON.stringify(payload)}),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
function eventOf(row){return row.event||{}}
function cityOf(e){return String(e.city||e.location_city||'').trim()||String(e.venue||'').split(',').pop().trim()}
function locationOf(e){const parts=[];for(const value of [e.organization,e.venue,cityOf(e)])if(value&& !parts.includes(value))parts.push(value);return parts.join(' · ')}
function intentOf(row){return relations.get(String(row.event_key))?.intent_status||'interested'}
function filteredRows(){const date=$('dateFilter').value,city=$('cityFilter').value,venue=$('venueFilter').value,intent=$('intentFilter').value;return rows.filter(row=>{const e=eventOf(row);return(!date||String(e.date||'').slice(0,10)===date)&&(!city||cityOf(e)===city)&&(!venue||String(e.venue||'')===venue)&&(!intent||intentOf(row)===intent)})}
function renderHeader(){const cities=[...new Set(rows.map(r=>cityOf(eventOf(r))).filter(Boolean))],count=rows.length;const dates=rows.map(r=>String(eventOf(r).date||'').slice(0,10)).filter(Boolean).sort();$('scheduleTitle').textContent=schedule?.title||'Schedule';$('scheduleMeta').textContent=`${schedule?.status==='planned'?'Upcoming':'Planning'} · ${dates[0]||''}${dates.length>1?' – '+dates[dates.length-1]:''} · ${cities.join(' · ')} · ${count} events`;$('confirm').hidden=schedule?.status!=='draft'}
function populateFilters(){const cities=[...new Set(rows.map(r=>cityOf(eventOf(r))).filter(Boolean))].sort(),venues=[...new Set(rows.map(r=>eventOf(r).venue).filter(Boolean))].sort();$('cityFilter').innerHTML='<option value="">All cities</option>'+cities.map(x=>`<option>${esc(x)}</option>`).join('');$('venueFilter').innerHTML='<option value="">All venues</option>'+venues.map(x=>`<option>${esc(x)}</option>`).join('')}
function programme(e){return(e.programme||[]).map(x=>`<li>${esc([x.composer,x.work_title||x.title].filter(Boolean).join(' · '))}</li>`).join('')}
function credits(e){const cast=(e.credits||[]).filter(x=>x.character),team=(e.credits||[]).filter(x=>!x.character);return `${cast.length?`<h3>Cast</h3><ul class="credit-list">${cast.map(x=>`<li>${esc(x.character)} — ${esc(x.artist_name)}</li>`).join('')}</ul>`:''}${team.length?`<h3>Artistic Team</h3><ul class="credit-list">${team.map(x=>`<li>${esc(x.role||'Artist')} — ${esc(x.artist_name)}</li>`).join('')}</ul>`:''}`}
function renderSummary(){const counts={must_go:0,maybe_go:0,interested:0};rows.forEach(r=>counts[intentOf(r)]++);$('contextContent').innerHTML=`<h2>Schedule summary</h2><div class="summary-grid"><div class="summary-stat"><strong>${rows.length}</strong>events</div><div class="summary-stat"><strong>${counts.must_go}</strong>一定要去</div><div class="summary-stat"><strong>${counts.maybe_go}</strong>行程可选</div><div class="summary-stat"><strong>${counts.interested}</strong>感兴趣</div></div><div class="hint" style="margin-top:10px">${[...new Set(rows.map(r=>cityOf(eventOf(r))).filter(Boolean))].join(' · ')||'No cities yet'}</div>`}
function renderContext(){const row=rows.find(r=>String(r.event_key)===String(selectedId));if(!row){renderSummary();return}const e=eventOf(row),sourceUrl=e.source_url||e.detail_url||e.original_url||'';$('contextContent').innerHTML=`<h2>Event context</h2><div class="event-title">${esc(e.title||e.work_title||'Event')}</div><div class="hint">${esc([e.date,e.start_time,e.organization,e.venue,cityOf(e)].filter(Boolean).join(' · '))}</div>${e.programme?.length?`<div class="subtle"><h3>Programme</h3><ul class="programme">${programme(e)}</ul></div>`:''}<div class="subtle">${credits(e)}</div>${sourceUrl?`<p><a href="${esc(sourceUrl)}" target="_blank" rel="noopener noreferrer">View original ↗</a></p>`:''}`}
function renderRows(){const list=$('scheduleList'),visible=filteredRows();if(!visible.length){list.innerHTML='<div class="hint">No events match these filters.</div>';renderContext();return}list.innerHTML=visible.map(row=>{const e=eventOf(row),key=String(row.event_key),state=intentOf(row);return `<article class="schedule-event ${state==='must_go'?'must-go':''}" draggable="true" data-row="${esc(key)}"><input type="radio" name="selectedEvent" ${String(selectedId)===key?'checked':''} aria-label="Select event"><div><h3>${esc(e.title||e.work_title||'Event')}</h3><div>${esc([e.date,e.start_time].filter(Boolean).join(' · '))}</div><div class="meta">${esc(locationOf(e))}</div><select class="intent" data-intent="${esc(key)}" aria-label="Event intent">${Object.entries(INTENT_LABELS).map(([value,label])=>`<option value="${value}" ${state===value?'selected':''}>${label}</option>`).join('')}</select></div><div class="actions"><button type="button" class="secondary" data-select="${esc(key)}">Select</button><button type="button" class="secondary" data-remove="${esc(key)}">Remove</button></div></article>`}).join('');list.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>{selectedId=b.dataset.select;renderRows();renderContext()});list.querySelectorAll('input[type=radio]').forEach((r,i)=>r.onchange=()=>{selectedId=visible[i].event_key;renderContext()});list.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>removeEvent(b.dataset.remove));list.querySelectorAll('[data-intent]').forEach(s=>s.onchange=()=>setIntent(s.dataset.intent,s.value));list.querySelectorAll('[data-row]').forEach(card=>{card.ondragstart=()=>{dragId=card.dataset.row};card.ondragover=e=>e.preventDefault();card.ondrop=()=>reorder(dragId,card.dataset.row)});renderContext()}
async function setIntent(key,value){const old=relations.get(String(key));relations.set(String(key),{...(old||{}),intent_status:value,is_planned:true});renderRows();try{await api({action:'set_event_relation',event_key:key,intent_status:value,is_planned:true})}catch(e){if(old)relations.set(String(key),old);renderRows();setStatus(e.message,true)}}
async function removeEvent(key){const before=rows;rows=rows.filter(r=>String(r.event_key)!==String(key));renderHeader();renderRows();try{const d=await api({action:'remove_event_from_schedule',schedule_id:scheduleId,event_key:key});rows=d.events||[];schedule=d.schedule||schedule;renderHeader();populateFilters();renderRows();setStatus('Saved')}catch(e){rows=before;renderRows();setStatus(e.message,true)}}
async function reorder(from,to){if(!from||from===to)return;const order=rows.map(r=>String(r.event_key));const a=order.indexOf(from),b=order.indexOf(to);if(a<0||b<0)return;order.splice(a,1);order.splice(b,0,from);const map=new Map(rows.map(r=>[String(r.event_key),r]));rows=order.map(k=>map.get(k));renderRows();try{const d=await api({action:'reorder_schedule_events',schedule_id:scheduleId,ordered_event_keys:order});rows=d.events||rows;setStatus('Saved')}catch(e){setStatus(e.message,true)}}
function setStatus(message,error=false){$('status').textContent=message||'';$('status').className=message?`status ${error?'error':'success'}`:'status'}
async function confirmSchedule(){try{const d=await api({action:'update_schedule_status',schedule_id:scheduleId,status:'planned'});schedule=d.schedule||schedule;renderHeader();setStatus('Schedule confirmed.')}catch(e){setStatus(e.message,true)}}
async function init(){if(!scheduleId){setStatus('Missing schedule_id.',true);return}try{const d=await api({action:'get_schedule',schedule_id:scheduleId});schedule=d.schedule;rows=d.events||[];const keys=rows.map(r=>r.event_key).filter(Boolean);const rel=await api({action:'get_event_relations',event_keys:keys});relations=new Map((rel.relations||[]).map(r=>[String(r.event_key),r]));renderHeader();populateFilters();renderRows()}catch(e){setStatus(e.message,true)}}
['dateFilter','cityFilter','venueFilter','intentFilter'].forEach(id=>$(id).onchange=renderRows);$('confirm').onclick=confirmSchedule;$('backBuilder').onclick=()=>location.href=`/schedule.html?schedule_id=${encodeURIComponent(scheduleId)}`;$('contextToggle').onclick=()=>$('context').classList.add('open');$('closeContext').onclick=()=>$('context').classList.remove('open');$('signOut').onclick=()=>location.href='/';document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{localStorage.setItem('byelinguaUiLanguage',b.dataset.lang);location.reload()});init();
</script><script>
const renameButton=document.createElement('button');renameButton.id='rename';renameButton.type='button';renameButton.className='secondary';renameButton.textContent='Rename';$('confirm').before(renameButton);renameButton.onclick=async()=>{const title=prompt('Schedule title',schedule?.title||'');if(title===null)return;try{const d=await api({action:'rename_schedule',schedule_id:scheduleId,title});schedule=d.schedule||{...schedule,title};renderHeader();setStatus('Saved')}catch(e){setStatus(e.message,true)}};
</script></body></html>

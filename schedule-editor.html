',searchMode:'搜索并添加',sameDay:'其他演出',startDate:'开始日期',endDate:'结束日期',searchButton:'搜索',clearSearch:'清除',searching:'正在搜索演出……',noSearch:'没有找到符合条件的演出',invalidDates:'请输入有效的日期范围。',saved:'已保存',confirming:'正在确认行程…',confirmed:'已确认',confirmUpdated:'确认更新后的行程',reconfirmationNotice:'此行程在确认后发生了修改。请检查修改内容并重新确认行程。',planning:'规划中',upcoming:'已确认',events:'场演出'}};

const params=new URLSearchParams(location.search),scheduleId=params.get('schedule_id')||'';
let schedule=null,rows=[],relations=new Map(),selectedId=null,explorerRows=[],explorerDetail=null,explorerRequest=0,explorerDateValue='',searchRows=[],searchOptions={cities:[],venues:[]};

function token(){for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i)||'';if(!k.startsWith('sb-')||!k.endsWith('-auth-token'))continue;try{const v=JSON.parse(localStorage.getItem(k)||'{}');if(v.access_token)return v.access_token}catch(_){}}return ''}

function eventOf(row){return row.event||{}}

function populateLeftFilters(){const current={city:$('cityFilter').value,venue:$('venueFilter').value},cities=[...new Set(rows.map(r=>cityOf(eventOf(r))).filter(Boolean))].sort(),venues=[...new Set(rows.map(r=>eventOf(r).venue).filter(Boolean))].sort();$('cityFilter').innerHTML=option('',t('allCities'),current.city)+cities.map(x=>option(x,x,current.city)).join('');$('venueFilter').innerHTML=option('',t('allVenues'),current.venue)+venues.map(x=>option(x,x,current.venue)).join('')}

function clockMinutes(value){const match=String(value||'').match(/^(\d{1,2}):(\d{2})/);return match?Number(match[1])*60+Number(match[2]):null}
function explicitEndMinutes(e){const start=clockMinutes(e.start_time);if(start===null)return null;const end=clockMinutes(e.end_time);if(end!==null)return end;const duration=Number(e.duration_minutes);return Number.isFinite(duration)&&duration>0?start+duration:null}

function bindExplorerFilters(){const bind=(id,key,event='change')=>{$(id)[`on${event}`]=()=>{explorerFilters[key]=$(id).value;if(key==='city')explorerFilters.venue='';renderExplorer()}};bind('explorerCity','city');bind('explorerVenue','venue');bind('explorerType','eventType');bind('explorerTime','time');bind('explorerQuery','query','input')}
function searchCard(e){const key=keyOfEvent(e),inSchedule=rows.some(r=>String(r.event_key)===key);return `<article class="performance"><div class="performance-time">${esc(dateOf(e))} · ${esc(timeOf(e)||'—')}</div><h3>${esc(titleOf(e))}</h3><div class="meta">${esc([e.work_title,e.composer,e.artist_name,e.organization,e.venue,cityOf(e)].filter(Boolean).join(' · '))}</div>${e.event_type?`<span class="badge">${esc(String(e.event_type).replaceAll('_',' '))}</span>`:''}<div class="result-actions"><button class="secondary" type="button" data-detail="${esc(key)}">${t('details')}</button><button type="button" data-add="${esc(key)}" ${inSchedule?'disabled':''}>${inSchedule?t('added'):t('add')}</button></div></article>`}
function renderSearchForm(){const cities=[...new Set([...searchOptions.cities,...searchRows.map(cityOf)].filter(Boolean))].sort(),venues=[...new Set([...searchOptions.venues,...searchRows.map(e=>e.venue)].filter(Boolean))].sort();return `<div class="search-form"><label class="wide">${t('search')}<input id="searchQuery" value="${esc(searchState.query)}" placeholder="${esc(t('searchPlaceholder'))}"></label><label>${t('startDate')}<input id="searchStart" type="date" value="${esc(searchState.startDate)}"></label><label>${t('endDate')}<input id="searchEnd" type="date" value="${esc(searchState.endDate)}"></label><label>${t('city')}<select id="searchCity"><option value="">${t('allCities')}</option>${cities.map(x=>`<option ${x===searchState.city?'selected':''}>${esc(x)}</option>`).join('')}</select></label><label>${t('venue')}<select id="searchVenue"><option value="">${t('allVenues')}</option>${venues.map(x=>`<option ${x===searchState.venue?'selected':''}>${esc(x)}</option>`).join('')}</select></label><label>${t('eventType')}<select id="searchType"><option value="">${t('allTypes')}</option>${EVENT_TYPES.map(x=>`<option value="${x}" ${x===searchState.eventType?'selected':''}>${esc(x.replaceAll('_',' '))}</option>`).join('')}</select></label><label>${t('time')}<select id="searchTime"><option value="">${t('allTimes')}</option><option value="before" ${searchState.time==='before'?'selected':''}>${t('before')}</option><option value="evening" ${searchState.time==='evening'?'selected':''}>${t('evening')}</option><option value="after" ${searchState.time==='after'?'selected':''}>${t('after')}</option></select></label><div class="result-actions wide"><button id="runSearch" type="button">${t('searchButton')}</button><button id="clearSearch" class="secondary" type="button">${t('clearSearch')}</button></div></div>`}
function bindSearchForm(){const fields={searchQuery:'query',searchStart:'startDate',searchEnd:'endDate',searchCity:'city',searchVenue:'venue',searchType:'eventType',searchTime:'time'};Object.entries(fields).forEach(([id,key])=>$(id).oninput=$(id).onchange=()=>{searchState[key]=$(id).value});$('runSearch').onclick=runSearch;$('clearSearch').onclick=()=>{Object.keys(searchState).forEach(k=>searchState[k]='');searchRows=[];renderExplorer()}}
async function runSearch(){const start=$('searchStart').value,end=$('searchEnd').value;if(!start||!end||start>end){setStatus(t('invalidDates'),true);return}Object.assign(searchState,{query:$('searchQuery').value,startDate:start,endDate:end,city:$('searchCity').value,venue:$('searchVenue').value,eventType:$('searchType').value,time:$('searchTime').value});$('contextContent').innerHTML=renderSearchForm()+`<div class="empty">${t('searching')}</div>`;bindSearchForm();try{const d=await api({action:'schedule_events',date_from:start,date_to:end,query:searchState.query,cities:searchState.city?[searchState.city]:[],venues:searchState.venue?[searchState.venue]:[],event_type:searchState.eventType});const seen=new Set();searchRows=(d.events||[]).filter(e=>{const k=keyOfEvent(e);if(!k||seen.has(k))return false;seen.add(k);return timeMatches(e.start_time,searchState.time)});renderExplorer()}catch(error){$('contextContent').innerHTML=renderSearchForm()+`<div class="empty error">${esc(error.message)}</div>`;bindSearchForm()}}
function renderExplorer(){const selected=rows.find(r=>String(r.event_key)===String(selectedId)),date=explorerDateValue|| (selected?dateOf(eventOf(selected)):''),english=language==='en';$('explorerTitle').textContent=t('other');$('explorerDate').textContent=date?window.ByelinguaI18n.formatDate(date,language):'';$('explorerDateLabel').textContent=date?window.ByelinguaI18n.formatDate(date,language):(english?'Select a date':'选择日期');$('previousDate').disabled=!date;$('nextDate').disabled=!date;if(explorerDetail){renderExplorerDetail();return}if(!selected&&!date){$('contextContent').innerHTML=`<div class="empty">${t('empty')}</div>`;return}const visible=visibleExplorerRows();$('contextContent').innerHTML=`<div class="explorer-results">${visible.length?visible.map(explorerCard).join(''):`<div class="empty">${t('none')}</div>`}</div>`;document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>showDetail(b.dataset.detail));document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addExplorerEvent(b.dataset.add))}
function renderExplorerDetail(){const e=explorerDetail,key=keyOfEvent(e),inSchedule=rows.some(r=>String(r.event_key)===key),english=language==='en',roleLabels=english?{}:{'stage director':'舞台导演',conductor:'指挥',lighting:'灯光',costumes:'服装','set designer':'舞美设计','chorus master':'合唱指挥',dramaturgy:'戏剧构作'};$('contextContent').innerHTML=`<button id="backResults" class="secondary" type="button">← ${t('back')}</button><div class="event-title">${esc(titleOf(e))}</div><div class="hint">${esc([e.date,timeOf(e),e.organization,e.venue,e.room,cityOf(e)].filter(Boolean).join(' · '))}</div>${window.ByelinguaEventDetail?window.ByelinguaEventDetail.render(e,{escape:esc,roleLabels,labels:{programme:t('programme'),cast:t('cast'),team:t('team'),ensembles:english?'Ensembles':'乐团与合唱团',officialSource:english?'Official source':'官方来源',reviews:english?'Reviews':'评论',noProgramme:english?'No programme listed.':'暂无节目内容',noCast:english?'No cast listed.':'暂无演员信息',noTeam:english?'No artistic team listed.':'暂无主创团队信息',noEnsembles:english?'No ensembles listed.':'暂无乐团与合唱团信息',noReviews:english?'No reviews yet.':'暂无评论'}}):''}<button id="detailAdd" type="button" ${inSchedule?'disabled':''}>${inSchedule?t('added'):t('add')}</button>`;$('backResults').onclick=()=>{explorerDetail=null;renderExplorer()};$('detailAdd').onclick=()=>addExplorerEvent(key)}
function isoDate(date){return String(date||'').slice(0,10)}
function shiftExplorerDate(delta){if(!explorerDateValue)return;const value=new Date(`${explorerDateValue}T12:00:00`);value.setDate(value.getDate()+delta);explorerDateValue=isoDate(value.toISOString());loadExplorer(explorerDateValue)}
async function loadExplorer(dateOverride){const selected=rows.find(r=>String(r.event_key)===String(selectedId)),selectedDate=selected?dateOf(eventOf(selected)):'';explorerDateValue=dateOverride||explorerDateValue||selectedDate;explorerDetail=null;if(!explorerDateValue){explorerRows=[];renderExplorer();return}const date=explorerDateValue,request=++explorerRequest;explorerFilters.city='';explorerFilters.venue='';explorerFilters.eventType='';explorerFilters.time='';explorerFilters.query='';$('contextContent').innerHTML=`<div class="empty">${t('loading')}</div>`;try{const d=await api({action:'schedule_events',date_from:date,date_to:date});if(request!==explorerRequest)return;const selectedKey=String(selectedId),scheduled=new Set(rows.map(row=>String(row.event_key))),seen=new Set();explorerRows=(d.events||[]).filter(item=>{const key=keyOfEvent(item);if(!key||key===selectedKey||scheduled.has(key)||seen.has(key)||dateOf(item)!==date)return false;seen.add(key);return true}).sort((a,b)=>timeOf(a).localeCompare(timeOf(b))||titleOf(a).localeCompare(titleOf(b)));renderExplorer()}catch(error){if(request===explorerRequest)$('contextContent').innerHTML=`<div class="empty error">${esc(error.message)}</div>`}}
async function showDetail(key){const cached=[...rows.map(eventOf),...explorerRows,...searchRows].find(e=>keyOfEvent(e)===String(key)||String(e.event_key)===String(key));explorerDetail=cached||null;renderExplorer();try{const d=await api({action:'schedule_event_detail',event_id:key});explorerDetail=d.event||cached;renderExplorer()}catch(error){setStatus(error.message,true)}}
function renderRows(){const list=$('scheduleList'),visible=filteredRows();if(!rows.length){const empty=language==='en'?['No performances in this schedule yet.','Add performances from Performance Search to start planning.','Find performances']:['此行程还没有演出。','从“演出搜索”中添加演出开始规划。','查找演出'];list.innerHTML=`<div class="planner-empty"><h3>${empty[0]}</h3><p class="hint">${empty[1]}</p><a class="secondary" href="/schedule.html">${empty[2]}</a></div>`;return}if(!visible.length){list.innerHTML=`<div class="hint">${t('noFilter')}</div>`;return}const groups=new Map();visible.forEach(row=>{const date=dateOf(eventOf(row))||'undated';if(!groups.has(date))groups.set(date,[]);groups.get(date).push(row)});list.innerHTML=[...groups].map(([date,group])=>`<section class="schedule-group"><h3 class="schedule-group-title">${date==='undated'?(language==='en'?'Undated':'未定日期'):esc(window.ByelinguaI18n.formatDate(date,language))}</h3>${group.map(row=>{const e=eventOf(row),key=String(row.event_key),selected=String(selectedId)===key,conflict=conflictsWith(row),type=e.event_type?String(e.event_type).replaceAll('_',' '):'';return `<article class="schedule-event ${selected?'selected':''}" data-row="${esc(key)}"><button class="event-select" type="button" data-select="${esc(key)}" aria-pressed="${selected}"><div class="event-time">${esc(timeOf(e)||'—')}</div><h3>${esc(titleOf(e))}</h3><div class="event-location">${esc(locationOf(e))}</div>${type?`<span class="badge event-type">${esc(type)}</span>`:''}${conflict?`<div class="conflict-warning">${language==='en'?'Potential conflict':'时间可能冲突'}</div>`:''}<div class="hint contextual-link">${t('explore')} →</div></button><div class="actions"><button type="button" class="secondary" data-detail="${esc(key)}">${t('details')}</button><button type="button" class="secondary" data-remove="${esc(key)}">${t('remove')}</button></div></article>`}).join('')}</section>`).join('');list.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>selectEvent(b.dataset.select));list.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>showDetail(b.dataset.detail));list.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>removeEvent(b.dataset.remove))}
let contextLocked=false;function setContextOpen(open){$('context').classList.toggle('open',open);const mobile=window.matchMedia('(max-width:800px)').matches;if(mobile&&open&&!contextLocked){window.ByelinguaOverlay?.lock();contextLocked=true}if((!open||!mobile)&&contextLocked){window.ByelinguaOverlay?.unlock();contextLocked=false}}
function selectEvent(key){selectedId=String(key);explorerDateValue=dateOf(eventOf(rows.find(row=>String(row.event_key)===String(key))||{}));renderRows();loadExplorer(explorerDateValue);if(innerWidth<=800)setContextOpen(true)}
async function addExplorerEvent(key){if(rows.some(r=>String(r.event_key)===String(key)))return;try{const d=await api({action:'add_event_to_schedule',schedule_id:scheduleId,event_key:key});rows=d.events||rows;schedule=d.schedule||schedule;if(!relations.has(String(key))){await api({action:'set_event_relation',event_key:key,intent_status:'optional',is_planned:true});relations.set(String(key),{intent_status:'optional',is_planned:true})}else{const existing=relations.get(String(key));if(!existing.is_planned){await api({action:'set_event_relation',event_key:key,intent_status:existing.intent_status==='maybe_go'?'optional':existing.intent_status,is_planned:true});relations.set(String(key),{...existing,is_planned:true})}}if(schedule?.status==='planned'){const changed=await api({action:'mark_schedule_needs_confirmation',schedule_id:scheduleId});schedule=changed.schedule||{...schedule,needs_reconfirmation:true}}renderHeader();populateLeftFilters();renderRows();renderExplorer();setStatus(t('saved'))}catch(error){setStatus(error.message,true)}}
async function removeEvent(key){const before=rows;rows=rows.filter(r=>String(r.event_key)!==String(key));if(String(selectedId)===String(key))selectedId=null;renderHeader();populateLeftFilters();renderRows();renderExplorer();try{const d=await api({action:'remove_event_from_schedule',schedule_id:scheduleId,event_key:key});rows=d.events||[];schedule=d.schedule||schedule;if(schedule?.status==='planned'){const changed=await api({action:'mark_schedule_needs_confirmation',schedule_id:scheduleId});schedule=changed.schedule||{...schedule,needs_reconfirmation:true}}renderHeader();populateLeftFilters();renderRows();renderExplorer();setStatus(t('saved'))}catch(error){rows=before;renderHeader();populateLeftFilters();renderRows();renderExplorer();setStatus(error.message,true)}}
function setStatus(message,error=false){$('status').textContent=message||'';$('status').className=message?`status ${error?'error':'success'}`:'status'}
async function confirmSchedule(){const button=$('confirm');if(button.disabled)return;button.disabled=true;setStatus(t('confirming'));try{await api({action:'update_schedule_status',schedule_id:scheduleId,status:'planned'});location.href=`/schedule-summary.html?schedule_id=${encodeURIComponent(scheduleId)}`}catch(error){button.disabled=false;setStatus(error.message,true)}}
function applyCopy(){const english=language==='en';$('plannerKicker').textContent=english?'Schedule':'行程';$('eventsHeading').textContent=t('scheduleEvents');$('eventsHint').textContent=t('drag');$('explorerTitle').textContent=t('other');$('clearFilters').textContent=t('clear');$('contextToggle').textContent=english?'Other performances':'其他演出';$('viewSummary').textContent=english?'View complete schedule':'查看完整行程';$('confirm').textContent=english?'Confirm Schedule':'确认行程';$('backBuilder').textContent=english?'Back to Performance Search':'返回演出搜索';document.querySelectorAll('.site-nav a')[0].textContent=english?'Home':'首页';document.querySelectorAll('.site-nav a')[1].textContent=english?'User Center':'用户中心';$('signOut').textContent=english?'Sign out':'退出登录';document.querySelectorAll('[data-copy]').forEach(e=>e.textContent=t(e.dataset.copy))}
function showAuthGate(){ $('authGate').hidden=false;$('authGate').querySelector('h2').textContent=language==='en'?'Sign in required':'需要登录';$('authGate').querySelector('p').textContent=language==='en'?'Sign in to view and edit this private schedule.':'登录后查看和编辑这个私人行程。';$('authGate').querySelector('a').textContent=language==='en'?'Go to Account':'前往账户';$('status').textContent='';$('status').className='status';document.querySelector('.editor-grid').hidden=true;document.querySelector('.editor-head .head-actions').hidden=true }
async function init(){applyCopy();populateLeftFilters();renderExplorer();$('previousDate').onclick=()=>shiftExplorerDate(-1);$('nextDate').onclick=()=>shiftExplorerDate(1);if(!scheduleId){setStatus('Missing schedule_id.',true);return}if(!token()){showAuthGate();return}try{const d=await api({action:'get_schedule',schedule_id:scheduleId});schedule=d.schedule;rows=d.events||[];const dates=rows.map(r=>dateOf(eventOf(r))).filter(Boolean).sort();explorerDateValue=dates[0]||'';const keys=rows.map(r=>r.event_key).filter(Boolean),rel=await api({action:'get_event_relations',event_keys:keys});relations=new Map((rel.relations||[]).map(r=>[String(r.event_key),r]));renderHeader();populateLeftFilters();renderRows();renderExplorer()}catch(error){setStatus(error.message,true)}}
['dateFilter','cityFilter','venueFilter'].forEach(id=>$(id).onchange=renderRows);$('clearFilters').onclick=()=>{for(const id of ['dateFilter','cityFilter','venueFilter'])$(id).value='';renderRows()};$('confirm').onclick=confirmSchedule;$('viewSummary').onclick=()=>(location.href=`/schedule-summary.html?schedule_id=${encodeURIComponent(scheduleId)}`);$('backBuilder').onclick=()=>location.href=`/schedule.html?schedule_id=${encodeURIComponent(scheduleId)}`;$('contextToggle').onclick=()=>setContextOpen(true);$('closeContext').onclick=()=>setContextOpen(false);document.addEventListener('keydown',event=>{if(event.key==='Escape'&&$('context').classList.contains('open'))setContextOpen(false)});$('signOut').onclick=()=>location.href='/';document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{localStorage.setItem('byelinguaUiLanguage',b.dataset.lang);location.reload()});
const renameButton=document.createElement('button');renameButton.id='rename';renameButton.type='button';renameButton.className='secondary';renameButton.textContent=language==='en'?'Rename':'重命名';$('confirm').before(renameButton);renameButton.onclick=async()=>{const title=prompt(language==='en'?'Schedule title':'行程名称',schedule?.title||'');if(title===null)return;try{const d=await api({action:'rename_schedule',schedule_id:scheduleId,title});schedule=d.schedule||{...schedule,title};renderHeader();setStatus(t('saved'))}catch(error){setStatus(error.message,true)}};
init();
</script></body></html>

<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="按国家阅读全球媒体，并建立自己的多语言订阅"><title>Byelingua · 跨语言阅读</title>
<style>
*{box-sizing:border-box}:root{--ink:#17201b;--muted:#69736d;--paper:#f4f2eb;--card:#fffef9;--forest:#214d3a;--lime:#dce86f;--line:#d9d8cf;--danger:#a73535}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;line-height:1.65}button,input,select,textarea{font:inherit}button{cursor:pointer}.layout{min-height:100vh;display:grid;grid-template-columns:280px 1fr}.side{background:var(--forest);color:#fff;padding:32px 25px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font:800 31px Georgia,serif}.tagline{color:#c9d8cf;font-size:12px;margin:2px 0 25px;letter-spacing:.09em}.country-nav{display:grid;gap:5px}.country{border:0;border-radius:10px;padding:11px 13px;background:transparent;color:#dce8e1;text-align:left}.country:hover,.country.active{background:#fff;color:var(--forest)}.country.mine{margin-bottom:12px;background:#ffffff12;border:1px solid #ffffff24}.account-card{margin-top:24px;padding-top:18px;border-top:1px solid #ffffff2c;font-size:13px}.account-card button{margin-top:8px;width:100%}main{width:min(1050px,100%);margin:auto;padding:42px 34px 70px}.hero{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:28px}.eyebrow{color:var(--forest);font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:12px}.hero h1{font:clamp(2.2rem,5vw,4.5rem)/1 Georgia,serif;margin:9px 0 14px;letter-spacing:-.04em}.hero p{color:var(--muted);max-width:620px;margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--forest);color:#fff;font-weight:700}.btn.accent{background:var(--lime);color:var(--ink)}.btn.secondary{background:var(--card);color:var(--ink);border:1px solid var(--line)}.btn.danger{background:#fff0ef;color:var(--danger);border:1px solid #efc9c6}.btn.small{padding:7px 10px;font-size:12px}.toolbar{display:flex;align-items:end;justify-content:space-between;gap:15px;margin:26px 0 17px}.toolbar h2{font:28px Georgia,serif;margin:0}.updated,.hint{color:var(--muted);font-size:12px}.articles{display:grid;gap:15px}.article,.panel{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:23px 25px}.meta{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:12px}.article h3{font:clamp(1.2rem,3vw,1.55rem)/1.35 Georgia,serif;margin:9px 0}.article h3 a{color:inherit;text-decoration:none}.article p{margin:0 0 12px;white-space:pre-wrap}.read{color:var(--forest);font-weight:750;text-decoration:none}.empty{padding:55px 22px;text-align:center;color:var(--muted);border:1px dashed #bfc4bd;border-radius:15px}.subscriptions{display:grid;gap:9px;margin:13px 0 25px}.subscription{display:flex;justify-content:space-between;gap:14px;align-items:center;background:#fff;padding:12px;border-radius:10px}.subscription strong{display:block}.admin{display:none;margin:24px 0}.admin.open{display:block}.row{display:flex;gap:9px;align-items:end}.row>*{flex:1}.status{min-height:22px;color:var(--muted);margin-top:9px}.error{color:var(--danger)}.success{color:#287040}label{display:block;font-weight:700;margin:0 0 5px}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #c8cdc5;border-radius:9px;background:#fff}dialog{border:0;border-radius:17px;width:min(650px,calc(100% - 28px));padding:0;box-shadow:0 24px 80px #10201844}dialog::backdrop{background:#10201899}.modal{padding:25px}.modal-head{display:flex;justify-content:space-between;gap:18px;margin-bottom:17px}.modal h2{margin:0}.close{border:0;background:transparent;font-size:25px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.wide{grid-column:1/-1}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.auth-step{display:grid;gap:13px}.translation{white-space:pre-wrap;max-height:58vh;overflow:auto;line-height:1.9}.quota{display:inline-block;background:#edf0e8;border-radius:99px;padding:3px 9px;font-size:12px}
@media(max-width:760px){.layout{grid-template-columns:1fr}.side{height:auto;position:static;padding:19px}.tagline{margin-bottom:13px}.country-nav{display:flex;overflow:auto}.country{white-space:nowrap}.country.mine{margin:0 8px 0 0}.account-card{display:none}.hero{display:block}.actions{margin-top:18px}main{padding:28px 14px 48px}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.row{display:grid}.subscription{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="layout"><aside class="side"><div class="brand">Byelingua</div><div class="tagline">WORLD MEDIA, IN YOUR LANGUAGE</div><nav id="countryNav" class="country-nav"></nav><div class="account-card"><div id="accountLabel">登录后建立自己的订阅</div><button id="accountButton" class="btn accent">邮箱验证码登录</button><button id="adminButton" class="btn secondary">管理员入口</button></div></aside><main>
<header class="hero"><div><div class="eyebrow">Global reading desk</div><h1>世界媒体，<br>用你的语言阅读。</h1><p>按国家浏览公共新闻；受邀用户可建立自己的订阅网站，并长期保留已经抓取和翻译的文章。</p></div><div class="actions"><button id="mobileAccount" class="btn secondary">登录</button><button id="wechatButton" class="btn secondary" hidden>＋ 微信文章</button><button id="addButton" class="btn accent" hidden>＋ 添加网站</button></div></header>
<section id="adminPanel" class="admin panel"><strong>管理员控制台</strong><div class="hint">公共订阅和邀请账户</div><div class="row" style="margin-top:13px"><div><label for="inviteEmail">受邀邮箱</label><input id="inviteEmail" type="email" placeholder="reader@example.com"></div><button id="inviteButton" class="btn">添加邀请</button><button id="publicAddButton" class="btn secondary">添加公共网站</button></div><div id="adminStatus" class="status"></div></section>
<div class="toolbar"><div><h2 id="sectionTitle">全部国家</h2><div id="viewHint" class="updated">公共订阅文章</div></div><div id="updated" class="updated">正在加载…</div></div>
<section id="personalPanel" hidden><div class="panel"><div class="row"><div><strong>我的网站</strong> <span id="quota" class="quota"></span></div><button id="runPersonal" class="btn small">立即更新</button></div><div id="subscriptions" class="subscriptions"></div><div id="personalStatus" class="status"></div></div></section>
<section id="articles" class="articles"><div class="empty">正在加载…</div></section></main></div>

<dialog id="authDialog"><form id="authForm" class="modal"><div class="modal-head"><div><h2>受邀用户登录</h2><div class="hint">输入受邀邮箱，我们会发送 6 位验证码。</div></div><button class="close" type="button" data-close="authDialog">×</button></div><div class="auth-step"><div><label for="authEmail">邮箱</label><input id="authEmail" type="email" required autocomplete="email"></div><div id="otpBox" hidden><label for="authOtp">邮箱验证码</label><input id="authOtp" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></div><div id="authStatus" class="status"></div><button id="authSubmit" class="btn" type="submit">发送验证码</button></div></form></dialog>

<dialog id="subscriptionDialog"><form id="subscriptionForm" class="modal"><div class="modal-head"><div><h2 id="subscriptionTitle">添加网站或 RSS</h2><div id="subscriptionHint" class="hint"></div></div><button class="close" type="button" data-close="subscriptionDialog">×</button></div><div class="grid"><div><label for="feedName">名称</label><input id="feedName" placeholder="例如：Scherzo"></div><div><label for="feedCountry">国家</label><select id="feedCountry"><option value="auto">自动识别</option><option value="cn">中国</option><option value="fr">法国</option><option value="es">西班牙</option><option value="de">德国</option><option value="it">意大利</option><option value="gb">英国</option><option value="us">美国</option><option value="at">奥地利</option><option value="ch">瑞士</option><option value="pt">葡萄牙</option><option value="other">其他地区</option></select></div><div class="wide"><label for="feedUrl">网站或 RSS 地址</label><input id="feedUrl" type="url" required placeholder="https://example.com/"></div><div><label for="feedMode">处理方式</label><select id="feedMode"><option value="summary">翻译并摘要</option><option value="translate">全文翻译</option></select></div><div><label for="feedLanguage">输出语言</label><select id="feedLanguage"><option value="zh">简体中文</option><option value="en">English</option><option value="es">Español</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="it">Italiano</option><option value="pt">Português</option><option value="ja">日本語</option></select></div></div><div id="formStatus" class="status"></div><div class="modal-actions"><button class="btn secondary" type="button" data-close="subscriptionDialog">取消</button><button class="btn" type="submit">保存网站</button></div></form></dialog>

<dialog id="articleDialog"><div class="modal"><div class="modal-head"><div><h2 id="detailTitle"></h2><div id="detailMeta" class="hint"></div></div><button class="close" type="button" data-close="articleDialog">×</button></div><div id="detailTranslation" class="translation"></div><div class="modal-actions"><a id="detailOriginal" class="btn secondary" target="_blank" rel="noopener noreferrer">阅读原文</a></div></div></dialog>

<dialog id="wechatDialog"><form id="wechatForm" class="modal"><div class="modal-head"><div><h2>导入微信公众号文章</h2><div class="hint">自动读取失败时，请在下面粘贴标题、公众号和全文。</div></div><button class="close" type="button" data-close="wechatDialog">×</button></div><div class="grid"><div class="wide"><label for="wechatUrl">微信文章链接</label><input id="wechatUrl" type="url" required placeholder="https://mp.weixin.qq.com/s/..."></div><div><label for="wechatLanguage">译文语言</label><select id="wechatLanguage"><option value="en">English</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="es">Español</option><option value="it">Italiano</option><option value="pt">Português</option><option value="ja">日本語</option><option value="zh">简体中文</option></select></div><div><label for="wechatAuthor">公众号（备用）</label><input id="wechatAuthor"></div><div class="wide"><label for="wechatTitle">标题（备用）</label><input id="wechatTitle"></div><div class="wide"><label for="wechatText">原文全文（备用）</label><textarea id="wechatText" style="min-height:170px"></textarea></div></div><div id="wechatStatus" class="status"></div><div class="modal-actions"><button class="btn secondary" type="button" data-close="wechatDialog">取消</button><button class="btn" type="submit">翻译并保存</button></div></form></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const countries={cn:"中国",fr:"法国",es:"西班牙",de:"德国",it:"意大利",gb:"英国",us:"美国",at:"奥地利",ch:"瑞士",pt:"葡萄牙",other:"其他地区"};
let publicData={articles:[]},personal={profile:{},subscriptions:[],articles:[]},active="all",client=null,session=null,adminPassword=sessionStorage.getItem("byelinguaAdmin")||"",otpSent=false,addingPublic=false;
const $=id=>document.getElementById(id),esc=v=>{const d=document.createElement("div");d.textContent=v||"";return d.innerHTML},date=v=>v?new Intl.DateTimeFormat("zh-CN",{year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date(v)):"日期未知",excerpt=(v,n=320)=>(v||"").replace(/\s+/g," ").slice(0,n)+((v||"").length>n?"…":"");
async function api(payload,{admin=false,auth=false}={}){const headers={"Content-Type":"application/json"};if(admin)headers["X-Admin-Password"]=adminPassword;if(auth&&session)headers.Authorization=`Bearer ${session.access_token}`;const r=await fetch("/api",{method:"POST",headers,body:JSON.stringify(payload)}),text=await r.text();let data;try{data=JSON.parse(text)}catch{throw new Error("服务器返回无法读取的内容")};if(!r.ok)throw new Error(data.error||"请求失败");return data}
function renderNav(){const list=Object.keys(countries);$("countryNav").innerHTML=`<button class="country mine ${active==="mine"?"active":""}" data-view="mine">★ 我的订阅</button><button class="country ${active==="all"?"active":""}" data-view="all">🌐 全部国家</button>`+list.map(code=>`<button class="country ${active===code?"active":""}" data-view="${code}">${esc(countries[code])}</button>`).join("");document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>switchView(b.dataset.view))}
function card(item,personalItem=false){const url=item.url||item.canonical_url||"#";return `<article class="article"><div class="meta"><span>${esc(item.source||countries[item.country]||"订阅")}</span><time>${esc(date(item.published||item.published_at||item.processed_at))}</time></div><h3><a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(item.title)}</a></h3><p>${esc(excerpt(item.result))}</p><button class="read" data-article="${esc(item.id)}" data-personal="${personalItem?1:0}">阅读全文 →</button></article>`}
function renderArticles(){const mine=active==="mine",items=mine?personal.articles:publicData.articles.filter(x=>active==="all"||x.country===active);$("personalPanel").hidden=!mine;$("sectionTitle").textContent=mine?"我的订阅":active==="all"?"全部国家":countries[active];$("viewHint").textContent=mine?"你的订阅网站与历史文章":"公共订阅文章";$("articles").innerHTML=items.length?items.map(x=>card(x,mine)).join(""):`<div class="empty">${mine?(session?"尚未生成个人订阅文章。":"请先登录受邀账户。"):"这个分类暂时没有文章。"}</div>`;document.querySelectorAll("[data-article]").forEach(b=>b.onclick=()=>openArticle(b.dataset.article,b.dataset.personal==="1"))}
function renderPersonal(){const p=personal.profile||{},subs=personal.subscriptions||[];$("quota").textContent=`${subs.length}/${p.max_subscriptions||3} 个网站`;$("subscriptions").innerHTML=subs.length?subs.map(x=>`<div class="subscription"><div><strong>${esc(x.name)}</strong><div class="hint">${esc(countries[x.country]||"其他地区")} · ${esc(x.url)}</div></div><button class="btn danger small" data-remove="${esc(x.id)}">删除</button></div>`).join(""):'<div class="hint">还没有个人订阅，点击“添加网站”开始。</div>';document.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>removePersonal(b.dataset.remove))}
async function switchView(view){active=view;if(view==="mine"&&!session){$("authDialog").showModal()}else if(view==="mine"){await loadPersonal()}renderNav();renderArticles()}
async function loadPublic(){try{publicData=await api({action:"get_public"});$("updated").textContent=`${publicData.articles.length} 篇 · ${publicData.updated_at?date(publicData.updated_at):"等待更新"}`}catch(e){$("articles").innerHTML=`<div class="empty">${esc(e.message)}</div>`}renderNav();renderArticles()}
async function initAuth(){try{const cfg=await api({action:"get_auth_config"});client=supabase.createClient(cfg.url,cfg.publishable_key);const result=await client.auth.getSession();session=result.data.session;client.auth.onAuthStateChange((_event,next)=>{session=next;updateAccount();if(session&&active==="mine")loadPersonal()});updateAccount()}catch(e){console.warn(e.message)}}
function updateAccount(){const email=session?.user?.email;$("accountLabel").textContent=email||"登录后建立自己的订阅";$("accountButton").textContent=email?"退出登录":"邮箱验证码登录";$("mobileAccount").textContent=email?"我的账户":"登录";$("addButton").hidden=!session&&!adminPassword}
async function loadPersonal(){if(!session)return;try{personal=await api({action:"get_my_data"},{auth:true});renderPersonal();renderArticles()}catch(e){$("articles").innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
$("accountButton").onclick=async()=>{if(session){await client.auth.signOut();personal={profile:{},subscriptions:[],articles:[]};active="all";renderNav();renderArticles()}else $("authDialog").showModal()};$("mobileAccount").onclick=()=>session?switchView("mine"):$("authDialog").showModal();
$("authForm").onsubmit=async e=>{e.preventDefault();const email=$("authEmail").value.trim(),status=$("authStatus");try{if(!otpSent){const {error}=await client.auth.signInWithOtp({email,options:{shouldCreateUser:false}});if(error)throw error;otpSent=true;$("otpBox").hidden=false;$("authSubmit").textContent="验证并登录";status.textContent="验证码已发送，请检查邮箱。"}else{const {error}=await client.auth.verifyOtp({email,token:$("authOtp").value.trim(),type:"email"});if(error)throw error;$("authDialog").close();otpSent=false;$("authForm").reset();$("otpBox").hidden=true;await switchView("mine")}}catch(err){status.textContent=err.message;status.className="status error"}};
$("addButton").onclick=()=>{addingPublic=!session;$("subscriptionTitle").textContent=addingPublic?"添加公共订阅":"添加到我的订阅";$("subscriptionHint").textContent=addingPublic?"管理员公共订阅":"试运行账户最多添加 3 个网站。";$("subscriptionDialog").showModal()};$("publicAddButton").onclick=()=>{addingPublic=true;$("subscriptionTitle").textContent="添加公共订阅";$("subscriptionHint").textContent="所有访客都能看到这个来源的文章。";$("subscriptionDialog").showModal()};
$("subscriptionForm").onsubmit=async e=>{e.preventDefault();const status=$("formStatus"),sub={name:$("feedName").value,url:$("feedUrl").value,country:$("feedCountry").value,mode:$("feedMode").value,language:$("feedLanguage").value,enabled:true};status.textContent="正在检查网站…";try{if(!addingPublic&&session){await api({action:"save_my_subscription",subscription:sub},{auth:true});await loadPersonal()}else{await api({action:"save_subscription",subscription:sub},{admin:true});await loadPublic()}$("subscriptionForm").reset();$("subscriptionDialog").close()}catch(err){status.textContent=err.message;status.className="status error"}};
async function removePersonal(id){if(!confirm("删除这个订阅？已经保存的历史文章仍会保留。"))return;personal=await api({action:"delete_my_subscription",id},{auth:true});renderPersonal();renderArticles()}
$("runPersonal").onclick=async()=>{if(!confirm("现在检查你的全部订阅网站？试运行账户每天可以更新一次。"))return;$("personalStatus").textContent="正在抓取和翻译，请稍候…";try{const result=await api({action:"run_my_digest"},{auth:true});personal=result.data;renderPersonal();renderArticles();$("personalStatus").textContent=`更新完成：新增 ${result.processed} 篇。${result.errors.length?` ${result.errors.length} 个来源未成功。`:""}`;$("personalStatus").className="status success"}catch(e){$("personalStatus").textContent=e.message;$("personalStatus").className="status error"}};
function openArticle(id,mine){const item=(mine?personal.articles:publicData.articles).find(x=>String(x.id)===String(id));if(!item)return;$("detailTitle").textContent=item.title;$("detailMeta").textContent=`${item.source||"订阅"} · ${date(item.published||item.published_at||item.processed_at)}`;$("detailTranslation").textContent=item.result||Object.values(item.translations||{})[0]||"";$("detailOriginal").href=item.url||item.canonical_url||"#";$("articleDialog").showModal()}
$("adminButton").onclick=async()=>{const value=prompt("请输入管理员密码：",adminPassword);if(value===null)return;adminPassword=value;sessionStorage.setItem("byelinguaAdmin",value);try{await api({action:"get_config"},{admin:true});$("adminPanel").classList.add("open");$("addButton").hidden=false;$("wechatButton").hidden=false;$("adminStatus").textContent="管理员已登录。"}catch(e){$("adminStatus").textContent=e.message;$("adminStatus").className="status error"}};
$("wechatButton").onclick=()=>$("wechatDialog").showModal();$("wechatForm").onsubmit=async e=>{e.preventDefault();$("wechatStatus").textContent="正在读取和翻译…";try{const result=await api({action:"import_wechat",article:{url:$("wechatUrl").value,language:$("wechatLanguage").value,author:$("wechatAuthor").value,title:$("wechatTitle").value,text:$("wechatText").value}},{admin:true});$("wechatStatus").textContent=result.reused?"已有该语言译文，已直接复用。":"翻译已保存到中国栏目。";$("wechatStatus").className="status success";await loadPublic()}catch(err){$("wechatStatus").textContent=err.message;$("wechatStatus").className="status error"}};
$("inviteButton").onclick=async()=>{try{const data=await api({action:"invite_user",email:$("inviteEmail").value},{admin:true});$("adminStatus").textContent=data.existing?"该邮箱已经受邀。":"邀请账户已创建，对方现在可以获取验证码登录。";$("adminStatus").className="status success";$("inviteEmail").value=""}catch(e){$("adminStatus").textContent=e.message;$("adminStatus").className="status error"}};
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>$(b.dataset.close).close());loadPublic();initAuth();
</script></body></html>

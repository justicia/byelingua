<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Byelingua 乐评订阅</title>
  <style>
    * { box-sizing: border-box; }
    :root { --blue:#2563eb; --ink:#172033; --muted:#64748b; --line:#dbe3ef; --bg:#f4f7fb; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:Arial,"Microsoft YaHei",sans-serif; }
    button,input,select { font:inherit; }
    button { cursor:pointer; }
    .shell { min-height:100vh; display:grid; grid-template-columns:270px 1fr; }
    aside { background:#101827; color:white; padding:28px 20px; }
    .brand { font-size:24px; font-weight:800; margin-bottom:6px; }
    .tagline { color:#aebbd0; font-size:13px; margin-bottom:28px; }
    .country { width:100%; border:0; border-radius:9px; padding:11px 12px; margin:4px 0; color:#dce6f7; background:transparent; text-align:left; }
    .country.active,.country:hover { background:#23324a; color:white; }
    main { padding:34px; max-width:1180px; width:100%; margin:auto; }
    header { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:24px; }
    h1 { margin:0 0 8px; font-size:30px; }
    h2 { margin:0; font-size:20px; }
    p { color:var(--muted); }
    .actions { display:flex; gap:10px; flex-wrap:wrap; }
    .button { border:0; padding:11px 16px; border-radius:9px; background:var(--blue); color:white; }
    .button.secondary { background:white; color:var(--ink); border:1px solid var(--line); }
    .button.danger { background:#fff1f2; color:#be123c; border:1px solid #fecdd3; }
    .card { background:white; border:1px solid #e6ebf3; border-radius:15px; padding:22px; box-shadow:0 8px 24px rgba(15,23,42,.04); margin-bottom:20px; }
    .settings { display:grid; grid-template-columns:1fr auto; gap:14px; align-items:end; }
    label { display:block; font-weight:700; margin-bottom:7px; }
    input,select { width:100%; padding:11px 12px; border:1px solid #cbd5e1; border-radius:9px; background:white; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
    .feed-list { display:grid; gap:12px; margin-top:16px; }
    .feed { border:1px solid var(--line); border-radius:12px; padding:15px; display:flex; justify-content:space-between; gap:16px; align-items:center; }
    .feed-title { font-weight:800; margin-bottom:5px; }
    .meta { color:var(--muted); font-size:13px; overflow-wrap:anywhere; }
    .feed-actions { display:flex; gap:7px; }
    .small { padding:7px 10px; font-size:13px; }
    .empty { padding:32px; text-align:center; color:var(--muted); border:1px dashed #cbd5e1; border-radius:12px; }
    .status { min-height:22px; margin-top:12px; color:var(--muted); }
    .status.error { color:#dc2626; }
    .status.success { color:#15803d; }
    dialog { border:0; border-radius:16px; width:min(620px,calc(100% - 28px)); padding:0; box-shadow:0 24px 80px rgba(15,23,42,.25); }
    dialog::backdrop { background:rgba(15,23,42,.55); }
    .modal { padding:25px; }
    .modal-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
    .close { border:0; background:transparent; font-size:25px; color:var(--muted); }
    .modal-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:20px; }
    .manual { margin-top:22px; }
    textarea { width:100%; min-height:210px; padding:12px; border:1px solid var(--line); border-radius:9px; resize:vertical; }
    @media(max-width:780px){ .shell{grid-template-columns:1fr} aside{padding:18px} nav{display:flex;overflow:auto;gap:5px}.country{width:auto;white-space:nowrap} main{padding:20px 14px}.grid{grid-template-columns:1fr}.settings{grid-template-columns:1fr}header{display:block}.actions{margin-top:16px}.feed{align-items:flex-start;flex-direction:column} }
  </style>
</head>
<body>
  <div class="shell">
    <aside>
      <div class="brand">Byelingua</div>
      <div class="tagline">每日国际乐评翻译与摘要</div>
      <nav>
        <button class="country active" data-country="all">全部地区</button>
        <button class="country" data-country="de">🇩🇪 德国</button>
        <button class="country" data-country="fr">🇫🇷 法国</button>
        <button class="country" data-country="es">🇪🇸 西班牙</button>
        <button class="country" data-country="other">🌍 其他地区</button>
      </nav>
    </aside>

    <main>
      <header>
        <div><h1>我的乐评订阅</h1><p>添加 RSS 或网站，每日自动生成翻译摘要并发送邮件。</p></div>
        <div class="actions">
          <button class="button secondary" id="loginButton">输入管理密码</button>
          <button class="button" id="addButton">＋ 添加订阅</button>
        </div>
      </header>

      <section class="card settings">
        <div>
          <label for="globalLanguage">每日简报默认语言</label>
          <select id="globalLanguage">
            <option value="en">English</option><option value="zh">简体中文</option>
            <option value="es">Español</option><option value="fr">Français</option><option value="de">Deutsch</option>
          </select>
        </div>
        <button class="button secondary" id="saveSettings">保存语言</button>
      </section>

      <section class="card">
        <div class="actions" style="justify-content:space-between;align-items:center">
          <h2 id="sectionTitle">全部地区</h2>
          <button class="button secondary" id="runButton">立即生成并发送</button>
        </div>
        <div id="feedList" class="feed-list"><div class="empty">输入管理密码后加载订阅。</div></div>
        <div id="status" class="status"></div>
      </section>

      <section class="card manual">
        <h2>单篇文章测试</h2>
        <div class="grid" style="margin-top:16px">
          <div style="grid-column:1/-1"><label for="articleUrl">文章网址</label><input id="articleUrl" type="url" placeholder="https://example.com/article"></div>
          <div><label for="articleMode">处理方式</label><select id="articleMode"><option value="summary">生成摘要</option><option value="translate">全文翻译</option></select></div>
          <div><label for="articleLanguage">输出语言</label><select id="articleLanguage"><option value="en">English</option><option value="zh" selected>简体中文</option><option value="es">Español</option><option value="fr">Français</option><option value="de">Deutsch</option></select></div>
        </div>
        <button class="button" id="articleButton" style="margin-top:14px">开始处理</button>
        <div id="articleStatus" class="status"></div>
        <textarea id="articleResult" readonly placeholder="结果将显示在这里"></textarea>
      </section>
    </main>
  </div>

  <dialog id="subscriptionDialog">
    <form class="modal" id="subscriptionForm" method="dialog">
      <div class="modal-head"><h2>添加订阅</h2><button class="close" value="cancel" aria-label="关闭">×</button></div>
      <div class="grid">
        <div><label for="feedName">名称</label><input id="feedName" required placeholder="例如：Die Zeit Musik"></div>
        <div><label for="feedCountry">地区</label><select id="feedCountry"><option value="de">德国</option><option value="fr">法国</option><option value="es">西班牙</option><option value="other">其他</option></select></div>
        <div style="grid-column:1/-1"><label for="feedUrl">RSS 或网站地址</label><input id="feedUrl" type="url" required placeholder="https://example.com/feed.xml"></div>
        <div><label for="feedMode">处理方式</label><select id="feedMode"><option value="summary">生成摘要</option><option value="translate">全文翻译</option></select></div>
        <div><label for="feedLanguage">输出语言</label><select id="feedLanguage"><option value="">使用默认语言</option><option value="en">English</option><option value="zh">简体中文</option><option value="es">Español</option><option value="fr">Français</option><option value="de">Deutsch</option></select></div>
      </div>
      <div id="formStatus" class="status"></div>
      <div class="modal-actions"><button class="button secondary" value="cancel">取消</button><button class="button" id="saveFeed" value="default">保存订阅</button></div>
    </form>
  </dialog>

  <script>
    const names={all:"全部地区",de:"德国",fr:"法国",es:"西班牙",other:"其他地区"};
    const langNames={en:"English",zh:"简体中文",es:"Español",fr:"Français",de:"Deutsch"};
    let password=sessionStorage.getItem("byelinguaAdmin")||"", config={target_language:"zh",subscriptions:[]}, activeCountry="all";
    const $=id=>document.getElementById(id);
    function setStatus(message,type=""){ $("status").textContent=message; $("status").className="status "+type; }
    async function api(payload,admin=true){
      const response=await fetch("/api",{method:"POST",headers:{"Content-Type":"application/json",...(admin?{"X-Admin-Password":password}:{})},body:JSON.stringify(payload)});
      const data=await response.json(); if(!response.ok) throw new Error(data.error||"请求失败"); return data;
    }
    function askPassword(){ const value=prompt("请输入 Vercel 中设置的 ADMIN_PASSWORD：",password); if(value!==null){password=value;sessionStorage.setItem("byelinguaAdmin",password);loadConfig();} }
    function render(){
      $("globalLanguage").value=config.target_language||"zh"; $("sectionTitle").textContent=names[activeCountry];
      const items=config.subscriptions.filter(item=>activeCountry==="all"||item.country===activeCountry);
      $("feedList").innerHTML=items.length?items.map(item=>`<div class="feed"><div><div class="feed-title">${escapeHtml(item.name)}</div><div class="meta">${names[item.country]} · ${item.mode==="summary"?"摘要":"翻译"} · ${item.language?langNames[item.language]:"默认语言"}</div><div class="meta">${escapeHtml(item.feed_url)}</div></div><div class="feed-actions"><button class="button danger small" data-delete="${item.id}">删除</button></div></div>`).join(""):'<div class="empty">这个地区还没有订阅。</div>';
      document.querySelectorAll("[data-delete]").forEach(button=>button.onclick=()=>removeFeed(button.dataset.delete));
    }
    function escapeHtml(value){const div=document.createElement("div");div.textContent=value||"";return div.innerHTML;}
    async function loadConfig(){ if(!password){setStatus("请先输入管理密码。");return;} try{config=await api({action:"get_config"});render();setStatus("订阅已加载。","success");}catch(error){setStatus(error.message,"error");} }
    async function removeFeed(id){if(!confirm("确定删除这个订阅吗？"))return;try{config=await api({action:"delete_subscription",id});render();setStatus("订阅已删除。","success");}catch(error){setStatus(error.message,"error");}}
    document.querySelectorAll(".country").forEach(button=>button.onclick=()=>{document.querySelectorAll(".country").forEach(x=>x.classList.remove("active"));button.classList.add("active");activeCountry=button.dataset.country;render();});
    $("loginButton").onclick=askPassword; $("addButton").onclick=()=>{if(!password)return askPassword();$("subscriptionDialog").showModal();};
    $("saveSettings").onclick=async()=>{try{config=await api({action:"save_settings",target_language:$("globalLanguage").value});render();setStatus("默认语言已保存。","success");}catch(error){setStatus(error.message,"error");}};
    $("subscriptionForm").onsubmit=async event=>{event.preventDefault();$("formStatus").textContent="正在检查 RSS…";try{config=await api({action:"save_subscription",subscription:{name:$("feedName").value,url:$("feedUrl").value,country:$("feedCountry").value,mode:$("feedMode").value,language:$("feedLanguage").value,enabled:true}});$("subscriptionForm").reset();$("subscriptionDialog").close();render();setStatus("订阅已保存。","success");}catch(error){$("formStatus").textContent=error.message;$("formStatus").className="status error";}};
    $("runButton").onclick=async()=>{if(!confirm("现在抓取新文章并发送邮件吗？"))return;setStatus("正在生成每日简报，请稍候…");try{const data=await api({action:"run_digest"});setStatus(`完成：邮件包含 ${data.items} 篇，成功处理 ${data.processed} 篇。`,"success");}catch(error){setStatus(error.message,"error");}};
    $("articleButton").onclick=async()=>{const box=$("articleStatus");box.textContent="正在处理…";$("articleResult").value="";try{const data=await api({action:"process_article",url:$("articleUrl").value,mode:$("articleMode").value,target_language:$("articleLanguage").value},false);$("articleResult").value=data.result;box.textContent=`完成，共读取 ${data.characters} 个字符。`;box.className="status success";}catch(error){box.textContent=error.message;box.className="status error";}};
    if(password)loadConfig();
  </script>
</body>
</html>

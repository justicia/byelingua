</style></head><body><div class="layout"><aside class="side"><div class="brand">Byelingua</div><div class="tagline">SO MANY COUNTRIES. SO MANY LANGUAGES. I SIMPLY CAN’T.</div><nav id="countryNav" class="country-nav"></nav><div class="account-card"><div id="accountLabel">登录后建立自己的订阅</div><button id="accountButton" class="btn accent">邮箱验证码登录</button><button id="adminButton" class="btn secondary">管理员入口</button></div></aside><main>

<dialog id="wechatDialog"><form id="wechatForm" class="modal"><div class="modal-head"><div><h2>导入微信公众号文章</h2><div class="hint">自动读取失败时，请在下面粘贴标题、公众号和全文。</div></div><button class="close" type="button" data-close="wechatDialog">×</button></div><div class="grid"><div class="wide"><label for="wechatUrl">微信文章链接</label><input id="wechatUrl" type="url" required placeholder="https://mp.weixin.qq.com/s/..."></div><div><label for="wechatLanguage">译文语言</label><select id="wechatLanguage"><option value="en">English</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="es">Español</option><option value="it">Italiano</option><option value="pt">Português</option><option value="ja">日本語</option><option value="zh">简体中文</option></select></div><div><label for="wechatAuthor">公众号（备用）</label><input id="wechatAuthor"></div><div class="wide"><label for="wechatTitle">标题（备用）</label><input id="wechatTitle"></div><div class="wide"><label for="wechatText">原文全文（备用）</label><textarea id="wechatText" style="min-height:170px"></textarea></div></div><div id="wechatStatus" class="status"></div><div class="modal-actions"><button class="btn secondary" type="button" data-close="wechatDialog">取消</button><button class="btn" type="submit">翻译并保存</button></div></form></dialog>

};
const originalText=new WeakMap(),originalAttrs=new WeakMap();
function translatedText(value){if(uiLanguage==="zh")return value;const trimmed=value.trim();if(uiTranslations[trimmed])return value.replace(trimmed,uiTranslations[trimmed]);let match=trimmed.match(/^(\d+)\/(\d+) 个网站$/);if(match)return `${match[1]}/${match[2]} websites`;match=trimmed.match(/^(\d+) 篇 · (.+)$/);if(match)return `${match[1]} articles · ${match[2]}`;return value}
function translateTree(root=document.body){const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);nodes.forEach(node=>{if(node.parentElement?.closest("script,style"))return;if(!originalText.has(node))originalText.set(node,node.nodeValue);node.nodeValue=translatedText(originalText.get(node))});root.querySelectorAll?.("[placeholder]").forEach(el=>{if(!originalAttrs.has(el))originalAttrs.set(el,el.placeholder);const value=originalAttrs.get(el);el.placeholder=uiLanguage==="en"?(uiTranslations[value]||value):value})}
function applyLanguage(){document.documentElement.lang=uiLanguage==="en"?"en":"zh-CN";localStorage.setItem("byelinguaUiLanguage",uiLanguage);translateTree();document.querySelectorAll("[data-ui-language]").forEach(button=>button.classList.toggle("active",button.dataset.uiLanguage===uiLanguage));renderNav();renderArticles();if(session)renderPersonal();updateAccount()}
const languageSwitch=document.createElement("div");languageSwitch.className="language-switch";languageSwitch.innerHTML='<button type="button" data-ui-language="zh">中文</button><button type="button" data-ui-language="en">English</button>';document.querySelector(".tagline").after(languageSwitch);const languageStyle=document.createElement("style");languageStyle.textContent='.language-switch{display:flex;gap:4px;margin:0 0 22px}.language-switch button{border:1px solid #ffffff35;background:transparent;color:#dce8e1;border-radius:99px;padding:5px 10px;font-size:12px;cursor:pointer}.language-switch button.active{background:#fff;color:#214d3a}';document.head.append(languageStyle);languageSwitch.querySelectorAll("button").forEach(button=>button.onclick=()=>{uiLanguage=button.dataset.uiLanguage;applyLanguage()});
let publicData={articles:[]},personal={profile:{},subscriptions:[],articles:[]},active="all",client=null,session=null,adminPassword=sessionStorage.getItem("byelinguaAdmin")||"",otpSent=false,addingPublic=false;
const $=id=>document.getElementById(id),esc=v=>{const d=document.createElement("div");d.textContent=v||"";return d.innerHTML},date=v=>v?new Intl.DateTimeFormat(uiLanguage==="en"?"en-GB":"zh-CN",{year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date(v)):translatedText("日期未知"),excerpt=(v,n=320)=>(v||"").replace(/\s+/g," ").slice(0,n)+((v||"").length>n?"…":"");
async function api(payload,{admin=false,auth=false}={}){const headers={"Content-Type":"application/json"};if(admin)headers["X-Admin-Password"]=adminPassword;if(auth&&session)headers.Authorization=`Bearer ${session.access_token}`;const r=await fetch("/api",{method:"POST",headers,body:JSON.stringify(payload)}),text=await r.text();let data;try{data=JSON.parse(text)}catch{throw new Error("服务器返回无法读取的内容")};if(!r.ok)throw new Error(data.error||"请求失败");return data}
function renderNav(){const list=Object.keys(countries);$("countryNav").innerHTML=`<button class="country mine ${active==="mine"?"active":""}" data-view="mine">★ 我的订阅</button><button class="country ${active==="all"?"active":""}" data-view="all">🌐 全部国家</button>`+list.map(code=>`<button class="country ${active===code?"active":""}" data-view="${code}">${esc(countries[code])}</button>`).join("");document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>switchView(b.dataset.view))}
function card(item,personalItem=false){const url=item.url||item.canonical_url||"#",code=personalItem?(personal.profile?.preferred_language||item.language||"zh"):uiLanguage,title=item.titles?.[code]||item.translated_titles?.[code]||item.title,content=item.contents?.[code]||item.translations?.[code]||item.result,adminActions=!personalItem&&adminPassword?`<button class="btn secondary small" data-retranslate="${esc(item.id)}">重新翻译</button><button class="btn danger small" data-delete-resync="${esc(item.id)}">删除并允许重同步</button>`:"";return `<article class="article"><div class="meta"><span>${esc(item.source||countries[item.country]||"订阅")}</span><time>${esc(date(item.published||item.published_at||item.processed_at))}</time></div><h3><a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(title)}</a></h3><p>${esc(excerpt(content))}</p><div class="actions"><button class="read" data-article="${esc(item.id)}" data-personal="${personalItem?1:0}">阅读全文 →</button>${adminActions}</div></article>`}
function renderArticles(){const mine=active==="mine",items=mine?personal.articles:publicData.articles.filter(x=>active==="all"||x.country===active);$("personalPanel").hidden=!mine;$("sectionTitle").textContent=mine?"我的订阅":active==="all"?"全部国家":countries[active];$("viewHint").textContent=mine?"你的订阅网站与历史文章":"公共订阅文章";$("articles").innerHTML=items.length?items.map(x=>card(x,mine)).join(""):`<div class="empty">${mine?(session?"尚未生成个人订阅文章。":"请先登录受邀账户。"):"这个分类暂时没有文章。"}</div>`;document.querySelectorAll("[data-article]").forEach(b=>b.onclick=()=>openArticle(b.dataset.article,b.dataset.personal==="1"));document.querySelectorAll("[data-retranslate]").forEach(b=>b.onclick=()=>retranslatePublicArticle(b.dataset.retranslate));document.querySelectorAll("[data-delete-resync]").forEach(b=>b.onclick=()=>deleteAndResyncPublicArticle(b.dataset.deleteResync))}
function renderPersonal(){const p=personal.profile||{},subs=personal.subscriptions||[];$("quota").textContent=`${subs.length}/${p.max_subscriptions||3} 个网站`;$("preferredLanguage").value=p.preferred_language||"zh";$("subscriptions").innerHTML=subs.length?subs.map(x=>`<div class="subscription"><div><strong>${esc(x.name)}</strong><div class="hint">${esc(countries[x.country]||"其他地区")} · ${esc(x.url)}</div></div><button class="btn danger small" data-remove="${esc(x.id)}">删除</button></div>`).join(""):'<div class="hint">还没有个人订阅，点击“添加网站”开始。</div>';document.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>removePersonal(b.dataset.remove))}
async function switchView(view){active=view;if(view==="mine"&&!session){$("authDialog").showModal()}else if(view==="mine"){await loadPersonal()}renderNav();renderArticles()}
async function loadPublic(){
    try{
        const response = await fetch("/api", {cache:"no-store"});
        if(!response.ok){
            throw new Error(`API request failed: ${response.status}`);
        }

        publicData = await response.json();

        $("updated").textContent =
            `${publicData.articles?.length || 0} 篇 · ${
                publicData.updated_at
                    ? date(publicData.updated_at)
                    : "等待更新"
            }`;

        renderNav();
        renderArticles();
    }catch(error){
        console.error(error);
        $("updated").textContent = "文章加载失败";
        $("articles").innerHTML =
            `<div class="empty">无法加载公共文章：${esc(error.message)}</div>`;
    }
}
async function initAuth(){try{const cfg=await api({action:"get_auth_config"});client=supabase.createClient(cfg.url,cfg.publishable_key);const result=await client.auth.getSession();session=result.data.session;client.auth.onAuthStateChange((_event,next)=>{session=next;updateAccount();if(session&&active==="mine")loadPersonal()});updateAccount()}catch(e){console.warn(e.message)}}
function updateAccount(){const email=session?.user?.email;$("accountLabel").textContent=email||"登录后建立自己的订阅";$("accountButton").textContent=email?"退出登录":"邮箱验证码登录";$("mobileAccount").textContent=email?"我的账户":"登录";$("addButton").hidden=!session&&!adminPassword}
async function loadPersonal(){if(!session)return;try{personal=await api({action:"get_my_data"},{auth:true});renderPersonal();renderArticles()}catch(e){$("articles").innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
$("accountButton").onclick=async()=>{if(session){await client.auth.signOut();personal={profile:{},subscriptions:[],articles:[]};active="all";renderNav();renderArticles()}else $("authDialog").showModal()};$("mobileAccount").onclick=()=>session?switchView("mine"):$("authDialog").showModal();
$("authForm").onsubmit=async e=>{e.preventDefault();const email=$("authEmail").value.trim(),status=$("authStatus");try{if(!otpSent){const {error}=await client.auth.signInWithOtp({email,options:{shouldCreateUser:false}});if(error)throw error;otpSent=true;$("otpBox").hidden=false;$("authSubmit").textContent="验证并登录";status.textContent="验证码已发送，请检查邮箱。"}else{const {error}=await client.auth.verifyOtp({email,token:$("authOtp").value.trim(),type:"email"});if(error)throw error;$("authDialog").close();otpSent=false;$("authForm").reset();$("otpBox").hidden=true;await switchView("mine")}}catch(err){status.textContent=err.message;status.className="status error"}};
$("addButton").onclick=()=>{addingPublic=!session;if(session)$("feedLanguage").value=personal.profile?.preferred_language||"zh";$("subscriptionTitle").textContent=addingPublic?"添加公共订阅":"添加到我的订阅";$("subscriptionHint").textContent=addingPublic?"管理员公共订阅":"试运行账户最多添加 3 个网站。";$("subscriptionDialog").showModal()};$("publicAddButton").onclick=()=>{addingPublic=true;$("subscriptionTitle").textContent="添加公共订阅";$("subscriptionHint").textContent="所有访客都能看到这个来源的文章。";$("subscriptionDialog").showModal()};
$("subscriptionForm").onsubmit=async e=>{e.preventDefault();const status=$("formStatus"),sub={name:$("feedName").value,url:$("feedUrl").value,country:$("feedCountry").value,mode:$("feedMode").value,language:$("feedLanguage").value,enabled:true};status.textContent="正在检查网站…";try{if(!addingPublic&&session){await api({action:"save_my_subscription",subscription:sub},{auth:true});await loadPersonal()}else{await api({action:"save_subscription",subscription:sub},{admin:true});await loadPublic()}$("subscriptionForm").reset();$("subscriptionDialog").close()}catch(err){status.textContent=err.message;status.className="status error"}};
async function removePersonal(id){if(!confirm("删除这个订阅？已经保存的历史文章仍会保留。"))return;personal=await api({action:"delete_my_subscription",id},{auth:true});renderPersonal();renderArticles()}
$("runPersonal").onclick=async()=>{if(!confirm("现在检查你的全部订阅网站？试运行账户每天可以更新一次。"))return;$("personalStatus").textContent="正在抓取和翻译，请稍候…";try{const result=await api({action:"run_my_digest"},{auth:true});personal=result.data;renderPersonal();renderArticles();$("personalStatus").textContent=`更新完成：新增 ${result.processed} 篇。${result.errors.length?` ${result.errors.length} 个来源未成功。`:""}`;$("personalStatus").className="status success"}catch(e){$("personalStatus").textContent=e.message;$("personalStatus").className="status error"}};
function openArticle(id,mine){const item=(mine?personal.articles:publicData.articles).find(x=>String(x.id)===String(id));if(!item)return;const code=mine?(personal.profile?.preferred_language||item.language||"zh"):uiLanguage,title=item.titles?.[code]||item.translated_titles?.[code]||item.title,content=item.contents?.[code]||item.translations?.[code]||item.result||Object.values(item.translations||{})[0]||"",key=`byelinguaArticle:${Date.now()}:${Math.random().toString(36).slice(2)}`;localStorage.setItem(key,JSON.stringify({title,content,source:item.source||"订阅",date:date(item.published||item.published_at||item.processed_at),url:item.url||item.canonical_url||"#",language:code}));window.open(`article.html?key=${encodeURIComponent(key)}`,"_blank","noopener")}
async function retranslatePublicArticle(id){if(!confirm("确定重新抓取并覆盖这篇文章的中英文标题和正文吗？这会使用一次 OpenAI API。"))return;$('adminStatus').textContent="正在重新抓取和翻译文章…";try{await api({action:"retranslate_article",id},{admin:true});$('adminStatus').textContent="文章已重新翻译。";$('adminStatus').className="status success";await loadPublic()}catch(e){$('adminStatus').textContent=e.message;$('adminStatus').className="status error"}}
async function deleteAndResyncPublicArticle(id){if(!confirm("确定删除这篇文章吗？系统会同时清除去重记录，使它可以再次同步。"))return;$('adminStatus').textContent="正在删除文章…";try{await api({action:"delete_article",id,allow_resync:true},{admin:true});$('adminStatus').textContent="文章已删除，并且允许以后重新同步。";$('adminStatus').className="status success";await loadPublic()}catch(e){$('adminStatus').textContent=e.message;$('adminStatus').className="status error"}}
$("adminButton").onclick=async()=>{const value=prompt("请输入管理员密码：",adminPassword);if(value===null)return;adminPassword=value;sessionStorage.setItem("byelinguaAdmin",value);try{await api({action:"get_config"},{admin:true});$("adminPanel").classList.add("open");$("addButton").hidden=false;$("wechatButton").hidden=false;$("adminStatus").textContent="管理员已登录。";renderArticles()}catch(e){$("adminStatus").textContent=e.message;$("adminStatus").className="status error"}};
$("wechatButton").onclick=()=>$("wechatDialog").showModal();$("wechatForm").onsubmit=async e=>{e.preventDefault();$("wechatStatus").textContent="正在读取和翻译…";try{const result=await api({action:"import_wechat",article:{url:$("wechatUrl").value,language:$("wechatLanguage").value,author:$("wechatAuthor").value,title:$("wechatTitle").value,text:$("wechatText").value}},{admin:true});$("wechatStatus").textContent=result.reused?"已有该语言译文，已直接复用。":"翻译已保存到中国栏目。";$("wechatStatus").className="status success";await loadPublic()}catch(err){$("wechatStatus").textContent=err.message;$("wechatStatus").className="status error"}};
$("inviteButton").onclick=async()=>{try{const data=await api({action:"invite_user",email:$("inviteEmail").value},{admin:true});$("adminStatus").textContent=data.existing?"该邮箱已经受邀。":"邀请账户已创建，对方现在可以获取验证码登录。";$("adminStatus").className="status success";$("inviteEmail").value=""}catch(e){$("adminStatus").textContent=e.message;$("adminStatus").className="status error"}};
$("runPublicButton").onclick=async()=>{$("adminStatus").textContent="正在处理一篇公共文章…";try{const data=await api({action:"run_digest"},{admin:true});$("adminStatus").textContent=data.processed?"已保存 1 篇文章；再次点击可继续处理下一来源。":data.errors.length?`本批次未新增：${data.errors[0]}`:"目前没有发现新文章。";$("adminStatus").className=data.processed?"status success":"status";await loadPublic()}catch(e){$("adminStatus").textContent=e.message;$("adminStatus").className="status error"}};
$("backfillButton").onclick=async()=>{$("adminStatus").textContent="正在补全一篇旧文章的中英文标题和正文…";try{const data=await api({action:"backfill_bilingual"},{admin:true});$("adminStatus").textContent=data.processed?`补全成功，还剩 ${data.remaining} 篇。`:"所有旧文章都已具备中英文内容。";$("adminStatus").className="status success";await loadPublic()}catch(e){$("adminStatus").textContent=e.message;$("adminStatus").className="status error"}};
$("preferredLanguage").onchange=async()=>{try{personal=await api({action:"save_my_language",language:$("preferredLanguage").value},{auth:true});$("feedLanguage").value=personal.profile.preferred_language;renderPersonal();renderArticles();$("personalStatus").textContent="内容语言已永久保存。";$("personalStatus").className="status success"}catch(e){$("personalStatus").textContent=e.message;$("personalStatus").className="status error"}};
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>$(b.dataset.close).close());const languageObserver=new MutationObserver(records=>records.forEach(record=>record.addedNodes.forEach(node=>{if(node.nodeType===Node.ELEMENT_NODE)translateTree(node);else if(node.nodeType===Node.TEXT_NODE&&node.parentElement&&!node.parentElement.closest("script,style")){if(!originalText.has(node))originalText.set(node,node.nodeValue);node.nodeValue=translatedText(originalText.get(node))}})));languageObserver.observe(document.body,{childList:true,subtree:true});applyLanguage();loadPublic();initAuth();
</script></body></html>

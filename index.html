<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="按国家阅读世界媒体与微信公众号多语言译文"><title>Byelingua · 跨语言阅读</title>
<style>
*{box-sizing:border-box}:root{--ink:#17201b;--muted:#69736d;--paper:#f4f2eb;--card:#fffef9;--forest:#214d3a;--lime:#dce86f;--line:#d9d8cf;--danger:#a73535;--china:#c7473f}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;line-height:1.7}button,input,select,textarea{font:inherit}button{cursor:pointer}.layout{min-height:100vh;display:grid;grid-template-columns:260px 1fr}.side{background:var(--forest);color:#fff;padding:34px 24px;position:sticky;top:0;height:100vh}.brand{font:800 30px Georgia,serif}.tagline{color:#c9d8cf;font-size:12px;margin:3px 0 30px;letter-spacing:.08em}.country-nav{display:grid;gap:6px}.country{border:0;border-radius:10px;padding:11px 13px;background:transparent;color:#dce8e1;text-align:left}.country:hover,.country.active{background:#fff;color:var(--forest)}main{width:min(1040px,100%);margin:auto;padding:45px 34px 70px}.hero{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:30px}.eyebrow{color:var(--forest);font-weight:750;letter-spacing:.12em;text-transform:uppercase;font-size:12px}.hero h1{font:clamp(2.4rem,6vw,4.8rem)/1 Georgia,"Noto Serif SC",serif;margin:9px 0 15px;letter-spacing:-.04em}.hero p{color:var(--muted);max-width:630px;margin:0}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:11px 15px;background:var(--forest);color:#fff;font-weight:700}.btn.accent{background:var(--lime);color:var(--ink)}.btn.secondary{background:var(--card);color:var(--ink);border:1px solid var(--line)}.btn.danger{background:#fff0ef;color:var(--danger);border:1px solid #efc9c6}.btn.small{padding:7px 10px;font-size:13px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:27px 0 18px}.toolbar h2{font:27px Georgia,"Noto Serif SC",serif;margin:0}.updated,.hint{color:var(--muted);font-size:12px}.articles{display:grid;gap:16px}.article{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:25px 27px}.article.wechat{border-left:5px solid var(--china)}.meta{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}.article h3{font:clamp(1.25rem,3vw,1.65rem)/1.35 Georgia,"Noto Serif SC",serif;margin:10px 0}.article h3 a{color:inherit;text-decoration:none}.article p{margin:0 0 14px}.read{color:var(--forest);font-weight:700;text-decoration:none;border:0;background:transparent;padding:0}.empty{padding:65px 25px;text-align:center;color:var(--muted);border:1px dashed #bfc4bd;border-radius:16px}.admin{display:none;background:#e9ece4;border:1px solid #d3d8ce;border-radius:16px;padding:20px;margin:26px 0}.admin.open{display:block}.admin-head,.feed{display:flex;justify-content:space-between;gap:14px;align-items:center}.settings{display:grid;grid-template-columns:1fr auto;align-items:end;gap:12px;margin-top:16px}label{display:block;font-weight:700;margin-bottom:6px}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #c8cdc5;border-radius:9px;background:#fff}.feeds{display:grid;gap:9px;margin-top:16px}.feed{background:#fff;padding:13px;border-radius:10px}.feed-name{font-weight:800}.feed-info{font-size:12px;color:var(--muted);overflow-wrap:anywhere}.status{min-height:22px;color:var(--muted);margin-top:10px}.status.error{color:var(--danger)}.status.success{color:#287040}dialog{border:0;border-radius:18px;width:min(680px,calc(100% - 28px));padding:0;box-shadow:0 24px 80px #10201844}dialog::backdrop{background:#10201899}.modal{padding:26px}.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:18px}.modal h2{margin:0}.close{border:0;background:transparent;font-size:25px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.wide{grid-column:1/-1}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}textarea{min-height:170px;resize:vertical}.translation{white-space:pre-wrap;line-height:1.9;max-height:60vh;overflow:auto;padding:18px 0}.detail-tools{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.detail-tools>div{flex:1;min-width:170px}
@media(max-width:760px){.layout{grid-template-columns:1fr}.side{height:auto;position:static;padding:20px}.tagline{margin-bottom:15px}.country-nav{display:flex;overflow:auto}.country{white-space:nowrap}.hero{display:block}.hero .actions{margin-top:20px}main{padding:30px 15px 50px}.grid,.settings{grid-template-columns:1fr}.wide{grid-column:auto}.article{padding:21px}.feed{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="layout"><aside class="side"><div class="brand">Byelingua</div><div class="tagline">WORLD MEDIA, IN YOUR LANGUAGE</div><nav id="countryNav" class="country-nav"></nav></aside><main>
<header class="hero"><div><div class="eyebrow">Global reading desk</div><h1>跨越语言，<br>阅读世界。</h1><p>中国栏目收录微信公众号多语言全文翻译；其他国家继续自动订阅公开网站与 RSS。</p></div><div class="actions"><button id="loginButton" class="btn secondary">管理内容</button><button id="wechatButton" class="btn accent" hidden>＋ 微信文章</button><button id="addButton" class="btn accent" hidden>＋ 添加网站</button></div></header>
<section id="adminPanel" class="admin"><div class="admin-head"><div><strong>订阅与语言</strong><div class="updated">微信文章手动更新；公开网站与 RSS 自动更新。</div></div><button id="runButton" class="btn secondary small">立即更新订阅</button></div><div class="settings"><div><label for="globalLanguage">订阅内容默认输出语言</label><select id="globalLanguage"><option value="zh">简体中文</option><option value="en">English</option><option value="es">Español</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="it">Italiano</option><option value="pt">Português</option><option value="ja">日本語</option></select></div><button id="saveSettings" class="btn secondary">保存语言</button></div><div id="feedList" class="feeds"></div><div id="status" class="status"></div></section>
<div class="toolbar"><h2 id="sectionTitle">全部国家</h2><div id="updated" class="updated">正在读取最新内容…</div></div><section id="articles" class="articles"><div class="empty">正在加载…</div></section></main></div>

<dialog id="subscriptionDialog"><form id="subscriptionForm" class="modal" method="dialog"><div class="modal-head"><h2>添加公开网站或 RSS</h2><button class="close" value="cancel" aria-label="关闭">×</button></div><div class="grid"><div><label for="feedName">名称</label><input id="feedName" placeholder="例如：Scherzo"></div><div><label for="feedCountry">国家</label><select id="feedCountry"><option value="auto">自动识别（推荐）</option><option value="cn">中国</option><option value="fr">法国</option><option value="es">西班牙</option><option value="de">德国</option><option value="it">意大利</option><option value="gb">英国</option><option value="us">美国</option><option value="at">奥地利</option><option value="ch">瑞士</option><option value="pt">葡萄牙</option><option value="other">其他地区</option></select></div><div class="wide"><label for="feedUrl">网站或 RSS 地址</label><input id="feedUrl" type="url" required placeholder="https://example.com/"></div><div><label for="feedMode">处理方式</label><select id="feedMode"><option value="summary">翻译并摘要</option><option value="translate">全文翻译</option></select></div><div><label for="feedLanguage">输出语言</label><select id="feedLanguage"><option value="">使用默认语言</option><option value="zh">简体中文</option><option value="en">English</option><option value="es">Español</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="it">Italiano</option><option value="pt">Português</option><option value="ja">日本語</option></select></div></div><div id="formStatus" class="status"></div><div class="modal-actions"><button class="btn secondary" value="cancel">取消</button><button class="btn" value="default">保存网站</button></div></form></dialog>

<dialog id="wechatDialog"><form id="wechatForm" class="modal" method="dialog"><div class="modal-head"><div><h2>导入微信公众号文章</h2><div class="hint">同一链接可分次添加不同语言，已有译文不会重复调用 API。</div></div><button class="close" value="cancel" aria-label="关闭">×</button></div><div class="grid"><div class="wide"><label for="wechatUrl">微信文章链接</label><input id="wechatUrl" type="url" required placeholder="https://mp.weixin.qq.com/s/..."></div><div><label for="wechatLanguage">目标语言</label><select id="wechatLanguage"><option value="en">English</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="es">Español</option><option value="it">Italiano</option><option value="pt">Português</option><option value="ja">日本語</option><option value="zh">简体中文</option></select></div><div><label for="wechatAuthor">公众号名称（备用）</label><input id="wechatAuthor" placeholder="自动读取失败时填写"></div><div class="wide"><label for="wechatTitle">文章标题（备用）</label><input id="wechatTitle" placeholder="自动读取失败时填写"></div><div class="wide"><label for="wechatText">文章正文（备用）</label><textarea id="wechatText" placeholder="通常留空；如微信阻止自动读取，请粘贴完整正文。"></textarea></div></div><div id="wechatStatus" class="status"></div><div class="modal-actions"><button class="btn secondary" value="cancel">取消</button><button class="btn" value="default">读取并全文翻译</button></div></form></dialog>

<dialog id="articleDialog"><div class="modal"><div class="modal-head"><div><h2 id="detailTitle">文章译文</h2><div id="detailMeta" class="updated"></div></div><button id="detailClose" class="close" aria-label="关闭">×</button></div><div class="detail-tools"><div><label for="detailLanguage">译文语言</label><select id="detailLanguage"></select></div><a id="detailOriginal" class="btn secondary" target="_blank" rel="noopener noreferrer">微信原文</a><button id="detailDelete" class="btn danger" hidden>删除文章</button></div><div id="detailTranslation" class="translation"></div></div></dialog>

<script>
const fallbackCountries={cn:"中国",fr:"法国",es:"西班牙",de:"德国",it:"意大利",gb:"英国",us:"美国",at:"奥地利",ch:"瑞士",pt:"葡萄牙",other:"其他地区"},langNames={zh:"简体中文",en:"English",es:"Español",fr:"Français",de:"Deutsch",it:"Italiano",pt:"Português",ja:"日本語"};let password=sessionStorage.getItem("byelinguaAdmin")||"",config={target_language:"zh",subscriptions:[]},publicData={articles:[],countries:fallbackCountries},activeCountry="all";const $=id=>document.getElementById(id),esc=value=>{const d=document.createElement("div");d.textContent=value||"";return d.innerHTML};
async function request(payload,admin=false){const response=await fetch("/api",{method:"POST",headers:{"Content-Type":"application/json",...(admin?{"X-Admin-Password":password}:{})},body:JSON.stringify(payload)}),text=await response.text();let data;try{data=JSON.parse(text)}catch{throw new Error("服务器返回了无法读取的内容。")};if(!response.ok)throw new Error(data.error||"请求失败");return data}
function dateLabel(value){if(!value)return"日期未知";const d=new Date(value);return Number.isNaN(d.valueOf())?String(value).slice(0,10):new Intl.DateTimeFormat("zh-CN",{year:"numeric",month:"2-digit",day:"2-digit"}).format(d)}function countryName(code){return(publicData.countries||fallbackCountries)[code]||"其他地区"}function excerpt(value,n=300){const text=(value||"").replace(/\s+/g," ").trim();return text.length>n?text.slice(0,n)+"…":text}
function renderNav(){const used=[...new Set(["cn",...publicData.articles.map(x=>x.country)])];$("countryNav").innerHTML=`<button class="country ${activeCountry==="all"?"active":""}" data-country="all">🌐 全部国家</button>`+used.map(code=>`<button class="country ${activeCountry===code?"active":""}" data-country="${esc(code)}">${code==="cn"?"🇨🇳 ":""}${esc(countryName(code))}</button>`).join("");document.querySelectorAll(".country").forEach(button=>button.onclick=()=>{activeCountry=button.dataset.country;renderNav();renderArticles()})}
function renderArticles(){const items=publicData.articles.filter(x=>activeCountry==="all"||x.country===activeCountry);$("sectionTitle").textContent=activeCountry==="cn"?"中国 · 微信文章与网站订阅":activeCountry==="all"?"全部国家":countryName(activeCountry);$("articles").innerHTML=items.length?items.map(item=>item.kind==="wechat"?`<article class="article wechat"><div class="meta"><span>微信公众号 · ${esc(item.source)}</span><time>${esc(dateLabel(item.published||item.processed_at))}</time></div><h3>${esc(item.title)}</h3><p>${esc(excerpt(item.result))}</p><button class="read" data-read="${esc(item.id)}">阅读多语言全文 →</button></article>`:`<article class="article"><div class="meta"><span>${esc(countryName(item.country))} · ${esc(item.source)}</span><time>${esc(dateLabel(item.published||item.processed_at))}</time></div><h3><a href="${esc(item.url)}" target="_blank" rel="noopener noreferrer">${esc(item.title)}</a></h3><p>${esc(item.result)}</p><a class="read" href="${esc(item.url)}" target="_blank" rel="noopener noreferrer">阅读原文 →</a></article>`).join(""):'<div class="empty">这个国家暂时还没有文章。</div>';document.querySelectorAll("[data-read]").forEach(button=>button.onclick=()=>openArticle(button.dataset.read))}
async function loadPublic(){try{publicData=await request({action:"get_public"});renderNav();renderArticles();$("updated").textContent=publicData.updated_at?`最后更新：${dateLabel(publicData.updated_at)} · ${publicData.articles.length} 篇`:`尚未生成文章 · 输出语言：${langNames[publicData.target_language]||publicData.target_language}`}catch(error){$("articles").innerHTML=`<div class="empty">${esc(error.message)}</div>`}}
function setStatus(message,type=""){$("status").textContent=message;$("status").className="status "+type}function renderFeeds(){const items=config.subscriptions||[];$("globalLanguage").value=config.target_language||"zh";$("feedList").innerHTML=items.length?items.map(item=>`<div class="feed"><div><div class="feed-name">${esc(item.name)}</div><div class="feed-info">${esc(countryName(item.country))} · ${item.source_type==="rss"?"RSS":"普通网站"} · ${item.mode==="summary"?"摘要":"全文翻译"} · ${esc(item.language?langNames[item.language]:"默认语言")}</div><div class="feed-info">${esc(item.url)}</div></div><button class="btn danger small" data-delete="${esc(item.id)}">删除</button></div>`).join(""):'<div class="empty">尚未添加网站。</div>';document.querySelectorAll("[data-delete]").forEach(button=>button.onclick=()=>removeFeed(button.dataset.delete))}
async function loadConfig(){try{config=await request({action:"get_config"},true);$("adminPanel").classList.add("open");$("addButton").hidden=false;$("wechatButton").hidden=false;$("loginButton").textContent="管理已登录";renderFeeds();setStatus("订阅已加载。","success")}catch(error){sessionStorage.removeItem("byelinguaAdmin");password="";setStatus(error.message,"error")}}function login(){const value=prompt("请输入 Vercel 中设置的 ADMIN_PASSWORD：",password);if(value!==null){password=value;sessionStorage.setItem("byelinguaAdmin",password);loadConfig()}}async function removeFeed(id){if(!confirm("确定删除这个网站吗？"))return;try{config=await request({action:"delete_subscription",id},true);renderFeeds();setStatus("网站已删除。","success")}catch(error){setStatus(error.message,"error")}}
$("loginButton").onclick=login;$("addButton").onclick=()=>$("subscriptionDialog").showModal();$("wechatButton").onclick=()=>$("wechatDialog").showModal();$("saveSettings").onclick=async()=>{try{config=await request({action:"save_settings",target_language:$("globalLanguage").value},true);renderFeeds();setStatus("默认语言已保存。","success")}catch(error){setStatus(error.message,"error")}};
$("subscriptionForm").onsubmit=async event=>{event.preventDefault();$("formStatus").textContent="正在检查网站…";try{config=await request({action:"save_subscription",subscription:{name:$("feedName").value,url:$("feedUrl").value,country:$("feedCountry").value,mode:$("feedMode").value,language:$("feedLanguage").value,enabled:true}},true);$("subscriptionForm").reset();$("subscriptionDialog").close();renderFeeds();setStatus("网站已添加。","success")}catch(error){$("formStatus").textContent=error.message;$("formStatus").className="status error"}};
$("wechatForm").onsubmit=async event=>{event.preventDefault();$("wechatStatus").textContent="正在读取并全文翻译，请稍候…";try{const data=await request({action:"import_wechat",article:{url:$("wechatUrl").value,language:$("wechatLanguage").value,title:$("wechatTitle").value,author:$("wechatAuthor").value,text:$("wechatText").value}},true);$("wechatStatus").textContent=data.reused?"该语言译文已经存在，没有重复调用 API。":"翻译完成并已加入中国栏目。";$("wechatStatus").className="status success";await loadPublic();if(!data.reused){$("wechatForm").reset();setTimeout(()=>$("wechatDialog").close(),700)}}catch(error){$("wechatStatus").textContent=error.message;$("wechatStatus").className="status error"}};
$("runButton").onclick=async()=>{if(!confirm("现在抓取并翻译所有订阅的新文章吗？"))return;setStatus("正在抓取和翻译，请稍候…");try{const data=await request({action:"run_digest"},true);setStatus(`完成：新增 ${data.processed} 篇，网站共 ${data.items} 篇。${data.errors.length?`${data.errors.length} 项失败。`:""}`,data.processed||!data.errors.length?"success":"error");await loadPublic()}catch(error){setStatus(error.message,"error")}};
function openArticle(id){const item=publicData.articles.find(x=>x.id===id);if(!item)return;$("detailTitle").textContent=item.title;$("detailMeta").textContent=`${item.source} · ${dateLabel(item.published||item.processed_at)}`;$("detailOriginal").href=item.url;const languages=Object.keys(item.translations||{});$("detailLanguage").innerHTML=languages.map(code=>`<option value="${esc(code)}">${esc(langNames[code]||code)}</option>`).join("");const update=()=>{$("detailTranslation").textContent=(item.translations||{})[$("detailLanguage").value]||item.result||""};$("detailLanguage").onchange=update;update();$("detailDelete").hidden=!password;$("detailDelete").onclick=async()=>{if(!confirm("确定删除这篇微信文章及全部译文吗？"))return;await request({action:"delete_article",id:item.id},true);$("articleDialog").close();await loadPublic()};$("articleDialog").showModal()}$("detailClose").onclick=()=>$("articleDialog").close();loadPublic();if(password)loadConfig();
</script></body></html>

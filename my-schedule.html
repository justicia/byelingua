<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Byelingua · My Schedule</title>
<style>
:root{--ink:#17201b;--muted:#68716b;--paper:#f5f2e9;--card:#fffdf8;--forest:#214d3a;--soft:#e8eee9;--line:#d7d7ce;--danger:#9e3737;--gold:#a4771f}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}button,select{font:inherit}button{cursor:pointer}a{color:inherit}.page{width:min(1060px,calc(100% - 40px));margin:auto;padding:24px 0 64px}.section-nav{display:flex;gap:26px;align-items:center;border-bottom:1px solid var(--line);padding:0 0 12px;margin-bottom:22px;overflow:auto}.section-nav a{color:var(--muted);font-size:13px;font-weight:650;text-decoration:none;white-space:nowrap}.section-nav a.active{color:var(--forest);text-decoration:underline;text-underline-offset:5px}.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px}.page-head h1{margin:0;color:var(--forest);font:500 34px/1.05 Georgia,"Times New Roman",serif}.page-head p{margin:6px 0 0;color:var(--muted)}.summary{display:flex;gap:18px;align-items:baseline;color:var(--muted);font-size:12px}.summary strong{color:var(--forest);font:500 24px/1 Georgia,serif}.filters{display:flex;gap:7px;flex-wrap:wrap;margin:22px 0 18px}.filter{border:1px solid #aebbb2;border-radius:999px;padding:7px 12px;background:transparent;color:var(--forest);font-weight:650}.filter.active{background:var(--forest);border-color:var(--forest);color:#fff}.status{min-height:20px;margin:8px 0;color:var(--muted)}.error{color:var(--danger)}.schema-warning{padding:10px 12px;border:1px solid #d6c29f;background:#fff9ea;border-radius:6px;color:#6c562c;margin:12px 0}.timeline-block{margin-top:22px}.period-label{display:flex;align-items:baseline;gap:12px;margin:26px 0 8px}.period-label h2{margin:0;color:var(--forest);font:500 23px/1 Georgia,serif}.period-label span{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.now-divider{display:flex;align-items:center;gap:12px;margin:30px 0 18px;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.1em}.now-divider:before,.now-divider:after{content:"";height:1px;background:var(--line);flex:1}.timeline{display:grid;gap:9px}.event-card{display:grid;grid-template-columns:90px minmax(0,1fr) auto;gap:18px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:7px;padding:15px 16px}.event-date{color:var(--muted);font-size:12px}.event-date strong{display:block;color:var(--forest);font:600 18px/1.15 Georgia,serif;margin-bottom:3px}.event-title{margin:0;color:var(--forest);font:600 18px/1.2 Georgia,serif}.event-meta{margin-top:4px;color:var(--muted);font-size:12px}.event-secondary{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:9px}.badge,.trip-link{display:inline-flex;align-items:center;min-height:26px;padding:4px 8px;border:1px solid #c4cec7;border-radius:999px;background:var(--soft);color:var(--forest);font-size:11px;font-weight:650;text-decoration:none}.badge.pending{background:#fff7e7;border-color:#ddc48f;color:#71561e}.badge.missed{background:#f2f0ec;color:#777;border-color:#d7d3cb}.trip-link{background:transparent}.event-actions{display:flex;flex-direction:column;align-items:flex-end;gap:7px;min-width:128px}.event-actions select,.event-actions button,.review-link{width:128px;min-height:34px;border:1px solid var(--forest);border-radius:5px;padding:6px 8px;background:#fff;color:var(--forest);font-size:12px;font-weight:650;text-decoration:none;text-align:center}.event-actions button.primary,.review-link.primary{background:var(--forest);color:#fff}.event-actions button.secondary{border-color:#aebbb2}.event-actions button.delete-record{border-color:#d7aaa4;background:#fff7f5;color:var(--danger)}.review-score{display:flex;align-items:baseline;gap:6px;color:var(--forest);font-size:12px}.review-note{margin-top:9px;padding-top:8px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.review-note p{margin:4px 0 0;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}.stars{letter-spacing:1px;color:var(--gold);white-space:nowrap}.final{font-weight:700}.empty{padding:42px 12px;text-align:center;color:var(--muted);border-top:1px solid var(--line);margin-top:18px}.saving{opacity:.58;pointer-events:none}@media(max-width:700px){.page{width:calc(100% - 24px);padding-top:16px}.page-head{align-items:flex-start;flex-direction:column}.summary{width:100%;justify-content:space-between}.event-card{grid-template-columns:72px minmax(0,1fr);gap:12px}.event-actions{grid-column:1/-1;flex-direction:row;align-items:center;flex-wrap:wrap;margin-left:84px}.event-actions select,.event-actions button,.review-link{width:auto;flex:1;min-width:110px}.event-title{font-size:17px}}
</style>
</head>
<body>
<header id="sharedHeader"></header>
<script src="/shared-i18n.js"></script><script src="/shared-header.js"></script>
<script>ByelinguaHeader.mount(document.getElementById('sharedHeader'));</script>
<main class="page">
<nav class="section-nav" aria-label="Personal music sections"><a href="/my-schedule.html" class="active" aria-current="page" data-copy="mySchedule">我的音乐会记录</a><a href="/trips.html" data-copy="trips">我的日程</a></nav>
<div class="page-head"><div><h1 data-copy="mySchedule">我的音乐会记录</h1><p data-copy="description">想去、要去、去过的演出，以及你的评分与评论。</p></div><div id="summary" class="summary"></div></div>
<div class="filters" role="group" aria-label="My Schedule filters"><button class="filter active" data-filter="all" data-copy="all">全部</button><button class="filter" data-filter="want_to_go" data-copy="want">想去</button><button class="filter" data-filter="going" data-copy="going">要去</button><button class="filter" data-filter="attended" data-copy="attended">去过</button><button class="filter" data-filter="reviewed" data-copy="reviews">已评分</button></div>
<div id="schemaWarning" class="schema-warning" hidden></div><div id="status" class="status"></div><div id="timeline"></div>
</main>
<script>
const $=id=>document.getElementById(id);let items=[],activeFilter='all',savingKey='';
const COPY={zh:{schedule:'Schedule',mySchedule:'我的音乐会记录',trips:'我的日程',description:'想去、要去、去过的演出，以及你的评分与评论。',all:'全部',want:'想去',going:'要去',attended:'去过',missed:'未参加',pending:'待确认',rate:'评分',editReview:'编辑评分',deleteRecord:'删除记录',deleteConfirm:'删除这场演出的个人记录和评分评论？它在日程中的安排会保留。',went:'我去了',didNotGo:'没去',loading:'正在读取音乐会记录…',empty:'这里还没有演出。你可以从“去看演出”加入记录。',upgrade:'音乐会记录的新数据结构尚未应用；当前页面正在使用兼容模式。',future:'接下来',past:'过去',reviews:'已评分',events:'场演出'},en:{schedule:'Schedule',mySchedule:'My Concert Log',trips:'My Trips',description:'Performances you want to attend, plan to attend, or attended, with your ratings and comments.',all:'All',want:'Want to go',going:'Going',attended:'Attended',missed:'Did not attend',pending:'Confirm attendance',rate:'Rate',editReview:'Edit rating',deleteRecord:'Delete record',deleteConfirm:'Delete this concert record and its ratings and comments? Its trip entries will remain.',went:'I went',didNotGo:'Did not go',loading:'Loading concert log…',empty:'No performances here yet. Add one from Schedule Planner.',upgrade:'The new concert log schema has not been applied yet; this page is using compatibility mode.',future:'Upcoming',past:'Past',reviews:'reviewed',events:'events'}};
function lang(){return window.ByelinguaI18n.getUiLanguage()==='en'?'en':'zh'}function t(key){return COPY[lang()][key]||key}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function token(){for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i)||'';if(!key.startsWith('sb-')||!key.endsWith('-auth-token'))continue;try{const value=JSON.parse(localStorage.getItem(key)||'{}');if(value.access_token)return value.access_token}catch(_){}}return ''}
async function reviewsApi(payload){const value=token();if(!value){location.href='/?login=1';throw Error('Login required')}const r=await fetch('/api/reviews',{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${value}`},body:JSON.stringify(payload)}),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
function localToday(){const d=new Date(),y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}function isPast(event){return String(event?.date||'')<localToday()}function displayStatus(item){if(item.personal_status==='going'&&isPast(item.event))return 'pending';return item.personal_status}function dateObject(value){return new Date(`${value}T12:00:00`)}function monthKey(event){return String(event?.date||'').slice(0,7)}function monthLabel(key){if(!key)return '';const d=dateObject(`${key}-01`);return new Intl.DateTimeFormat(lang()==='en'?'en-GB':'zh-CN',{year:'numeric',month:'long'}).format(d)}function dayLabel(value){if(!value)return '';const d=dateObject(value);return new Intl.DateTimeFormat(lang()==='en'?'en-GB':'zh-CN',{day:'2-digit',month:'short'}).format(d)}function weekday(value){if(!value)return '';return new Intl.DateTimeFormat(lang()==='en'?'en-GB':'zh-CN',{weekday:'short'}).format(dateObject(value))}function stars(value){const n=Math.max(0,Math.min(5,Number(value)||0));return '★'.repeat(n)+'☆'.repeat(5-n)}function eventLocation(event){return [event.organization,event.venue,event.room,event.city].filter((x,i,a)=>x&&a.indexOf(x)===i).join(' · ')}function tripHref(trip){return trip.status==='planned'?`/schedule-summary.html?schedule_id=${encodeURIComponent(trip.id)}`:`/schedule-editor.html?schedule_id=${encodeURIComponent(trip.id)}`}
function statusLabel(value){return value==='want_to_go'?t('want'):value==='going'?t('going'):value==='attended'?t('attended'):value==='not_attended'?t('missed'):value==='pending'?t('pending'):value}
function reviewUrl(event){return `/review.html?event_key=${encodeURIComponent(event.event_key||'')}`}
function reviewNote(review){if(!review)return '';const mode=review.visibility==='private'?(lang()==='en'?'Private':'仅自己可见'):review.identity_mode==='anonymous'?(lang()==='en'?'Anonymous':'匿名'):(lang()==='en'?'Named':'署名');return `<div class="review-note"><span>${esc(mode)}</span>${review.comment?`<p>${esc(review.comment)}</p>`:''}</div>`}function eventCard(item){const event=item.event||{},state=displayStatus(item),past=isPast(event),review=item.review||null,trips=item.trips||[];const badges=[`<span class="badge ${state==='pending'?'pending':state==='not_attended'?'missed':''}">${esc(statusLabel(state))}</span>`,...trips.map(trip=>`<a class="trip-link" href="${tripHref(trip)}">${esc(trip.title)}</a>`)].join('');let actions='';if(state==='pending'){actions=`<button class="primary" data-status="attended" data-event="${esc(event.event_key)}">${t('went')}</button><button class="secondary" data-status="not_attended" data-event="${esc(event.event_key)}">${t('didNotGo')}</button>`}else{actions=`<select data-status-select="${esc(event.event_key)}" aria-label="${esc(statusLabel(state))}"><option value="want_to_go" ${item.personal_status==='want_to_go'?'selected':''}>${t('want')}</option><option value="going" ${item.personal_status==='going'?'selected':''}>${t('going')}</option><option value="attended" ${item.personal_status==='attended'?'selected':''}>${t('attended')}</option></select>`;if(item.personal_status==='attended')actions+=`<a class="review-link ${review?'':'primary'}" href="${reviewUrl(event)}">${review?t('editReview'):t('rate')}</a>`}actions+=`<button type="button" class="delete-record" data-delete-record="${esc(event.event_key)}">${t('deleteRecord')}</button>`;return `<article class="event-card ${savingKey===String(event.event_key)?'saving':''}"><div class="event-date"><strong>${esc(dayLabel(event.date))}</strong>${esc(weekday(event.date))}${event.start_time?`<br>${esc(String(event.start_time).slice(0,5))}`:''}</div><div><h3 class="event-title">${esc(event.title||event.original_title||'Untitled event')}</h3><div class="event-meta">${esc(eventLocation(event))}</div><div class="event-secondary">${badges}${review?`<span class="review-score"><span class="stars">${stars(review.overall_rating)}</span>${review.final_score?`<span class="final">${Number(review.final_score).toFixed(1)}</span>`:''}</span>`:''}</div>${reviewNote(review)}</div><div class="event-actions">${actions}</div></article>`}
function groupHtml(rows,label){if(!rows.length)return '';const groups=new Map();for(const row of rows){const key=monthKey(row.event);if(!groups.has(key))groups.set(key,[]);groups.get(key).push(row)}return `<section class="timeline-block"><div class="period-label"><h2>${esc(label)}</h2><span>${rows.length} ${t('events')}</span></div>${[...groups.entries()].map(([key,values])=>`<div class="period-label"><h2>${esc(monthLabel(key))}</h2></div><div class="timeline">${values.map(eventCard).join('')}</div>`).join('')}</section>`}
function filteredRows(){return items.filter(item=>activeFilter==='all'||(activeFilter==='reviewed'?Boolean(item.review):item.personal_status===activeFilter))}function render(){document.querySelectorAll('[data-copy]').forEach(node=>{const key=node.dataset.copy;if(COPY[lang()][key])node.textContent=t(key)});document.title=`Byelingua · ${t('mySchedule')}`;document.querySelectorAll('.filter').forEach(button=>button.classList.toggle('active',button.dataset.filter===activeFilter));const rows=filteredRows();const upcoming=rows.filter(row=>!isPast(row.event)).sort((a,b)=>String(a.event.date).localeCompare(String(b.event.date))||String(a.event.start_time||'').localeCompare(String(b.event.start_time||'')));const past=rows.filter(row=>isPast(row.event)).sort((a,b)=>String(b.event.date).localeCompare(String(a.event.date))||String(b.event.start_time||'').localeCompare(String(a.event.start_time||'')));const reviewed=items.filter(row=>row.review).length;$('summary').innerHTML=`<span><strong>${items.length}</strong> ${t('events')}</span><span><strong>${reviewed}</strong> ${t('reviews')}</span>`;$('timeline').innerHTML=rows.length?`${groupHtml(upcoming,t('future'))}${upcoming.length&&past.length?'<div class="now-divider">NOW</div>':''}${groupHtml(past,t('past'))}`:`<div class="empty">${t('empty')}</div>`;wireActions()}
function wireActions(){document.querySelectorAll('[data-status-select]').forEach(select=>select.onchange=()=>setStatus(select.dataset.statusSelect,select.value));document.querySelectorAll('[data-status][data-event]').forEach(button=>button.onclick=()=>setStatus(button.dataset.event,button.dataset.status));document.querySelectorAll('[data-delete-record]').forEach(button=>button.onclick=()=>deleteRecord(button.dataset.deleteRecord))}
async function setStatus(eventKey,status){if(!eventKey)return;savingKey=eventKey;render();try{await reviewsApi({action:'set_personal_status',event_key:eventKey,status});const row=items.find(item=>String(item.event?.event_key)===String(eventKey));if(row)row.personal_status=status;if(status==='attended'&&row)row.attendance_status='attended';if(status==='not_attended'&&row)row.attendance_status='missed';$('status').textContent='';}catch(error){$('status').textContent=error.message;$('status').className='status error'}finally{savingKey='';render()}}
async function deleteRecord(eventKey){if(!eventKey||!confirm(t('deleteConfirm')))return;savingKey=eventKey;render();try{await reviewsApi({action:'delete_personal_record',event_key:eventKey});items=items.filter(item=>String(item.event?.event_key)!==String(eventKey));$('status').textContent=''}catch(error){$('status').textContent=error.message;$('status').className='status error'}finally{savingKey='';render()}}async function load(){if(!token()){location.href='/?login=1';return}$('status').textContent=t('loading');try{const data=await reviewsApi({action:'my_schedule'});items=data.items||[];$('schemaWarning').hidden=data.schema_ready!==false;$('schemaWarning').textContent=t('upgrade');$('status').textContent='';render()}catch(error){$('status').textContent=error.message;$('status').className='status error'}}
document.querySelectorAll('[data-filter]').forEach(button=>button.onclick=()=>{activeFilter=button.dataset.filter;render()});window.addEventListener('byelingua-language-change',render);load();
</script>
</body></html>

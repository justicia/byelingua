<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Byelingua · 我的日程</title>
<style>
:root{--ink:#17201b;--muted:#68716b;--paper:#f5f2e9;--card:#fffdf8;--forest:#214d3a;--soft:#e8eee9;--line:#d7d7ce;--danger:#9e3737}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}button,input{font:inherit}a{color:inherit}.page{width:min(1060px,calc(100% - 40px));margin:auto;padding:24px 0 64px}.section-nav{display:flex;gap:26px;align-items:center;border-bottom:1px solid var(--line);padding:0 0 12px;margin-bottom:22px;overflow:auto}.section-nav a{color:var(--muted);font-size:13px;font-weight:650;text-decoration:none;white-space:nowrap}.section-nav a.active{color:var(--forest);text-decoration:underline;text-underline-offset:5px}.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px}.page-head h1{margin:0;color:var(--forest);font:500 34px/1.05 Georgia,"Times New Roman",serif}.page-head p{margin:6px 0 0;color:var(--muted)}.create{display:flex;gap:8px;align-items:center;margin:22px 0 12px}.create input{min-width:0;flex:1;padding:10px 11px;border:1px solid #c8cdc5;border-radius:5px;background:#fff;color:var(--ink)}button,.button{cursor:pointer;border:1px solid var(--forest);border-radius:5px;padding:8px 12px;background:var(--forest);color:#fff;font-weight:650;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.secondary{background:transparent;color:var(--forest);border-color:#aebbb2}.status{min-height:20px;color:var(--muted)}.error{color:var(--danger)}.trip-section{margin-top:28px}.trip-section h2{margin:0 0 10px;color:var(--forest);font:500 23px/1 Georgia,serif}.trip-list{display:grid;gap:9px}.trip-card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:7px;padding:16px}.trip-card h3{margin:0;color:var(--forest);font:600 18px/1.2 Georgia,serif}.meta{margin-top:5px;color:var(--muted);font-size:12px}.trip-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.empty{color:var(--muted);padding:10px 0}.badge{display:inline-block;margin-top:8px;padding:3px 7px;border-radius:999px;background:var(--soft);color:var(--forest);font-size:11px;font-weight:700}@media(max-width:700px){.page{width:calc(100% - 24px);padding-top:16px}.page-head{align-items:flex-start;flex-direction:column}.create{align-items:stretch;flex-direction:column}.trip-card{grid-template-columns:1fr}.trip-actions{grid-column:1}.trip-actions a{flex:1;min-width:120px}}
</style></head><body><header id="sharedHeader"></header><script src="/shared-i18n.js"></script><script src="/shared-header.js"></script><script>ByelinguaHeader.mount(document.getElementById('sharedHeader'));</script>
<main class="page"><nav class="section-nav" aria-label="Schedule sections"><a href="/schedule.html" data-copy="schedule">Schedule</a><a href="/my-schedule.html" data-copy="mySchedule">我的音乐会记录</a><a href="/trips.html" class="active" aria-current="page" data-copy="trips">我的日程</a></nav><div class="page-head"><div><h1 data-copy="trips">我的日程</h1><p data-copy="description">把音乐会记录中的演出组织成具体行程。</p></div></div><div class="create"><input id="tripTitle" data-placeholder="placeholder" placeholder="例如 Bayreuth 2027"><button id="createTrip" type="button" data-copy="create">新建行程</button></div><div id="status" class="status"></div><div id="trips"></div></main>
<script>
const $=id=>document.getElementById(id);let rows=[];const COPY={zh:{schedule:'Schedule',mySchedule:'我的音乐会记录',trips:'我的日程',description:'把音乐会记录中的演出组织成具体行程。',placeholder:'例如 Bayreuth 2027',create:'新建行程',planning:'规划中',upcoming:'已确认',history:'历史行程',archived:'已归档',edit:'继续编辑',view:'查看完整行程',events:'场演出',empty:'暂无行程。',loading:'正在读取行程…'},en:{schedule:'Schedule',mySchedule:'My Concert Log',trips:'My Trips',description:'Group performances from your concert log into trips.',placeholder:'e.g. Bayreuth 2027',create:'New trip',planning:'Planning',upcoming:'Confirmed',history:'Past trips',archived:'Archived',edit:'Continue editing',view:'View complete trip',events:'events',empty:'No trips yet.',loading:'Loading trips…'}};function lang(){return window.ByelinguaI18n.getUiLanguage()==='en'?'en':'zh'}function t(k){return COPY[lang()][k]||k}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function token(){for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i)||'';if(!key.startsWith('sb-')||!key.endsWith('-auth-token'))continue;try{const value=JSON.parse(localStorage.getItem(key)||'{}');if(value.access_token)return value.access_token}catch(_){}}return ''}async function api(payload){const value=token();if(!value){location.href='/?login=1';throw Error('Login required')}const r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${value}`},body:JSON.stringify(payload)}),d=await r.json();if(!r.ok)throw Error(window.ByelinguaI18n.localizeApiError(d));return d}function dateRange(row){if(row.start_date&&row.end_date)return `${row.start_date} – ${row.end_date}`;return row.start_date||row.end_date||''}function tripHref(row){return row.status==='planned'?`/schedule-summary.html?schedule_id=${encodeURIComponent(row.id)}`:`/schedule-editor.html?schedule_id=${encodeURIComponent(row.id)}`}function card(row){const label=row.status==='planned'?t('upcoming'):row.status==='completed'?t('history'):row.status==='archived'?t('archived'):t('planning');return `<article class="trip-card"><div><h3>${esc(row.title||'Untitled trip')}</h3><div class="meta">${esc(dateRange(row))}${row.cities?.length?` · ${esc(row.cities.join(' · '))}`:''} · ${Number(row.event_count||0)} ${t('events')}</div><span class="badge">${esc(label)}</span></div><div class="trip-actions"><a class="button ${row.status==='planned'?'':'secondary'}" href="${tripHref(row)}">${row.status==='planned'?t('view'):t('edit')}</a></div></article>`}function group(status,title){const subset=rows.filter(row=>row.status===status);return `<section class="trip-section"><h2>${title}</h2><div class="trip-list">${subset.length?subset.map(card).join(''):`<div class="empty">${t('empty')}</div>`}</div></section>`}function render(){document.querySelectorAll('[data-copy]').forEach(node=>node.textContent=t(node.dataset.copy));$('tripTitle').placeholder=t('placeholder');document.title=`Byelingua · ${t('trips')}`;$('trips').innerHTML=group('draft',t('planning'))+group('planned',t('upcoming'))+group('completed',t('history'))+group('archived',t('archived'))}async function load(){if(!token()){location.href='/?login=1';return}$('status').textContent=t('loading');try{const data=await api({action:'list_schedules'});rows=data.schedules||[];$('status').textContent='';render()}catch(error){$('status').textContent=error.message;$('status').className='status error'}}$('createTrip').onclick=async()=>{const title=$('tripTitle').value.trim();if(!title){$('tripTitle').focus();return}$('createTrip').disabled=true;try{const data=await api({action:'create_schedule',title});const id=data.schedule?.id;if(id)location.href=`/schedule-editor.html?schedule_id=${encodeURIComponent(id)}`;else await load()}catch(error){$('status').textContent=error.message;$('status').className='status error'}finally{$('createTrip').disabled=false}};window.addEventListener('byelingua-language-change',render);load();
</script></body></html>

<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Byelingua · Schedule Builder</title>
<style>
:root{--ink:#17201b;--muted:#68716b;--paper:#f5f2e9;--card:#fffdf8;--forest:#214d3a;--soft:#e8eee9;--line:#d7d7ce}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}main{width:min(1120px,calc(100% - 28px));margin:auto;padding:12px 0 60px}a{color:var(--forest)}h1,h2,h3{font-family:Georgia,serif}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:1px solid var(--line);padding:12px 0 16px}.schedule-identity{flex:1;min-width:0}.schedule-brand{display:inline-block;color:var(--forest);font:500 clamp(34px,4vw,50px)/.95 Georgia,"Times New Roman",serif;letter-spacing:-.035em;text-decoration:none}.schedule-tagline{margin:8px 0 10px;color:var(--muted);font-size:11px;letter-spacing:.08em}.schedule-header-actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.language-switch{display:flex;gap:3px}.language-switch button{border:1px solid #b7c9bd;background:transparent;color:var(--forest);border-radius:4px;padding:6px 8px;font-size:11px}.language-switch button.active{background:var(--forest);color:#fff}.schedule-account{display:flex;gap:7px;align-items:center}.schedule-account-label{max-width:180px;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.schedule-page-title{margin:0;color:var(--forest)}.schedule-page-description{margin:3px 0 0}.panel,.event,.schedule-item{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:16px;margin-top:16px}.filters{display:grid;grid-template-columns:170px 170px 1fr;gap:12px;align-items:end}.field label{display:block;font-weight:700;font-size:12px;margin-bottom:4px}.field input,.field select,.location-search{width:100%;padding:9px;border:1px solid #c8cdc5;border-radius:5px;background:#fff}.choices{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}.choice{display:inline-flex;gap:5px;align-items:center;border:1px solid #c8cdc5;border-radius:4px;padding:6px 9px;background:#fff}.choice.selected{border-color:var(--forest);background:var(--soft)}button{font:inherit;cursor:pointer;border:1px solid var(--forest);border-radius:5px;padding:8px 12px;background:var(--forest);color:#fff;font-weight:700}button.secondary{background:transparent;color:var(--forest);border-color:#aebbb2}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px}.hint,.meta{color:var(--muted);font-size:12px}.event{display:grid;grid-template-columns:24px 120px 1fr auto;gap:10px;align-items:start}.event h3{margin:0 0 3px;font-size:18px;color:var(--forest)}.event .actions{display:flex;gap:6px;flex-wrap:wrap}.event .actions button{font-size:12px;padding:6px 9px}.details{margin-top:8px;border-top:1px solid var(--line);padding-top:8px}.details h4{margin:8px 0 3px}.details ul{margin:3px 0;padding-left:20px}.schedule-grid{display:grid;gap:8px}.schedule-item{margin:0;display:grid;grid-template-columns:130px 1fr;gap:12px}.schedule-item h3{margin:0;color:var(--forest);font-size:17px}.status{min-height:20px;margin-top:8px;color:var(--muted)}.error{color:#9e3737}.location-autocomplete{position:relative}.location-suggestions{position:absolute;left:0;right:0;top:100%;z-index:8;margin-top:4px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:5px;box-shadow:0 8px 24px #10201822;max-height:220px;overflow:auto}.location-suggestion{display:flex;width:100%;justify-content:space-between;gap:8px;padding:8px 9px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);text-align:left;font-weight:500}.location-suggestion:last-child{border-bottom:0}.location-suggestion:hover,.location-suggestion:focus-visible{background:var(--soft)}.location-suggestion small{color:var(--muted);font-size:11px}@media(max-width:760px){.filters{grid-template-columns:1fr 1fr}.filters .wide{grid-column:1/-1}.event{grid-template-columns:24px 1fr}.event>.date{grid-column:2}.event>.actions{grid-column:2}.schedule-item{grid-template-columns:1fr}.top{align-items:flex-start;gap:10px;flex-direction:column}.schedule-header-actions{width:100%;justify-content:space-between}.schedule-account-label{display:none}.schedule-brand{font-size:39px}}
</style><style>.cast-list{list-style:none;padding:0!important}.cast-list li{display:grid;grid-template-columns:minmax(0,42%) minmax(0,58%);align-items:start;gap:16px;padding:7px 0;border-bottom:1px solid var(--line)}.cast-list li>span,.cast-list li>strong{min-width:0;text-align:left}.cast-list .artist-link{display:inline;text-align:left;white-space:normal;overflow-wrap:break-word;line-height:1.35}.team-group h5{margin:10px 0 2px;font-size:13px;color:var(--forest)}.team-group ul{margin-top:0}@media(max-width:420px){.cast-list li{grid-template-columns:1fr;gap:2px}}</style></head><body><main>
<div class="top"><div><a href="/">← Byelingua</a><h1>Schedule Builder</h1><div class="hint">选择日期、地点和演出，生成个人演出时间表。</div></div><button id="generate" disabled>Generate Schedule</button></div>
<section class="panel"><div class="filters"><div class="field"><label for="dateFrom">Date from</label><input id="dateFrom" type="date" required></div><div class="field"><label for="dateTo">Date to</label><input id="dateTo" type="date" required></div><div class="field wide"><label for="eventType">Event type（可选）</label><select id="eventType"><option value="">全部类型</option></select></div></div>
<div class="field" style="margin-top:13px"><label for="locationSearch">地点搜索</label><input id="locationSearch" class="location-search" placeholder="例如 Vienna、Paris、Berlin"></div>
<div><strong>城市</strong><div id="cities" class="choices"></div></div><div style="margin-top:10px"><strong>机构</strong><div id="organizations" class="choices"></div></div><div style="margin-top:10px"><strong>场馆</strong><div id="venues" class="choices"></div></div>
<div id="filterStatus" class="status"></div><button id="search">Search events</button></section>
<section class="panel"><h2 style="margin:0">Character Search</h2><div class="hint">按作品角色检索，不会把不同作品的同名角色合并。</div><div class="field" style="margin-top:10px"><label for="characterQuery">Character</label><input id="characterQuery" autocomplete="off" placeholder="例如 Rosina、Kundry、Wotan、Figaro"></div><div id="characterSuggestions" class="choices"></div><div id="characterStatus" class="status"></div><div id="characterEvents"></div></section>
<section class="panel"><div class="toolbar"><div><h2 style="margin:0">Events</h2><div id="resultHint" class="hint">请先选择日期和地点。</div></div><span id="selectedHint" class="hint">已选 0 场</span></div><div id="events"></div></section>
<section id="schedulePanel" class="panel" hidden><h2 style="margin:0">Generated Schedule</h2><div class="hint">按日期和开始时间排序。后续可将 selected_event_ids 接入用户旅行计划。</div><div id="schedule" class="schedule-grid" style="margin-top:12px"></div></section>
<dialog id="detail"><div style="padding:18px"><div class="toolbar"><h2 id="detailTitle" style="margin:0"></h2><button id="closeDetail" class="secondary">关闭</button></div><div id="detailMeta" class="meta"></div><div id="detailBody"></div></div></dialog>
</main><script src="/shared-i18n.js"></script><script src="/shared-header.js"></script><script>
const $=id=>document.getElementById(id);let options={cities:[],organizations:[],venues:[]},events=[],selected_event_ids=new Set(),details=new Map(),characterChoices=[],selectedCharacter=null;
let eventAccessToken='';
function storedEventAccessToken(){for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i)||'';if(!key.startsWith('sb-')||!key.endsWith('-auth-token'))continue;try{const value=JSON.parse(localStorage.getItem(key)||'{}');if(value.access_token)return value.access_token}catch(_){}}return ''}
async function api(payload){const headers={'Content-Type':'application/json'},token=eventAccessToken||storedEventAccessToken();if(token)headers.Authorization=`Bearer ${token}`;const r=await fetch('/api',{method:'POST',headers,body:JSON.stringify(payload)}),d=await r.json();if(!r.ok)throw Error(window.ByelinguaI18n.localizeApiError(d));return d}
function today(){return new Date().toISOString().slice(0,10)}function plus(days){const d=new Date();d.setDate(d.getDate()+days);return d.toISOString().slice(0,10)}
const selectedCities=new Set(),selectedOrganizations=new Set(),selectedVenues=new Set();
function selected(name){return name==='city'?[...selectedCities]:name==='organization'?[...selectedOrganizations]:[...selectedVenues]}
function renderChoices(){const q=$('locationSearch').value.trim().toLowerCase();const chosenCities=selected('city');const cityMatches=options.cities.filter(x=>!q||x.toLowerCase().includes(q));$('cities').innerHTML=cityMatches.map((x,i)=>{const id=`city-${i}`;return `<label class="choice ${selectedCities.has(x)?'selected':''}" for="${id}"><input id="${id}" type="checkbox" data-city="${x}" ${selectedCities.has(x)?'checked':''}>${x}</label>`}).join('')||'<span class="hint">暂无匹配地点</span>';const availableOrgIds=new Set(options.venues.filter(v=>!chosenCities.length||chosenCities.includes(v.city)).map(v=>v.organization_id));const orgs=options.organizations.filter(x=>availableOrgIds.has(x.id)&&(!q||x.name.toLowerCase().includes(q)));$('organizations').innerHTML=orgs.map((x,i)=>{const id=`organization-${i}`;return `<label class="choice ${selectedOrganizations.has(x.name)?'selected':''}" for="${id}"><input id="${id}" type="checkbox" data-organization="${x.name}" ${selectedOrganizations.has(x.name)?'checked':''}>${x.name}</label>`}).join('')||'<span class="hint">暂无匹配机构</span>';const chosenOrgs=selected('organization');const vs=options.venues.filter(x=>(!chosenCities.length||chosenCities.includes(x.city))&&(!chosenOrgs.length||chosenOrgs.includes(x.organization))&&(!q||x.name.toLowerCase().includes(q)||x.organization.toLowerCase().includes(q)));$('venues').innerHTML=vs.map((x,i)=>{const id=`venue-${i}`;return `<label class="choice ${selectedVenues.has(x.name)?'selected':''}" for="${id}"><input id="${id}" type="checkbox" data-venue="${x.name}" ${selectedVenues.has(x.name)?'checked':''}>${x.name} <span class="hint">· ${x.organization}</span></label>`}).join('')||'<span class="hint">暂无匹配场馆</span>';document.querySelectorAll('.choice input').forEach(i=>i.onchange=()=>{const set=i.dataset.city!==undefined?selectedCities:i.dataset.organization!==undefined?selectedOrganizations:selectedVenues;const value=i.dataset.city??i.dataset.organization??i.dataset.venue;i.checked?set.add(value):set.delete(value);const validOrgs=new Set(options.venues.filter(v=>!selectedCities.size||selectedCities.has(v.city)).map(v=>v.organization));for(const value of [...selectedOrganizations])if(!validOrgs.has(value))selectedOrganizations.delete(value);const validVenues=new Set(options.venues.filter(v=>(!selectedCities.size||selectedCities.has(v.city))&&(!selectedOrganizations.size||selectedOrganizations.has(v.organization))).map(v=>v.name));for(const value of [...selectedVenues])if(!validVenues.has(value))selectedVenues.delete(value);renderChoices()})}
function eventLocation(e){return [e.organization,e.room||e.venue,e.city].filter(Boolean).join(' · ')}
function renderEvents(){if(!events.length){$('events').innerHTML='<div class="status">没有符合条件的演出。</div>';return}$('events').innerHTML=events.map(e=>`<article class="event"><input type="checkbox" data-event="${e.event_id}" ${selected_event_ids.has(e.event_id)?'checked':''} aria-label="选择 ${e.title}"><div class="date"><strong>${e.date}</strong><br>${e.start_time||''}</div><div><h3>${e.title}</h3><div class="meta">${eventLocation(e)} · ${e.event_type}</div></div><div class="actions"><button class="secondary" data-detail="${e.event_id}">详情</button><button data-add="${e.event_id}">${selected_event_ids.has(e.event_id)?'已加入':'加入行程'}</button></div></article>`).join('');document.querySelectorAll('[data-event]').forEach(x=>x.onchange=()=>{x.checked?selected_event_ids.add(x.dataset.event):selected_event_ids.delete(x.dataset.event);renderEvents();updateSelected()});document.querySelectorAll('[data-add]').forEach(x=>x.onclick=()=>{selected_event_ids.add(x.dataset.add);renderEvents();updateSelected()});document.querySelectorAll('[data-detail]').forEach(x=>x.onclick=()=>showDetail(x.dataset.detail));updateSelected()}
function updateSelected(){$('selectedHint').textContent=`已选 ${selected_event_ids.size} 场`;$('generate').disabled=!selected_event_ids.size}
function renderCharacterSuggestions(){const q=$('characterQuery').value.trim().toLowerCase();$('characterSuggestions').innerHTML=characterChoices.map(x=>`<button type="button" class="secondary" data-character="${x.id}">${x.canonical_name} · ${x.work_title||''}${x.composer?' · '+x.composer:''}</button>`).join('');document.querySelectorAll('[data-character]').forEach(b=>b.onclick=()=>{selectedCharacter=characterChoices.find(x=>x.id===b.dataset.character);$('characterQuery').value=`${selectedCharacter.canonical_name} · ${selectedCharacter.work_title||''}`;renderCharacterSuggestions();loadCharacterEvents()})}
async function loadCharacterEvents(){if(!selectedCharacter)return;$('characterStatus').textContent='正在查询角色演出…';try{const d=await api({action:'character_events',character_id:selectedCharacter.id,date_from:$('dateFrom').value,date_to:$('dateTo').value,cities:selected('city'),organizations:selected('organization'),venues:selected('venue')});const found=d.events||[];for(const e of found)if(!events.some(x=>x.event_id===e.event_id))events.push(e);$('characterStatus').textContent=`${selectedCharacter.canonical_name} · ${selectedCharacter.work_title||''}：找到 ${found.length} 场`;$('characterEvents').innerHTML=found.map(e=>`<article class="event"><input type="checkbox" data-event="${e.event_id}" ${selected_event_ids.has(e.event_id)?'checked':''}><div class="date"><strong>${e.date}</strong><br>${e.start_time||''}</div><div><h3>${e.canonical_name||selectedCharacter.canonical_name}</h3><div class="meta">${e.work_title||''}${e.composer?' · '+e.composer:''}</div><div>${e.organization} · ${e.venue} · ${e.artist_name}</div></div><div class="actions"><button class="secondary" data-detail="${e.event_id}">详情</button><button data-add="${e.event_id}">加入行程</button></div></article>`).join('')||'<div class="hint">没有找到该角色的演出。</div>';bindEventActions('characterEvents');updateSelected()}catch(e){$('characterStatus').textContent=e.message;$('characterStatus').className='status error'}}
function bindEventActions(container){document.querySelectorAll(`#${container} [data-event]`).forEach(x=>x.onchange=()=>{x.checked?selected_event_ids.add(x.dataset.event):selected_event_ids.delete(x.dataset.event);updateSelected()});document.querySelectorAll(`#${container} [data-add]`).forEach(x=>x.onclick=()=>{selected_event_ids.add(x.dataset.add);renderEvents();loadCharacterEvents();updateSelected()});document.querySelectorAll(`#${container} [data-detail]`).forEach(x=>x.onclick=()=>showDetail(x.dataset.detail))}
async function showDetail(id){try{const d=details.get(id)||await api({action:'schedule_event_detail',event_id:id});details.set(id,d.event);const e=d.event;$('detailTitle').textContent=e.title;$('detailMeta').textContent=`${e.date} ${e.start_time||''} · ${eventLocation(e)}`;const programme=(e.programme||[]).map(x=>`<li>${x.composer?x.composer+' · ':''}${x.title}</li>`).join('')||'<li>暂无 programme</li>';const credits=(e.credits||[]).map(x=>`<li><strong>${x.role}</strong>：${x.artist_name}${x.character?' · '+x.character:''}</li>`).join('')||'<li>暂无 credits</li>';$('detailBody').innerHTML=`<div class="details"><h4>Programme</h4><ul>${programme}</ul><h4>Credits</h4><ul>${credits}</ul>${e.ticket_url?`<p><a href="${e.ticket_url}" target="_blank" rel="noopener">购票页面 →</a></p>`:''}</div>`;$('detail').showModal()}catch(e){alert(e.message)}}
function generate(){const chosen=events.filter(e=>selected_event_ids.has(e.event_id)).sort((a,b)=>(a.date+' '+(a.start_time||'')).localeCompare(b.date+' '+(b.start_time||'')));$('schedule').innerHTML=chosen.map(e=>{const d=details.get(e.event_id),p=(d?.programme||[]).map(x=>x.composer?`${x.composer} · ${x.title}`:x.title).join('；')||'Programme 详情';const c=(d?.credits||[]).filter(x=>['conductor','stage_director','singer','soloist','orchestra','actor'].some(k=>String(x.role).toLowerCase().includes(k))).map(x=>`${x.artist_name}${x.character?'（'+x.character+'）':''}`).join('、');return `<article class="schedule-item"><div><strong>${e.date}</strong><br>${e.start_time||''}</div><div><h3>${e.title}</h3><div class="meta">${eventLocation(e)}</div><div>${p}</div><div class="meta">${c||'核心 credits 详情可点击演出详情查看'}</div></div></article>`}).join('');$('schedulePanel').hidden=false;$('schedulePanel').scrollIntoView({behavior:'smooth'})}
async function init(){ $('dateFrom').value='2026-09-01';$('dateTo').value='2027-06-30';try{options=await api({action:'schedule_options'});$('eventType').innerHTML='<option value="">全部类型</option>'+(options.event_types||[]).map(x=>`<option value="${x.value}">${x.label}</option>`).join('');renderChoices();if(window.scheduleProgressiveRefresh)window.scheduleProgressiveRefresh()}catch(e){$('filterStatus').textContent=e.message;$('filterStatus').className='status error'}}
$('locationSearch').oninput=renderChoices;$('search').onclick=async()=>{ $('filterStatus').textContent='正在查询…';try{const d=await api({action:'schedule_events',date_from:$('dateFrom').value,date_to:$('dateTo').value,cities:selected('city'),organizations:selected('organization'),venues:selected('venue'),event_type:$('eventType').value});events=d.events||[];$('resultHint').textContent=`找到 ${events.length} 场演出`;renderEvents();$('filterStatus').textContent=''}catch(e){$('filterStatus').textContent=e.message;$('filterStatus').className='status error'}};$('generate').onclick=generate;$('closeDetail').onclick=()=>$('detail').close();init();
</script><script>
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function humanizeRole(role){const value=String(role||'').trim();if(!value)return 'Artist';return value.replace(/[_-]+/g,' ').replace(/\b\w/g,ch=>ch.toUpperCase())}
const presentationRoles={conductor:'Conductor',stage_director:'Stage Director',director:'Stage Director',set_designer:'Set Design',sets:'Sets',costume_designer:'Costumes',costumes:'Costumes',lighting_designer:'Lighting',lighting:'Lighting',chorus_master:'Chorus Master',choreography:'Choreography',dramaturg:'Dramaturgy'};
function normalizedUi(value){return String(value||'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,'_')}
const presentationRoleAliases={direction_musicale:'conductor',mise_en_scene:'stage_director',lumieres:'lighting',decors:'sets',chef_des_choeurs:'chorus_master',chef_des_chœurs:'chorus_master',chorégraphe:'choreography',choregraphe:'choreography'};
function formattedRole(role){const key=normalizedUi(role);return presentationRoles[presentationRoleAliases[key]||key]||humanizeRole(role)}
function renderProgramme(programme){return (programme||[]).sort((a,b)=>(a.order||0)-(b.order||0)).map(x=>`<li>${escapeHtml(x.composer?x.composer+' · ':'')}${escapeHtml(x.title||'')}</li>`).join('')||'<li class="hint">暂无 programme</li>'}
function renderPresentationCredits(event){const credits=event.credits||[],type=String(event.event_type||'').toLowerCase(),opera=type==='opera'||type==='operetta';if(!opera){const artists=credits.map(x=>{const role=String(x.role||'').toLowerCase();const independent=['orchestra','ensemble','choir'].includes(role);return `<li>${escapeHtml(x.artist_name||'')}${independent?'':` · ${escapeHtml(formattedRole(x.role))}`}</li>`}).join('')||'<li class="hint">暂无 artists</li>';return `<h4>Artists</h4><ul>${artists}</ul>`}const cast=credits.filter(x=>x.character&&['performer','singer'].includes(String(x.role||'').toLowerCase()));const castHtml=cast.map(x=>`<li><span>${escapeHtml(x.character)}</span><strong>${escapeHtml(x.artist_name||'')}</strong></li>`).join('')||'<li class="hint">暂无 cast</li>';const groups=new Map();credits.filter(x=>!x.character).forEach(x=>{const label=formattedRole(x.role);if(!groups.has(label))groups.set(label,[]);groups.get(label).push(x.artist_name||'')});const teamHtml=[...groups].map(([label,names])=>`<div class="team-group"><h5>${escapeHtml(label)}</h5><ul>${names.map(name=>`<li>${escapeHtml(name)}</li>`).join('')}</ul></div>`).join('')||'<div class="hint">暂无 artistic team</div>';return `<h4>Cast</h4><ul class="cast-list">${castHtml}</ul><h4>Artistic Team</h4>${teamHtml}`}
showDetail=async function(id){try{const d=details.get(id)||await api({action:'schedule_event_detail',event_id:id});details.set(id,d.event);const e=d.event;$('detailTitle').textContent=e.title;$('detailMeta').textContent=`${e.date} ${e.start_time||''} · ${e.organization} · ${e.venue}`;const opera=['opera','operetta'].includes(String(e.event_type||'').toLowerCase());$('detailBody').innerHTML=`<div class="details"><h4>Programme</h4><ul>${renderProgramme(e.programme)}</ul>${renderPresentationCredits(e)}</div>`;$('detail').showModal()}catch(error){alert(error.message)}};
$("characterQuery").oninput=async()=>{const q=$("characterQuery").value.trim();if(!q){characterChoices=[];selectedCharacter=null;renderCharacterSuggestions();return}try{characterChoices=(await api({action:"character_options",query:q})).characters||[];renderCharacterSuggestions()}catch(e){$("characterStatus").textContent=e.message;$("characterStatus").className="status error"}};
</script><script>
// Artist Search extension. The organization checkbox panel is intentionally hidden;
// organization remains available as event metadata and in API provenance.
const orgBox=$('organizations');if(orgBox&&orgBox.parentElement)orgBox.parentElement.hidden=true;
const artistPanel=document.createElement('section');artistPanel.className='panel';artistPanel.innerHTML='<h2 style="margin:0">Artist Search</h2><div class="hint">搜索歌手、音乐家、指挥、导演、乐团及其他演出艺术家。</div><div class="field" style="margin-top:10px"><label for="artistQuery">Artist</label><input id="artistQuery" autocomplete="off" placeholder="例如 Kate Lindsey、Leonardo Sini、Herbert Fritsch"></div><div id="artistSuggestions" class="choices"></div><div id="artistStatus" class="status"></div><div id="artistEvents"></div>';
const eventsPanel=$('events')?.closest('.panel');if(eventsPanel)eventsPanel.parentElement.insertBefore(artistPanel,eventsPanel);

<script>
// Venue filter presentation:
// selected venues > preferred venues > other venues
// collapsed state shows two visual rows; selected venues are never hidden.
(function(){
  const venueBox = document.getElementById('venues');
  if(!venueBox) return;

  const preferredVenues = {
    paris: [
      'opera bastille',
      'palais garnier'
    ]
  };

  let venueExpanded = false;
  let venueUpdateScheduled = false;

  function normalizeVenueName(value){
    return String(value || '')
      .normalize('NFKD')
      .replace(/[\u0300-\u036f]/g, '')
      .trim()
      .toLowerCase();
  }

  const toggle = document.createElement('button');
  toggle.type = 'button';
  toggle.className = 'venue-collapse-control';
  toggle.hidden = true;
  venueBox.insertAdjacentElement('afterend', toggle);

  const style = document.createElement('style');
  style.textContent = `
      #venues .choice[hidden]{
      display:none !important;
    }

    .venue-collapse-control{
     display:inline-flex;
     align-items:center;
     justify-content:center;
     margin-top:7px;
     padding:5px 9px;
     border:1px solid #c8cdc5;
     border-radius:4px;
     background:#fff;
     color:var(--forest);
     font-size:12px;
     font-weight:700;
     line-height:1.4;
}

   .venue-collapse-control:hover,
   .venue-collapse-control:focus-visible{
     background:var(--soft);
     border-color:var(--forest);
     text-decoration:none;
}

    .venue-collapse-control[hidden]{
      display:none;
    }
  `;
  document.head.appendChild(style);

  function venueData(name){
    return (options.venues || []).find(
      venue => venue.name === name
    ) || {};
  }

  function priorityFor(label, originalIndex){
    const input = label.querySelector('[data-progress-venue]');
    const name = input?.dataset.progressVenue || '';

    if(selectedVenues.has(name)){
      return [0, 0, originalIndex];
    }

    const venue = venueData(name);
    const city = normalizeVenueName(venue.city);
    const preferred = preferredVenues[city] || [];
    const preferredIndex = preferred.indexOf(
      normalizeVenueName(name)
    );

    if(preferredIndex !== -1){
      return [1, preferredIndex, originalIndex];
    }

    return [2, 0, originalIndex];
  }

  function comparePriority(a, b){
    for(let i = 0; i < a.rank.length; i++){
      if(a.rank[i] !== b.rank[i]){
        return a.rank[i] - b.rank[i];
      }
    }
    return 0;
  }

  function applyVenueLayout(){
    const labels = [...venueBox.querySelectorAll('.choice')];

    if(!labels.length){
      toggle.hidden = true;
      return;
    }

    const ranked = labels
      .map((label, index) => ({
        label,
        rank: priorityFor(label, index)
      }))
      .sort(comparePriority);

    const currentOrder = [...venueBox.querySelectorAll('.choice')];

    const orderChanged = ranked.some(
      (item, index) => item.label !== currentOrder[index]
    );

    if(orderChanged){
      ranked.forEach(item => venueBox.appendChild(item.label));
    }

    const ordered = ranked.map(item => item.label);

    ordered.forEach(label => {
      label.hidden = false;
    });

    if(venueExpanded){
      toggle.hidden = false;
      toggle.textContent = '−';
      toggle.setAttribute('aria-label', '收起场馆');
      return;
    }

    const positions = ordered.map(label => {
      const input = label.querySelector('[data-progress-venue]');
      const name = input?.dataset.progressVenue || '';

      return {
        label,
        name,
        top: label.offsetTop,
        selected: selectedVenues.has(name)
      };
    });

    const rowTops = [];

    positions.forEach(item => {
      if(!rowTops.some(top => Math.abs(top - item.top) <= 2)){
        rowTops.push(item.top);
      }
    });

    rowTops.sort((a, b) => a - b);

    if(rowTops.length <= 2){
      toggle.hidden = true;
      return;
    }

    const secondRowTop = rowTops[1];
    let hiddenCount = 0;

    positions.forEach(item => {
      const outsideTwoRows = item.top > secondRowTop + 2;

      if(outsideTwoRows && !item.selected){
        item.label.hidden = true;
        hiddenCount++;
      }
    });

    if(hiddenCount){
      toggle.hidden = false;
      toggle.textContent = `+${hiddenCount}`;
      toggle.setAttribute(
        'aria-label',
        `展开另外 ${hiddenCount} 个场馆`
      );
    }else{
      toggle.hidden = true;
    }
  }

  function scheduleVenueLayout(){
    if(venueUpdateScheduled) return;

    venueUpdateScheduled = true;

    requestAnimationFrame(() => {
      venueUpdateScheduled = false;
      applyVenueLayout();
    });
  }

  toggle.onclick = () => {
    venueExpanded = !venueExpanded;
    applyVenueLayout();
  };

  const observer = new MutationObserver(() => {
    scheduleVenueLayout();
  });

  observer.observe(venueBox, {
    childList: true
  });

  window.addEventListener('resize', scheduleVenueLayout);

  scheduleVenueLayout();
})();
</script>
